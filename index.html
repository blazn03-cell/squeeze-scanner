const SECTOR_MAP = {
  semis:   { etfs:["SMH","SOXX"], index:["QQQ","SPY"], names:["NVDA","AMD","AVGO","MU","INTC","QCOM","TXN","SMCI","ASML","TSM","ARM","MRVL","LRCX","AMAT","KLAC"] },
  megatech:{ etfs:["XLK","QQQ"],  index:["QQQ","SPY"], names:["AAPL","MSFT","GOOGL","GOOG","META","AMZN","ORCL","CRM","ADBE","NFLX","PLTR"] },
  banks:   { etfs:["XLF","KRE"],  index:["SPY","DIA"], names:["JPM","BAC","WFC","C","GS","MS","SCHW","USB","PNC"] },
  energy:  { etfs:["XLE","OIH"],  index:["SPY"],       names:["XOM","CVX","COP","SLB","OXY","PSX","MPC","HAL"] },
  health:  { etfs:["XLV","IBB"],  index:["SPY"],       names:["UNH","JNJ","LLY","PFE","MRK","ABBV","AMGN","GILD","BMY"] },
  consumer:{ etfs:["XLY","XRT"],  index:["SPY"],       names:["AMZN","TSLA","HD","MCD","NKE","SBUX","LOW","TGT"] },
  staples: { etfs:["XLP"],        index:["SPY"],       names:["WMT","COST","PG","KO","PEP","PM","MO"] },
  utils:   { etfs:["XLU"],        index:["SPY"],       names:["NEE","DUK","SO","D","AEP"] },
  reits:   { etfs:["XLRE","IYR"], index:["SPY"],       names:["PLD","AMT","EQIX","SPG","O"] },
  crypto:  { etfs:["BITO"],       index:["QQQ"],       names:["MSTR","COIN","MARA","RIOT","CLSK","HOOD"] },
};
const TICKER_RE = /\b([A-Z]{1,5})\b/g;
const TICKER_STOPWORDS = new Set(["A","I","AI","AN","AND","ARE","AS","AT","BE","BUT","BY","CEO","CFO","COO","CPI","PPI","PCE","GDP","FDA","SEC","FOMC","ETF","EPS","FOR","FROM","HAS","IN","IS","IT","ITS","NEW","NOT","OF","ON","OR","THE","TO","UP","US","USA","VS","WAS","WITH","Q1","Q2","Q3","Q4","YOY","QOQ","M&A","IPO","NFP","ISM","PMI","EU","UK","UN","GM","AM","PM","ET","OPEC","NATO","IMF","WTI"]);

function extractTickers(headline, explicitTickers) {
  const out = new Set();
  (explicitTickers || []).forEach(t => { if (t) out.add(String(t).toUpperCase()); });
  const h = String(headline || "");
  // $TICKER form is unambiguous
  for (const m of h.matchAll(/\$([A-Za-z]{1,5})\b/g)) out.add(m[1].toUpperCase());
  // bare caps: only accept if we recognise it, to avoid mapping "CEO" to a stock
  const known = new Set(Object.values(SECTOR_MAP).flatMap(s => s.names)
    .concat(INDEX_TIER.MEGA.names, INDEX_TIER.LARGE.names, ["SPY","QQQ","IWM","DIA","TLT","GLD","VIX","UVXY"]));
  for (const m of h.matchAll(TICKER_RE)) {
    const t = m[1];
    if (!TICKER_STOPWORDS.has(t) && known.has(t)) out.add(t);
  }
  return [...out];
}

function indexTierOf(ticker) {
  if (INDEX_TIER.MEGA.names.includes(ticker))  return { tier:"MEGA",  weight:1.00 };
  if (INDEX_TIER.LARGE.names.includes(ticker)) return { tier:"LARGE", weight:0.62 };
  if (["SPY","QQQ","IWM","DIA"].includes(ticker)) return { tier:"INDEX", weight:1.00 };
  return { tier:"OTHER", weight:0.28 };
}

// NEWS → COMPANY → SECTOR → ETF → INDEX. Relationships only; direction is NOT
// assumed to propagate unchanged, it is carried with a damping factor.
function propagate(tickers, category) {
  const chain = { direct:[...tickers], sectors:[], etfs:[], indices:[] };
  for (const t of tickers) {
    for (const [name, s] of Object.entries(SECTOR_MAP)) {
      if (s.names.includes(t)) {
        if (!chain.sectors.includes(name)) chain.sectors.push(name);
        s.etfs.forEach(e => { if (!chain.etfs.includes(e)) chain.etfs.push(e); });
        s.index.forEach(i => { if (!chain.indices.includes(i)) chain.indices.push(i); });
      }
    }
  }
  if (CATEGORIES[category]?.macro) ["SPY","QQQ","IWM","DIA"].forEach(i => { if (!chain.indices.includes(i)) chain.indices.push(i); });
  return chain;
}

// ── IMPACT ───────────────────────────────────────────────────────────────────
function scoreImpact({ category, sourceTier, tickers, surprise, marketOpen, isNovel, sourceCount }) {
  const cat = CATEGORIES[category] || CATEGORIES.OTHER;
  let impact = cat.base;
  impact *= SOURCE_TIERS[sourceTier].weight;
  // entity relevance — a mega-cap headline matters more to the tape
  const best = (tickers || []).reduce((a, t) => Math.max(a, indexTierOf(t).weight), cat.macro ? 1.0 : 0.28);
  impact *= (0.55 + 0.45 * best);
  // surprise magnitude, when we have real numbers
  if (surprise && Number.isFinite(surprise.actual) && Number.isFinite(surprise.consensus)) {
    const denom = Math.abs(surprise.consensus) > 1e-9 ? Math.abs(surprise.consensus) : 1;
    const rel = Math.abs((surprise.actual - surprise.consensus) / denom);
    impact *= (1 + Math.min(0.35, rel * 1.4));
  }
  if (marketOpen === false) impact *= 0.88;             // still matters, lands later
  if (isNovel === false) impact *= 0.55;                 // repeat of known information
  if ((sourceCount || 1) >= 3) impact *= 1.06;           // corroborated
  return Math.max(0, Math.min(100, Math.round(impact)));
}

const IMPACT_BANDS = [[90,"MARKET-MOVING","#ff3355"],[80,"CRITICAL","#ff5577"],[60,"MAJOR","#ff9955"],
                      [40,"RELEVANT","#ffe033"],[20,"MINOR","#88aacc"],[0,"NOISE","#7591a8"]];
const impactBand = v => (IMPACT_BANDS.find(b => v >= b[0]) || IMPACT_BANDS.at(-1));

// ── CONFIDENCE ───────────────────────────────────────────────────────────────
function scoreConfidence({ sourceTier, sourceCount, tickers, hasPrimaryDoc, conflicting, headline }) {
  let c = 100 * SOURCE_TIERS[sourceTier].weight;
  c += Math.min(18, ((sourceCount || 1) - 1) * 7);       // independent corroboration
  if (hasPrimaryDoc) c += 12;
  if (!tickers || tickers.length === 0) c -= 20;          // could not map to anything
  else if (tickers.length > 6) c -= 10;                   // mapped to everything = mapped to nothing
  if (conflicting) c -= 25;
  if (RUMOUR_PATTERNS.some(r => r.test(String(headline || "")))) c -= 30;
  if (!/\d/.test(String(headline || ""))) c -= 5;         // no figures = softer claim
  return Math.max(0, Math.min(100, Math.round(c)));
}

// ── DECAY ────────────────────────────────────────────────────────────────────
function decayedImpact(impact, category, ageMinutes) {
  const hl = (CATEGORIES[category] || CATEGORIES.OTHER).halfLifeMin;
  if (!(ageMinutes > 0)) return impact;
  return Math.max(0, Math.round(impact * Math.pow(0.5, ageMinutes / hl)));
}

// ── NORMALIZATION PIPELINE ───────────────────────────────────────────────────
// SOURCE → INGEST → NORMALIZE → ENTITIES → TICKERS → CATEGORY → DEDUPE →
// VERIFY → IMPACT → DIRECTION → CONFIDENCE → RELEVANCE → ALERT → OVERLAY
function normalizeNewsItem(raw, nowMs) {
  const headline = String(raw.headline ?? raw.title ?? raw.text ?? "").trim();
  if (!headline) return null;
  const source = raw.source ?? raw.publisher ?? raw.provider ?? "";
  const tsRaw = raw.timestamp ?? raw.created_at ?? raw.published_at ?? raw.time ?? null;
  const ts = tsRaw ? new Date(tsRaw).getTime() : nowMs;
  const tier = classifySource(source, headline);
  const category = raw.category && CATEGORIES[raw.category] ? raw.category : classifyCategory(headline);
  const tickers = extractTickers(headline, raw.tickers ?? raw.symbols ?? (raw.ticker ? [raw.ticker] : []));
  return {
    id: raw.id || `${ts}-${headline.slice(0, 48)}`,
    headline, source, sourceTier: tier, category, tickers,
    timestamp: Number.isFinite(ts) ? ts : nowMs,
    surprise: raw.surprise || null,
    hasPrimaryDoc: tier === 1 || !!raw.primary_doc_url,
    raw,
  };
}

// Collapse the same story from N outlets into ONE catalyst event.
function eventKey(item) {
  const words = item.headline.toLowerCase()
    .replace(/[^a-z0-9 ]/g, " ").split(/\s+/)
    .filter(w => w.length > 3 && !["that","this","with","from","have","been","will","said","after","says"].includes(w))
    .slice(0, 6).sort().join("-");
  return `${item.category}|${(item.tickers[0] || "MACRO")}|${words}`;
}

function buildCatalystEvents(rawItems, opts = {}) {
  const now = opts.now ?? Date.now();
  const marketOpen = opts.marketOpen ?? null;
  const knownIds = opts.knownIds instanceof Set ? opts.knownIds : new Set();
  const items = (rawItems || []).map(r => normalizeNewsItem(r, now)).filter(Boolean);

  const groups = new Map();
  for (const it of items) {
    const k = eventKey(it);
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(it);
  }

  const events = [];
  for (const [key, group] of groups) {
    group.sort((a, b) => a.timestamp - b.timestamp);
    const primary = group.reduce((best, x) => (x.sourceTier < best.sourceTier ? x : best), group[0]);
    const firstSeen = group[0].timestamp, latest = group.at(-1).timestamp;
    const sourceCount = new Set(group.map(g => g.source || g.sourceTier)).size;
    const tickers = [...new Set(group.flatMap(g => g.tickers))];
    const surprise = group.find(g => g.surprise)?.surprise || null;
    const hasPrimaryDoc = group.some(g => g.hasPrimaryDoc);
    const dirs = group.map(g => scoreDirection({ headline: g.headline, category: primary.category, surprise }));
    const nonZero = dirs.filter(d => d !== 0);
    const conflicting = nonZero.length > 1 && nonZero.some(d => d > 0) && nonZero.some(d => d < 0);
    const direction = nonZero.length ? Math.round(nonZero.reduce((a, b) => a + b, 0) / nonZero.length) : 0;
    const isNovel = !knownIds.has(key);
    const impact = scoreImpact({ category: primary.category, sourceTier: primary.sourceTier, tickers,
                                 surprise, marketOpen, isNovel, sourceCount });
    const confidence = scoreConfidence({ sourceTier: primary.sourceTier, sourceCount, tickers,
                                         hasPrimaryDoc, conflicting, headline: primary.headline });
    const ageMin = Math.max(0, (now - latest) / 60000);
    events.push({
      key, headline: primary.headline, source: primary.source, sourceTier: primary.sourceTier,
      category: primary.category, tickers, sourceCount, firstSeen, latest, ageMin,
      status: confirmationStatus(primary.sourceTier, sourceCount, hasPrimaryDoc),
      impact, impactNow: decayedImpact(impact, primary.category, ageMin),
      direction, confidence, conflicting, surprise, isNovel,
      propagation: propagate(tickers, primary.category),
      headlines: group.map(g => ({ h: g.headline, s: g.source, t: g.timestamp })),
    });
  }
  events.sort((a, b) => (b.impactNow - a.impactNow) || (b.latest - a.latest));
  return events;
}

// ── ALERT PRIORITY ───────────────────────────────────────────────────────────
function alertPriority(ev, watchlist) {
  const onWatch = (watchlist || []).some(t => ev.tickers.includes(t));
  const i = ev.impactNow;
  if (i >= 85 && ev.confidence >= 60) return 0;
  if (i >= 70 || (onWatch && i >= 55)) return 1;
  if (i >= 45 || (onWatch && i >= 30)) return 2;
  return 3;
}
const PRIORITY_META = [
  { label:"P0 CRITICAL",      color:"#ff3355" },
  { label:"P1 HIGH",          color:"#ff9955" },
  { label:"P2 MEDIUM",        color:"#ffe033" },
  { label:"P3 INFORMATIONAL", color:"#7591a8" },
];

// ── FUSION ───────────────────────────────────────────────────────────────────
// Reads the technical dimensions. Never writes them. There is no subtraction
// anywhere in this function — that is the whole point.
const FUSION_STATES = {
  ALIGNED_BULLISH:        { label:"CATALYST + TECHNICAL ALIGNED (BULL)", icon:"🔥", color:"#00ff88" },
  ALIGNED_BEARISH:        { label:"CATALYST + TECHNICAL ALIGNED (BEAR)", icon:"🔥", color:"#ff3355" },
  CONFLICT:               { label:"TECHNICAL / CATALYST CONFLICT",       icon:"⚠",  color:"#ffaa44" },
  HIGH_EVENT_RISK:        { label:"HIGH EVENT RISK",                     icon:"⚠",  color:"#ff5577" },
  WAITING_FOR_RELEASE:    { label:"WAITING FOR RELEASE",                 icon:"⏳", color:"#66ccff" },
  POST_EVENT_CONFIRMATION:{ label:"POST-EVENT PRICE DISCOVERY",          icon:"🔎", color:"#cc88ff" },
  CATALYST_ONLY:          { label:"CATALYST, NO TECHNICAL SETUP",        icon:"📡", color:"#88aacc" },
  TECHNICAL_ONLY:         { label:"TECHNICAL ONLY",                      icon:"📈", color:"#9fb5c8" },
  NORMAL:                 { label:"NORMAL CONDITIONS",                   icon:"·",  color:"#7591a8" },
};

function fuseState({ technical, news, eventProximityMin }) {
  const tDir = technical?.direction ?? 0;
  const tScore = technical?.score ?? 0;
  const hasTech = tScore >= 55 && tDir !== 0;
  const ni = news?.impactNow ?? 0;
  const nd = news?.direction ?? 0;
  const nc = news?.confidence ?? 0;
  const hasNews = ni >= 40;

  // An imminent scheduled release dominates: direction is unknown by definition.
  if (Number.isFinite(eventProximityMin) && eventProximityMin >= 0 && eventProximityMin <= 60)
    return { state:"WAITING_FOR_RELEASE", note:`Scheduled release in ${Math.round(eventProximityMin)} min. Direction is unknown until it prints.` };
  if (hasNews && ni >= 80 && Math.abs(nd) < 25)
    return { state:"HIGH_EVENT_RISK", note:"Large catalyst with no clear direction yet. Size down or stand aside." };
  if (hasNews && news.ageMin <= 30 && Math.abs(nd) >= 25)
    if (!hasTech) return { state:"CATALYST_ONLY", note:"Catalyst is live but the technical setup does not qualify." };

  if (hasTech && hasNews && nc >= 50) {
    const agree = (tDir > 0 && nd > 20) || (tDir < 0 && nd < -20);
    const oppose = (tDir > 0 && nd < -20) || (tDir < 0 && nd > 20);
    if (agree)  return { state: tDir > 0 ? "ALIGNED_BULLISH" : "ALIGNED_BEARISH",
                         note:"Price structure and the catalyst point the same way." };
    if (oppose) return { state:"CONFLICT",
                         note:`Technical direction ${tDir > 0 ? "+" : ""}${tDir} against news direction ${nd > 0 ? "+" : ""}${nd}. Do not read the V4 score as normal conditions.` };
  }
  if (hasNews && news.ageMin <= 120 && !hasTech)
    return { state:"POST_EVENT_CONFIRMATION", note:"Catalyst has landed. Watch how price actually responds." };
  if (hasNews && !hasTech) return { state:"CATALYST_ONLY", note:"Catalyst present, technical setup does not qualify." };
  if (hasTech && !hasNews) return { state:"TECHNICAL_ONLY", note:"No material catalyst detected. Technical read stands on its own." };
  return { state:"NORMAL", note:"Nothing material on either side." };
}

// ── SCHEDULED MACRO CALENDAR ─────────────────────────────────────────────────
// Only RULE-DERIVABLE events are generated. Dates that are published rather
// than derivable (CPI, PPI, PCE, FOMC, GDP) are NOT guessed — they come from
// MACRO_SEED, which ships empty and is meant to be filled from the official
// calendar or a backend. An empty seed shows "not loaded", never a fake date.
const MACRO_SEED = [
  // { date:"2026-08-12", timeET:"08:30", name:"CPI", importance:"CRITICAL", consensus:null },
];

const IMPORTANCE = {
  CRITICAL: { alertLadder:[10080, 1440, 60, 15, 0], color:"#ff3355" },
  HIGH:     { alertLadder:[1440, 60, 0],            color:"#ff9955" },
  MEDIUM:   { alertLadder:[1440, 0],                color:"#ffe033" },
  LOW:      { alertLadder:[0],                      color:"#7591a8" },
};

function etParts(d) {
  // Intl gives us ET without pulling in a tz library.
  const f = new Intl.DateTimeFormat("en-US", { timeZone:"America/New_York",
    year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", weekday:"short", hour12:false });
  const p = Object.fromEntries(f.formatToParts(d).map(x => [x.type, x.value]));
  return { y:+p.year, m:+p.month, d:+p.day, hh:+p.hour % 24, mm:+p.minute, wd:p.weekday };
}

function deriveScheduledEvents(nowMs, daysAhead = 21) {
  const out = [];
  const push = (dt, name, importance, note) => out.push({
    ts: dt.getTime(), name, importance, note, derived: true,
  });
  for (let i = 0; i <= daysAhead; i++) {
    const day = new Date(nowMs + i * 86400000);
    const p = etParts(day);
    const at = (hh, mm) => {
      // build a UTC instant for hh:mm ET on that calendar day
      const guess = new Date(Date.UTC(p.y, p.m - 1, p.d, hh + 4, mm));   // EDT
      const chk = etParts(guess);
      if (chk.hh === hh && chk.mm === mm) return guess;
      return new Date(Date.UTC(p.y, p.m - 1, p.d, hh + 5, mm));          // EST
    };
    // Weekly jobless claims — every Thursday 08:30 ET
    if (p.wd === "Thu") push(at(8, 30), "Initial Jobless Claims", "MEDIUM", "Weekly. Rule-derived.");
    // NFP — first Friday of the month 08:30 ET
    if (p.wd === "Fri" && p.d <= 7) push(at(8, 30), "Nonfarm Payrolls", "CRITICAL", "First Friday. Rule-derived.");
    // Triple witching — third Friday of Mar/Jun/Sep/Dec
    if (p.wd === "Fri" && p.d >= 15 && p.d <= 21 && [3, 6, 9, 12].includes(p.m))
      push(at(16, 0), "Triple Witching", "HIGH", "Third Friday of quarter-end month. Rule-derived.");
    // Monthly opex — third Friday
    else if (p.wd === "Fri" && p.d >= 15 && p.d <= 21)
      push(at(16, 0), "Monthly Options Expiration", "MEDIUM", "Third Friday. Rule-derived.");
  }
  for (const s of MACRO_SEED) {
    const [hh, mm] = String(s.timeET || "08:30").split(":").map(Number);
    const [Y, M, D] = String(s.date).split("-").map(Number);
    const guess = new Date(Date.UTC(Y, M - 1, D, hh + 4, mm));
    const chk = etParts(guess);
    const dt = (chk.hh === hh) ? guess : new Date(Date.UTC(Y, M - 1, D, hh + 5, mm));
    out.push({ ts: dt.getTime(), name: s.name, importance: s.importance || "HIGH",
               note:"From MACRO_SEED.", consensus: s.consensus ?? null, derived: false });
  }
  return out.filter(e => e.ts >= nowMs - 3600000).sort((a, b) => a.ts - b.ts);
}

// Which ladder rung is currently active, so the UI does not alert at every stage.
function calendarAlerts(events, nowMs) {
  return events.map(e => {
    const minsOut = (e.ts - nowMs) / 60000;
    const ladder = IMPORTANCE[e.importance]?.alertLadder || [0];
    const rung = ladder.find(r => minsOut <= r && minsOut > (ladder[ladder.indexOf(r) + 1] ?? -9999));
    return { ...e, minsOut, active: rung !== undefined, rung: rung ?? null };
  });
}

// MACRO_RISK 0-100 from proximity and importance of what is coming.
function macroRisk(events, nowMs) {
  let risk = 0;
  for (const e of events) {
    const mins = (e.ts - nowMs) / 60000;
    if (mins < -60 || mins > 10080) continue;
    const base = { CRITICAL:100, HIGH:70, MEDIUM:40, LOW:15 }[e.importance] || 15;
    const prox = mins <= 0 ? 1 : mins <= 15 ? 1 : mins <= 60 ? 0.85 : mins <= 1440 ? 0.55 : mins <= 4320 ? 0.3 : 0.12;
    risk = Math.max(risk, base * prox);
  }
  return Math.round(risk);
}

// ── EVENT DATABASE + MARKET REACTION (localStorage) ──────────────────────────
// Persists what THIS BROWSER observed. Stats are computed from real samples and
// always report n. Nothing is hard-coded, and no folklore is presented as data.
const INTEL_KEY = "wsh_intel_events_v1";
const INTEL_MAX = 600;

function loadIntel() {
  try { const r = JSON.parse(localStorage.getItem(INTEL_KEY) || "[]"); return Array.isArray(r) ? r : []; }
  catch { return []; }
}
function saveIntel(rows) {
  try { localStorage.setItem(INTEL_KEY, JSON.stringify(rows.slice(-INTEL_MAX))); } catch {}
}

// Record an event with a reference snapshot so reactions can be measured later.
function recordEvents(existing, events, refPrices, nowMs) {
  const seen = new Set(existing.map(r => r.key));
  const add = events.filter(e => !seen.has(e.key)).map(e => ({
    key:e.key, ts:e.latest, recorded:nowMs, category:e.category, headline:e.headline,
    sourceTier:e.sourceTier, status:e.status, impact:e.impact, direction:e.direction,
    confidence:e.confidence, tickers:e.tickers,
    surprise: e.surprise ? { actual:e.surprise.actual ?? null, consensus:e.surprise.consensus ?? null,
                             previous:e.surprise.previous ?? null, revision:e.surprise.revision ?? null } : null,
    ref: refPrices || null,
    reactions: {},           // filled in by captureReaction at 5/15/30/60m
  }));
  return add.length ? [...existing, ...add] : existing;
}

const REACTION_MARKS = [5, 15, 30, 60];
function captureReactions(rows, refPrices, nowMs) {
  if (!refPrices) return rows;
  let changed = false;
  const next = rows.map(r => {
    if (!r.ref) return r;
    const ageMin = (nowMs - r.recorded) / 60000;
    const mark = REACTION_MARKS.find(m => ageMin >= m && r.reactions[`m${m}`] === undefined);
    if (mark === undefined) return r;
    const rx = {};
    for (const sym of Object.keys(r.ref)) {
      const a = r.ref[sym], b = refPrices[sym];
      if (Number.isFinite(a) && Number.isFinite(b) && a > 0) rx[sym] = +(((b - a) / a) * 100).toFixed(3);
    }
    changed = true;
    return { ...r, reactions: { ...r.reactions, [`m${mark}`]: rx } };
  });
  return changed ? next : rows;
}

// Self-improving statistics. Returns null below minSample rather than a number
// that looks authoritative and is not.
function reactionStats(rows, { category, symbol = "QQQ", mark = 30, minSample = 8 } = {}) {
  const vals = rows
    .filter(r => (!category || r.category === category) && r.reactions?.[`m${mark}`]?.[symbol] !== undefined)
    .map(r => ({ move: r.reactions[`m${mark}`][symbol], dir: r.direction }));
  const n = vals.length;
  if (n < minSample) return { n, minSample, insufficient: true };
  const moves = vals.map(v => v.move);
  const abs = moves.map(Math.abs).sort((a, b) => a - b);
  const median = abs[Math.floor(abs.length / 2)];
  const agreed = vals.filter(v => v.dir !== 0 && Math.sign(v.move) === Math.sign(v.dir)).length;
  const directional = vals.filter(v => v.dir !== 0).length;
  return {
    n, insufficient:false, symbol, mark,
    medianAbsMove: +median.toFixed(3),
    meanAbsMove: +(abs.reduce((a, b) => a + b, 0) / n).toFixed(3),
    maxAbsMove: +abs.at(-1).toFixed(3),
    continuationPct: directional ? +((agreed / directional) * 100).toFixed(1) : null,
    reversalPct: directional ? +(((directional - agreed) / directional) * 100).toFixed(1) : null,
    directionalSample: directional,
  };
}

// ── DANGER ZONE ENGINE ───────────────────────────────────────────────────────
// Windows are GENERATED from the day's calendar and live events. The only fixed
// windows are the two structural ones — the opening auction settling and the
// closing cross — which are microstructure facts, not folklore. Everything else
// exists because a specific event exists.
const ZONE_SEV = { 3:{ label:"CRITICAL", color:"#ff3355", bar:"█████" },
                   2:{ label:"ELEVATED", color:"#ff9955", bar:"███──" },
                   1:{ label:"WATCH",    color:"#ffe033", bar:"██───" },
                   0:{ label:"NORMAL",   color:"#7591a8", bar:"─────" } };

function dangerZones(calendarEvents, liveEvents, nowMs) {
  const zones = [];
  const p = etParts(new Date(nowMs));
  const etAt = (hh, mm) => {
    const guess = new Date(Date.UTC(p.y, p.m - 1, p.d, hh + 4, mm));
    return etParts(guess).hh === hh ? guess.getTime() : Date.UTC(p.y, p.m - 1, p.d, hh + 5, mm);
  };
  const dayStart = etAt(4, 0), dayEnd = etAt(20, 0);

  // structural
  zones.push({ start: etAt(9, 30), end: etAt(10, 0), label:"Opening volatility", severity:2, kind:"STRUCTURAL",
               note:"Opening auction imbalances settling. The existing playbook already says no entries here." });
  zones.push({ start: etAt(15, 30), end: etAt(16, 0), label:"Closing flows", severity:1, kind:"STRUCTURAL",
               note:"MOC/LOC imbalances and index rebalancing pressure." });

  // event-driven
  for (const e of calendarEvents || []) {
    if (e.ts < dayStart || e.ts > dayEnd) continue;
    const crit = e.importance === "CRITICAL";
    zones.push({ start: e.ts - 15 * 60000, end: e.ts, label:`Pre-event: ${e.name}`, severity: crit ? 2 : 1,
                 kind:"PRE_EVENT", note:"Liquidity thins ahead of the print. Spreads widen." });
    zones.push({ start: e.ts, end: e.ts + 15 * 60000, label: e.name, severity: crit ? 3 : 2,
                 kind:"EVENT", note:"Release window. Direction is unknown until it prints." });
    zones.push({ start: e.ts + 15 * 60000, end: e.ts + 45 * 60000, label:`Price discovery: ${e.name}`,
                 severity: crit ? 2 : 1, kind:"DISCOVERY", note:"First move frequently unwinds. Let it resolve." });
  }

  // live P0/P1 catalysts create their own window
  for (const ev of liveEvents || []) {
    if (ev.impactNow < 70) continue;
    zones.push({ start: ev.latest, end: ev.latest + 30 * 60000,
                 label:`Breaking: ${ev.headline.slice(0, 46)}${ev.headline.length > 46 ? "…" : ""}`,
                 severity: ev.impactNow >= 85 ? 3 : 2, kind:"BREAKING",
                 note:`Impact ${ev.impactNow}, ${ev.status.toLowerCase()}.` });
  }

  zones.sort((a, b) => a.start - b.start);
  return zones;
}

function activeZone(zones, nowMs) {
  const live = (zones || []).filter(z => nowMs >= z.start && nowMs < z.end);
  if (!live.length) return { severity: 0, labels: [] };
  return { severity: Math.max(...live.map(z => z.severity)), labels: live.map(z => z.label), zones: live };
}

// ── MARKET BRAIN ─────────────────────────────────────────────────────────────
// One card answering: what kind of market am I walking into?
function marketBrain({ feed, events, calendar, zones, nowMs }) {
  const v4s = [];
  const byTicker = {};
  (feed || []).forEach(p => { if (p.v4 && !byTicker[p.ticker]) { byTicker[p.ticker] = p.v4; v4s.push({ t:p.ticker, ...p.v4 }); } });

  const med = arr => { if (!arr.length) return null; const s = [...arr].sort((a, b) => a - b); return s[Math.floor(s.length / 2)]; };
  const biasOf = t => {
    const v = byTicker[t];
    if (!v) return { label:"NO READ", color:"#5a7a92", value:null };
    const l = v.direction === 2 ? "STRONG BULL" : v.direction === 1 ? "BULLISH"
            : v.direction === -1 ? "BEARISH" : v.direction === -2 ? "STRONG BEAR" : "NEUTRAL";
    return { label:l, color: v.direction > 0 ? "#00ff88" : v.direction < 0 ? "#ff3355" : "#7591a8",
             value:v.direction, confidence:v.confidence };
  };

  const confidence = med(v4s.map(v => v.confidence)) ?? null;
  const atrMed = med(v4s.map(v => v.atrPct).filter(Number.isFinite));
  const volatility = atrMed == null ? "NO READ" : atrMed >= 5 ? "EXTREME" : atrMed >= 3 ? "ELEVATED" : atrMed >= 1.5 ? "NORMAL" : "COMPRESSED";
  const liqMed = med(v4s.map(v => v.liquidityScore).filter(Number.isFinite));
  const liquidity = liqMed == null ? "NO READ" : liqMed >= 70 ? "NORMAL" : liqMed >= 50 ? "THIN" : "POOR";

  // News pressure: impact-weighted mean direction, -100..+100
  const weighted = (events || []).filter(e => e.impactNow >= 30);
  const wSum = weighted.reduce((a, e) => a + e.impactNow, 0);
  const newsPressure = wSum > 0
    ? Math.round(weighted.reduce((a, e) => a + e.direction * e.impactNow, 0) / wSum)
    : 0;

  const mRisk = macroRisk(calendar || [], nowMs);
  const zone = activeZone(zones, nowMs);
  const next = (calendar || []).find(e => e.ts >= nowMs) || null;
  const nextMins = next ? (next.ts - nowMs) / 60000 : null;
  const topBreaking = (events || []).filter(e => e.impactNow >= 70).slice(0, 3);

  // Market state
  let marketState, stateColor;
  if (zone.severity === 3)                      { marketState = "CRITICAL EVENT WINDOW";        stateColor = "#ff3355"; }
  else if (mRisk >= 70)                         { marketState = "HIGH EVENT-RISK ENVIRONMENT";  stateColor = "#ff5577"; }
  else if (topBreaking.length)                  { marketState = "BREAKING-NEWS DRIVEN";         stateColor = "#ff9955"; }
  else if (volatility === "EXTREME")            { marketState = "HIGH VOLATILITY";              stateColor = "#ff9955"; }
  else if (zone.severity === 2)                 { marketState = "ELEVATED RISK WINDOW";         stateColor = "#ffaa44"; }
  else if (volatility === "COMPRESSED")         { marketState = "LOW VOLATILITY / COMPRESSED";  stateColor = "#88aacc"; }
  else                                          { marketState = "NORMAL CONDITIONS";            stateColor = "#00ff88"; }

  // SCORE mode
  let scannerMode;
  if (nextMins != null && nextMins <= 60 && (next.importance === "CRITICAL" || next.importance === "HIGH")) scannerMode = "EVENT PREPARATION";
  else if (zone.severity === 3) scannerMode = "STAND ASIDE";
  else if (topBreaking.length) scannerMode = "POST-EVENT PRICE DISCOVERY";
  else if (mRisk >= 60) scannerMode = "REDUCED SIZE";
  else scannerMode = "NORMAL OPERATION";

  // Conflicts — technical vs catalyst, computed per ticker
  const conflicts = [];
  for (const ev of events || []) {
    for (const t of ev.tickers) {
      const tech = byTicker[t];
      if (!tech) continue;
      const f = fuseState({ technical: tech, news: ev, eventProximityMin: null });
      if (f.state === "CONFLICT") conflicts.push({ ticker:t, tech, ev, note:f.note });
    }
  }

  const best = v4s.filter(v => v.score >= 55 && v.direction !== 0)
                  .sort((a, b) => b.score - a.score).slice(0, 5);

  // Plain-language message, assembled from what is actually true right now.
  const bits = [];
  if (best.length) bits.push(`${best.length} qualifying setup${best.length === 1 ? "" : "s"} on the board`);
  else bits.push("No setups currently clear the quality gates");
  if (next && nextMins != null && nextMins <= 1440)
    bits.push(`${next.name} in ${nextMins < 60 ? Math.round(nextMins) + " minutes" : Math.round(nextMins / 60) + " hours"} materially raises event risk`);
  if (topBreaking.length) bits.push(`${topBreaking.length} high-impact headline${topBreaking.length === 1 ? "" : "s"} live`);
  if (conflicts.length) bits.push(`${conflicts.length} technical/catalyst conflict${conflicts.length === 1 ? "" : "s"}`);
  if (liquidity === "POOR") bits.push("liquidity is poor across the board");

  return {
    marketState, stateColor, scannerMode,
    spy: biasOf("SPY"), qqq: biasOf("QQQ"), iwm: biasOf("IWM"),
    confidence, volatility, atrMed, liquidity, liqMed, newsPressure, macroRisk: mRisk,
    nextCatalyst: next, nextMins, zone, zones, topBreaking, conflicts, best,
    message: bits.join(". ") + ".",
    sampleSize: v4s.length,
  };
}

// ── SAFE / PRO MODE ──────────────────────────────────────────────────────────
// Safe Mode does not merely hide columns. It changes which opportunities are
// surfaced at all, by applying hard gates.
const MODE_GATES = {
  safe: {
    label:"SAFE", color:"#00ff88",
    minScore:80, minConfidence:75, minLiquidity:70, maxExtension:1.25, minRvol:1.2,
    requireDirection:true, minTiming:0, blockEventWithinMin:60, blockUnverifiedHighImpact:true,
    note:"Higher bar on every axis, and it stands down near critical events or unverified high-impact headlines.",
  },
  pro: {
    label:"PRO", color:"#ffe033",
    minScore:55, minConfidence:0, minLiquidity:35, maxExtension:99, minRvol:0,
    requireDirection:false, minTiming:-2, blockEventWithinMin:0, blockUnverifiedHighImpact:false,
    note:"Everything the engine sees, including developing setups, conflicts and event trades. Raw factors exposed.",
  },
};

function applyMode(rows, mode, ctx = {}) {
  const g = MODE_GATES[mode] || MODE_GATES.pro;
  const { nextCriticalMins = null, unverifiedHighImpactTickers = new Set() } = ctx;
  const eventBlocked = g.blockEventWithinMin > 0 && Number.isFinite(nextCriticalMins)
                       && nextCriticalMins >= 0 && nextCriticalMins <= g.blockEventWithinMin;
  const out = [], rejected = [];
  for (const r of rows) {
    const v = r.v4 || r;
    const fails = [];
    if ((v.score ?? 0) < g.minScore) fails.push(`SCORE ${v.score} < ${g.minScore}`);
    if ((v.confidence ?? 0) < g.minConfidence) fails.push(`CONF ${v.confidence} < ${g.minConfidence}`);
    if ((v.liquidityScore ?? 0) < g.minLiquidity) fails.push(`LIQ ${v.liquidityScore} < ${g.minLiquidity}`);
    if (Number.isFinite(v.extension) && v.extension > g.maxExtension) fails.push(`EXT ${v.extension} > ${g.maxExtension}`);
    if ((v.rvol ?? 0) < g.minRvol) fails.push(`RVOL ${v.rvol} < ${g.minRvol}`);
    if (g.requireDirection && (v.direction ?? 0) === 0) fails.push("no directional read");
    if ((v.timing ?? 0) < g.minTiming) fails.push(`TIMING ${v.timing} < ${g.minTiming}`);
    if (eventBlocked) fails.push(`critical event in ${Math.round(nextCriticalMins)}m`);
    if (g.blockUnverifiedHighImpact && unverifiedHighImpactTickers.has(r.ticker)) fails.push("unverified high-impact headline");
    (fails.length ? rejected : out).push(fails.length ? { ...r, _rejectedFor: fails } : r);
  }
  return { passed: out, rejected, gates: g, eventBlocked };
}

// ── POLY INTELLIGENCE ────────────────────────────────────────────────────────
// Prediction-market intelligence: research, analytics and paper strategy.
//
// HARD ARCHITECTURAL BOUNDARY — V1 IS READ-ONLY.
// There is no private-key handling, no wallet signing, no order submission and
// no execution path anywhere in this module, and none may be added here. If
// execution is ever built it belongs in a separate, independently audited
// subsystem. A test asserts this file contains no such surface.
//
// Every cost input is an ASSUMPTION you can edit, not a quoted fee schedule.
// Fee terms change and vary by market; this module ships with them at zero and
// makes you choose a scenario, because a pair that looks profitable before
// costs is frequently marginal or negative after them.

const POLY_NO_EXECUTION = Object.freeze({
  privateKeys: false, signing: false, orderSubmission: false, custody: false,
  note: "Research and paper analysis only. No execution surface exists in this build.",
});

// ── COST SCENARIOS ───────────────────────────────────────────────────────────
// entryBps  : charged on notional at entry (per side)
// exitBps   : charged on the $1.00 payout at settlement
// safetyCents: explicit margin subtracted so a "barely positive" edge does not qualify
const COST_SCENARIOS = {
  zero:         { label:"Zero fees (VERIFY)", entryBps:0,   exitBps:0,   safetyCents:0.25,
                  note:"Assumes no trading fee. Verify against current market terms before trusting any edge computed this way." },
  conservative: { label:"Conservative",       entryBps:50,  exitBps:50,  safetyCents:0.50,
                  note:"0.50% on entry notional per side plus 0.50% on settlement. A defensible planning default." },
  stress:       { label:"Stress",             entryBps:100, exitBps:100, safetyCents:0.75,
                  note:"Double the conservative case. Run this before sizing anything." },
};

const POLY_DEFAULTS = Object.freeze({
  scenario: "conservative",
  targetSizeShares: 500,
  minNetEdgeCents: 0.5,
  minLiquidity: 45,
  maxSettlementRisk: 70,
});

// ── SLIPPAGE ─────────────────────────────────────────────────────────────────
// Walks the book when depth is supplied. Falls back to a spread-based estimate
// and labels itself so the UI can say which it used.
function walkBook(levels, shares) {
  if (!Array.isArray(levels) || !levels.length || !(shares > 0)) return null;
  let remaining = shares, cost = 0, filled = 0;
  for (const lv of levels) {
    const px = +lv.price, sz = +lv.size;
    if (!(px > 0) || !(sz > 0)) continue;
    const take = Math.min(remaining, sz);
    cost += take * px; filled += take; remaining -= take;
    if (remaining <= 0) break;
  }
  if (filled <= 0) return null;
  return { avgPrice: cost / filled, filled, shortfall: Math.max(0, shares - filled), complete: remaining <= 0 };
}

function estimateSide(side, shares) {
  const best = +side?.ask;
  const book = walkBook(side?.asks, shares);
  if (book) {
    return { price: book.avgPrice, best, slippage: Math.max(0, book.avgPrice - best),
             fillable: book.complete, shortfall: book.shortfall, method: "BOOK" };
  }
  if (!(best > 0)) return null;
  // No depth: assume half the quoted spread is paid on top, scaled by size.
  const spread = Number.isFinite(+side?.bid) && +side.bid > 0 ? Math.max(0, best - +side.bid) : 0.01;
  const est = spread * 0.5 * Math.min(2, 0.5 + shares / 1000);
  return { price: best + est, best, slippage: est, fillable: null, shortfall: 0, method: "ESTIMATED" };
}

// ── PAIR EDGE ────────────────────────────────────────────────────────────────
// NET EDGE = $1.00 − YES cost − NO cost − entry fees − settlement fees
//                  − slippage − safety margin
function pairEdge(market, opts = {}) {
  const o = { ...POLY_DEFAULTS, ...opts };
  const sc = COST_SCENARIOS[o.scenario] || COST_SCENARIOS.conservative;
  const shares = Math.max(1, o.targetSizeShares);

  const yes = estimateSide(market.yes, shares);
  const no  = estimateSide(market.no,  shares);
  if (!yes || !no) return null;

  const rawCost  = yes.best + no.best;               // quoted, before anything
  const rawEdge  = 1 - rawCost;
  const slippage = yes.slippage + no.slippage;
  const fillCost = yes.price + no.price;             // after slippage
  const entryFee = (yes.price + no.price) * (sc.entryBps / 10000);
  const exitFee  = 1.00 * (sc.exitBps / 10000);
  const safety   = sc.safetyCents / 100;
  const netEdge  = 1 - fillCost - entryFee - exitFee - safety;

  const c = x => +(x * 100).toFixed(2);              // dollars → cents
  return {
    shares, scenario: o.scenario, scenarioLabel: sc.label,
    yesBest: yes.best, noBest: no.best, yesFill: yes.price, noFill: no.price,
    rawCostC: c(rawCost), rawEdgeC: c(rawEdge),
    feesC: c(entryFee + exitFee), entryFeeC: c(entryFee), exitFeeC: c(exitFee),
    slippageC: c(slippage), safetyC: c(safety), netEdgeC: c(netEdge),
    fillMethod: yes.method === "BOOK" && no.method === "BOOK" ? "BOOK" : "ESTIMATED",
    fillable: yes.fillable === false || no.fillable === false ? false
            : yes.fillable === null || no.fillable === null ? null : true,
    shortfall: (yes.shortfall || 0) + (no.shortfall || 0),
    // How much of the raw edge survives costs — the number that actually matters
    survivalPct: rawEdge > 0 ? Math.max(0, Math.min(100, Math.round((netEdge / rawEdge) * 100))) : 0,
  };
}

// ── DIMENSIONS (each 0-100, kept separate on purpose) ────────────────────────
const polyClamp = (x, lo = 0, hi = 100) => Math.max(lo, Math.min(hi, Math.round(x)));

function polyDimensions(market, edge, ctx = {}) {
  const { catalystEvents = [], now = Date.now() } = ctx;

  // EDGE — 0 at break-even, 100 at 3c net
  const polyEdge = edge ? polyClamp((edge.netEdgeC / 3) * 100) : 0;

  // LIQUIDITY — depth at target size, then 24h volume as a fallback signal
  const depth = (market.yes?.depthShares ?? null);
  const depthN = (market.no?.depthShares ?? null);
  const vol = +market.volume24h || 0;
  const depthScore = (depth != null && depthN != null && edge)
    ? polyClamp((Math.min(depth, depthN) / Math.max(1, edge.shares)) * 50)
    : null;
  const volScore = polyClamp(Math.log10(Math.max(1, vol)) * 20);
  const liquidity = depthScore != null ? polyClamp(depthScore * 0.65 + volScore * 0.35) : volScore;

  // EXECUTION QUALITY — tight two-sided quotes are what make passive fills viable
  const spreadY = (Number.isFinite(+market.yes?.bid) && Number.isFinite(+market.yes?.ask))
    ? +market.yes.ask - +market.yes.bid : null;
  const spreadN = (Number.isFinite(+market.no?.bid) && Number.isFinite(+market.no?.ask))
    ? +market.no.ask - +market.no.bid : null;
  const avgSpreadC = (spreadY != null && spreadN != null) ? ((spreadY + spreadN) / 2) * 100 : null;
  const execution = avgSpreadC == null ? 50
    : polyClamp(100 - (avgSpreadC / 3) * 100);      // 0c spread → 100, 3c → 0

  // PAIR CONFIDENCE — can both legs actually be completed at size?
  let pairConf = 50;
  if (edge) {
    pairConf = edge.fillable === true ? 85 : edge.fillable === false ? 20 : 55;
    if (edge.fillMethod === "ESTIMATED") pairConf -= 15;   // we did not see the book
    if (edge.shortfall > 0) pairConf -= 20;
    pairConf += Math.min(15, edge.survivalPct / 8);
  }
  pairConf = polyClamp(pairConf);

  // INVENTORY RISK — higher is worse. One-sided fills held into resolution.
  const held = ctx.inventory || null;
  const imbalance = held && (held.yes + held.no) > 0
    ? Math.abs(held.yes - held.no) / (held.yes + held.no) : 0;
  const minsToRes = market.resolvesAt ? (market.resolvesAt - now) / 60000 : null;
  const inventoryRisk = polyClamp(
    imbalance * 70 + (minsToRes == null ? 20 : minsToRes < 15 ? 30 : minsToRes < 60 ? 20 : 10));

  // SETTLEMENT RISK — higher is worse. Unknown resolution terms are NOT scored low.
  const settlementRisk = market.resolutionClarity === "CLEAR" ? polyClamp(minsToRes != null && minsToRes < 60 ? 12 : 20)
    : market.resolutionClarity === "AMBIGUOUS" ? 80
    : 55;   // unknown — deliberately mid, never optimistic

  // CATALYST RISK — from the news engine. A live catalyst on this topic means
  // the quoted probabilities are about to move under you.
  const linked = linkCatalysts(market, catalystEvents);
  const catalystRisk = polyClamp(linked.reduce((a, e) => Math.max(a, e.impactNow), 0));

  return { polyEdge, liquidity, execution, pairConf, inventoryRisk, settlementRisk,
           catalystRisk, linked, avgSpreadC, minsToRes };
}

// ── STATE ────────────────────────────────────────────────────────────────────
const POLY_STATES = {
  STRONG_PAIR:       { label:"STRONG PAIR OPPORTUNITY", color:"#00ff88" },
  QUALIFIED:         { label:"QUALIFIED",               color:"#00ddff" },
  MARGINAL:          { label:"MARGINAL AFTER COSTS",    color:"#ffe033" },
  NEGATIVE:          { label:"NEGATIVE AFTER COSTS",    color:"#ff5577" },
  THIN:              { label:"INSUFFICIENT LIQUIDITY",  color:"#ff9955" },
  CATALYST_BLOCKED:  { label:"LIVE CATALYST ON THIS MARKET", color:"#ff3355" },
  SETTLEMENT_UNCLEAR:{ label:"RESOLUTION TERMS UNCLEAR",color:"#cc88ff" },
};

function polyState(edge, dims, opts = {}) {
  const o = { ...POLY_DEFAULTS, ...opts };
  if (!edge) return { state:"THIN", note:"No two-sided quote available." };
  if (dims.catalystRisk >= 70)
    return { state:"CATALYST_BLOCKED", note:"A high-impact catalyst is live on this topic — quoted probabilities are moving." };
  if (dims.settlementRisk >= 75)
    return { state:"SETTLEMENT_UNCLEAR", note:"Resolution terms look ambiguous. Edge is meaningless if settlement is disputed." };
  if (edge.netEdgeC <= 0)
    return { state:"NEGATIVE", note:`Raw edge ${edge.rawEdgeC}c does not survive ${edge.feesC}c fees + ${edge.slippageC}c slippage + ${edge.safetyC}c safety.` };
  if (dims.liquidity < o.minLiquidity)
    return { state:"THIN", note:"Edge exists but the book cannot support the target size." };
  if (edge.netEdgeC < o.minNetEdgeCents)
    return { state:"MARGINAL", note:`Net ${edge.netEdgeC}c is below the ${o.minNetEdgeCents}c floor.` };
  if (edge.netEdgeC >= 1.5 && dims.pairConf >= 70 && dims.liquidity >= 65)
    return { state:"STRONG_PAIR", note: dims.execution >= 70 ? "Maker execution preferred." : "Edge is real but spreads argue for patience." };
  return { state:"QUALIFIED", note:"Positive after modelled costs." };
}

// ── TEMPORAL PAIRING ─────────────────────────────────────────────────────────
// The observed strategy class accumulates each side at different moments and
// only completes the pair when combined economics work. This reconstructs that
// from a fill list; it does not assume simultaneous entry.
function reconstructPair(fills, opts = {}) {
  const o = { ...POLY_DEFAULTS, ...opts };
  const sc = COST_SCENARIOS[o.scenario] || COST_SCENARIOS.conservative;
  const rows = [...(fills || [])].sort((a, b) => a.ts - b.ts);
  const acc = { YES:{ qty:0, cost:0 }, NO:{ qty:0, cost:0 } };
  for (const f of rows) {
    const side = String(f.side || "").toUpperCase() === "NO" ? "NO" : "YES";
    const qty = +f.size || 0, px = +f.price || 0;
    if (qty <= 0 || px <= 0) continue;
    acc[side].qty += qty; acc[side].cost += qty * px;
  }
  const wYes = acc.YES.qty > 0 ? acc.YES.cost / acc.YES.qty : null;
  const wNo  = acc.NO.qty  > 0 ? acc.NO.cost  / acc.NO.qty  : null;
  const matched = Math.min(acc.YES.qty, acc.NO.qty);
  const combined = (wYes != null && wNo != null) ? wYes + wNo : null;

  const entryFee = combined != null ? combined * (sc.entryBps / 10000) : 0;
  const exitFee  = 1.00 * (sc.exitBps / 10000);
  const netPerPair = combined != null ? 1 - combined - entryFee - exitFee : null;

  const firstTs = rows[0]?.ts ?? null;
  const completeTs = (() => {
    if (matched <= 0) return null;
    let y = 0, n = 0;
    for (const f of rows) {
      const side = String(f.side || "").toUpperCase() === "NO" ? "NO" : "YES";
      if (side === "YES") y += +f.size || 0; else n += +f.size || 0;
      if (Math.min(y, n) >= matched) return f.ts;
    }
    return null;
  })();

  return {
    fills: rows, weightedYes: wYes, weightedNo: wNo, combined,
    yesQty: acc.YES.qty, noQty: acc.NO.qty, matchedQty: matched,
    unmatchedSide: acc.YES.qty > acc.NO.qty ? "YES" : acc.NO.qty > acc.YES.qty ? "NO" : null,
    unmatchedQty: Math.abs(acc.YES.qty - acc.NO.qty),
    complete: matched > 0 && acc.YES.qty === acc.NO.qty,
    netPerPairC: netPerPair != null ? +(netPerPair * 100).toFixed(2) : null,
    completionMs: (firstTs != null && completeTs != null) ? completeTs - firstTs : null,
  };
}

// ── PAPER LAB ────────────────────────────────────────────────────────────────
// THE accounting rule: realized P&L comes ONLY from pairs that are both matched
// AND resolved. Open inventory is unrealized exposure and is reported
// separately. Counting incomplete pairs as realized profit is the single
// fastest way to produce a backtest that cannot be reproduced live.
function paperLab(pairs, opts = {}) {
  const o = { startingCapital: 10000, ...POLY_DEFAULTS, ...opts };
  const sc = COST_SCENARIOS[o.scenario] || COST_SCENARIOS.conservative;

  let realized = 0, fees = 0, slippage = 0, completedPairs = 0, trades = 0;
  let openCost = 0, openShares = 0, openLegs = 0;
  const equityCurve = [];
  let equity = o.startingCapital, peak = equity, maxDD = 0;

  for (const p of pairs || []) {
    trades += (p.fills?.length || 0);
    const r = p.recon || reconstructPair(p.fills, o);

    // realized: matched AND resolved only
    if (r.matchedQty > 0 && p.resolved === true) {
      const cost = (r.weightedYes + r.weightedNo) * r.matchedQty;
      const entryFee = cost * (sc.entryBps / 10000);
      const exitFee = 1.00 * r.matchedQty * (sc.exitBps / 10000);
      const slip = (+p.slippagePerShare || 0) * r.matchedQty * 2;
      const pnl = (1.00 * r.matchedQty) - cost - entryFee - exitFee - slip;
      realized += pnl; fees += entryFee + exitFee; slippage += slip;
      completedPairs += 1;
      equity += pnl;
      peak = Math.max(peak, equity);
      maxDD = Math.max(maxDD, peak - equity);
      equityCurve.push({ ts: p.resolvedAt ?? null, equity: +equity.toFixed(2) });
    }

    // unrealized: everything not both matched and resolved
    if (r.matchedQty > 0 && p.resolved !== true) {
      openCost += (r.weightedYes + r.weightedNo) * r.matchedQty;
      openShares += r.matchedQty; openLegs += 2;
    }
    if (r.unmatchedQty > 0) {
      const px = r.unmatchedSide === "YES" ? r.weightedYes : r.weightedNo;
      if (Number.isFinite(px)) { openCost += px * r.unmatchedQty; openShares += r.unmatchedQty; openLegs += 1; }
    }
  }

  return {
    startingCapital: o.startingCapital,
    scenario: o.scenario, scenarioLabel: sc.label,
    trades, completedPairs,
    realizedPnL: +realized.toFixed(2),
    fees: +fees.toFixed(2),
    slippage: +slippage.toFixed(2),
    // Explicitly NOT added to realized. This is exposure, not profit.
    openInventory: { legs: openLegs, shares: +openShares.toFixed(2), costBasis: +openCost.toFixed(2) },
    unrealizedNote: "Open inventory is exposure at cost, not profit. It is excluded from realized P&L by design.",
    endingCapital: +equity.toFixed(2),
    maxDrawdown: +maxDD.toFixed(2),
    returnPct: o.startingCapital > 0 ? +((realized / o.startingCapital) * 100).toFixed(2) : 0,
    equityCurve,
  };
}

// ── WALLET INTELLIGENCE ──────────────────────────────────────────────────────
// Every metric carries provenance. Third-party claims are never promoted to
// facts, and are shown as UNVERIFIED with their source named.
const PROVENANCE = {
  OBSERVED:   { label:"OBSERVED",   color:"#00ff88", note:"Read directly from public market/chain data." },
  CALCULATED: { label:"CALCULATED", color:"#00ddff", note:"Arithmetic on observed data. Reproducible." },
  INFERRED:   { label:"INFERRED",   color:"#ffe033", note:"Pattern-detected. Model-dependent — a different model may disagree." },
  UNVERIFIED: { label:"UNVERIFIED", color:"#ff5577", note:"Third-party claim that could not be independently reproduced. Not evidence." },
};

function walletProfile(raw) {
  const m = [];
  const add = (key, label, value, prov, note) => m.push({ key, label, value, prov, note });

  add("pnl",        "Observed P&L",              raw?.pnl ?? null,             raw?.pnl != null ? "OBSERVED" : "UNVERIFIED");
  add("trades",     "Trade count",               raw?.tradeCount ?? null,      "OBSERVED");
  add("markets",    "Markets traded",            raw?.marketCount ?? null,     "OBSERVED");
  add("avgSize",    "Average position size",     raw?.avgPositionSize ?? null, "CALCULATED");
  add("makerRatio", "Maker / taker estimate",    raw?.makerRatio ?? null,      "INFERRED",
      "Maker/taker is not always explicit in public data; this is inferred from fill placement relative to the quote.");
  add("pairFreq",   "Two-sided pair frequency",  raw?.pairFrequency ?? null,   "INFERRED");
  add("pairTime",   "Avg pair completion time",  raw?.avgPairCompletionMs ?? null, "CALCULATED");
  add("dirExp",     "Directional exposure",      raw?.directionalExposure ?? null, "CALCULATED");
  add("rotation",   "Inventory rotation",        raw?.inventoryRotation ?? null,   "INFERRED");
  add("drawdown",   "Drawdown estimate",         raw?.drawdownEstimate ?? null,    "INFERRED",
      "Reconstructed from observable fills; true drawdown depends on positions this data cannot see.");

  // Claims that circulate publicly. Shown, labelled, never promoted.
  for (const [key, label, val, src] of [
    ["winRate", "Win rate", raw?.claimedWinRate ?? null, raw?.claimSource || "third-party claim"],
    ["rr",      "Risk / reward", raw?.claimedRR ?? null, raw?.claimSource || "third-party claim"],
    ["sharpe",  "Sharpe", raw?.claimedSharpe ?? null, raw?.claimSource || "third-party claim"],
  ]) {
    if (val != null) add(key, label, val, "UNVERIFIED", `Source: ${src}. Could not be independently reproduced from public data.`);
  }

  const observedCount = m.filter(x => x.value != null && (x.prov === "OBSERVED" || x.prov === "CALCULATED")).length;
  const unverifiedShown = m.filter(x => x.value != null && x.prov === "UNVERIFIED").length;
  const quality = polyClamp(observedCount * 11 - unverifiedShown * 5);

  return { address: raw?.address ?? null, strategy: raw?.strategy ?? null, metrics: m,
           walletQuality: quality, observedCount, unverifiedShown };
}

// ── CATALYST FUSION ──────────────────────────────────────────────────────────
// Links a prediction market to live catalyst events so the two intelligence
// legs can confirm or contradict each other.
const POLY_TOPICS = [
  { key:"fed",     re:/\bfed\b|fomc|rate cut|rate hike|powell|interest rate/i, cats:["FED_POLICY","MACRO_RELEASE","RATES"] },
  { key:"inflation", re:/\bcpi\b|inflation|\bppi\b|\bpce\b/i,                 cats:["MACRO_RELEASE"] },
  { key:"crypto",  re:/\bbtc\b|bitcoin|\beth\b|ethereum|crypto|solana/i,      cats:["COMMODITY","REGULATORY","GOV_POLICY","FED_POLICY"] },
  { key:"election",re:/election|president|senate|congress|vote|poll/i,        cats:["GOV_POLICY","GEOPOLITICS"] },
  { key:"geo",     re:/\bwar\b|ceasefire|missile|invasion|sanction|tariff/i,  cats:["GEOPOLITICS","TARIFF_TRADE"] },
  { key:"equity",  re:/\bspx\b|\bs&p\b|nasdaq|stock market|recession/i,       cats:["MACRO_RELEASE","FED_POLICY"] },
];

function marketTopics(market) {
  const q = String(market?.question || market?.title || "");
  return POLY_TOPICS.filter(t => t.re.test(q)).map(t => t.key);
}

function linkCatalysts(market, events) {
  const topics = marketTopics(market);
  if (!topics.length) return [];
  const cats = new Set(POLY_TOPICS.filter(t => topics.includes(t.key)).flatMap(t => t.cats));
  return (events || [])
    .filter(e => cats.has(e.category) && e.impactNow >= 40)
    .sort((a, b) => b.impactNow - a.impactNow)
    .slice(0, 5);
}

// Compares a probability move against the catalyst's own direction read.
// AGREE / DISAGREE / NEUTRAL — never a claim about which one is right.
function probabilityConfirmation(market, event, priorProb) {
  const now = +market?.yesProb;
  if (!Number.isFinite(now) || !Number.isFinite(+priorProb)) return null;
  const deltaPts = Math.round((now - priorProb) * 100);
  if (!event || Math.abs(deltaPts) < 2) return { deltaPts, verdict:"NEUTRAL", note:"No material probability move." };
  const agree = (event.direction > 20 && deltaPts > 0) || (event.direction < -20 && deltaPts < 0);
  const oppose = (event.direction > 20 && deltaPts < 0) || (event.direction < -20 && deltaPts > 0);
  return {
    deltaPts, from: Math.round(priorProb * 100), to: Math.round(now * 100),
    verdict: agree ? "CONFIRMS" : oppose ? "CONTRADICTS" : "NEUTRAL",
    note: agree ? "Prediction market moved the same way as the catalyst read."
        : oppose ? "Prediction market moved against the catalyst read — one of them is wrong, and this does not say which."
        : "Move is not clearly aligned either way.",
  };
}

// ── POLY MARKET BRAIN ────────────────────────────────────────────────────────
function polyBrain(scored) {
  const rows = (scored || []).filter(Boolean);
  if (!rows.length) return { active:false, count:0 };
  const med = a => { if (!a.length) return null; const s=[...a].sort((x,y)=>x-y); return s[Math.floor(s.length/2)]; };
  const liq = med(rows.map(r => r.dims.liquidity));
  const spread = med(rows.map(r => r.dims.avgSpreadC).filter(Number.isFinite));
  const qualified = rows.filter(r => ["STRONG_PAIR","QUALIFIED"].includes(r.state.state)).length;
  return {
    active: true, count: rows.length, qualified,
    liquidity: liq == null ? "NO READ" : liq >= 70 ? "HIGH" : liq >= 45 ? "MODERATE" : "LOW",
    spreadEnv: spread == null ? "NO READ" : spread <= 1 ? "TIGHT" : spread <= 2 ? "GOOD" : "WIDE",
    catalystPressure: Math.max(0, ...rows.map(r => r.dims.catalystRisk)),
    bestEdgeC: Math.max(...rows.map(r => r.edge?.netEdgeC ?? -99)),
  };
}

// ── SCORE A MARKET LIST ──────────────────────────────────────────────────────
function scorePolyMarkets(markets, opts = {}) {
  return (markets || []).map(m => {
    const edge = pairEdge(m, opts);
    const dims = polyDimensions(m, edge, opts);
    const state = polyState(edge, dims, opts);
    return { market: m, edge, dims, state };
  }).sort((a, b) => (b.edge?.netEdgeC ?? -99) - (a.edge?.netEdgeC ?? -99));
}

async function fetchUWDirect(uwKey, signal) {
  const H = { Authorization: `Bearer ${uwKey}` };
  const get = (path) => fetch(`https://api.unusualwhales.com/api${path}`, { headers: H, signal })
    .then(r => r.ok ? r.json() : { data: [] }).catch(() => ({ data: [] }));

  // Phase 1: parallel-fetch the broad data (3 calls, ~150ms total)
  const [flow, dp, tide, news] = await Promise.all([
    get(`/option-trades/flow-alerts?limit=30&size_greater_oi=true&is_otm=true&min_ask_perc=0.7`),
    get(`/darkpool/recent?limit=25`),
    get(`/market/market-tide`),
    // Headlines feed the catalyst engine. If the endpoint is unavailable on this
    // plan it resolves to [] like every other call here and the engine falls
    // back to the news attached to individual signals.
    get(`/news/headlines?limit=50`),
  ]);

  // Phase 2: pick top 6 tickers by premium for heavy DP/GEX, all unique for light OHLC
  const premBy = {};
  (flow.data||[]).forEach(r => { const t = r.ticker; if (!t || MACRO_TICKERS.has(t)) return; premBy[t] = (premBy[t]||0) + (+r.total_premium||0); });
  (dp.data||[]).forEach(r   => { const t = r.ticker; if (!t || MACRO_TICKERS.has(t)) return; premBy[t] = (premBy[t]||0) + (+r.premium||0); });
  const sortedTickers = Object.entries(premBy).sort((a,b) => b[1]-a[1]).map(x => x[0]);
  const topTickers  = sortedTickers.slice(0, 6);           // heavy endpoints
  const ohlcTickers = sortedTickers.slice(0, 12);          // light OHLC endpoint — wider coverage

  // Phase 3: parallel per-ticker enrichment (DP history + GEX + OHLC for Ichimoku)
  const dpGexPromises = topTickers.flatMap(t => [
    get(`/darkpool/${t}?limit=30`),
    get(`/stock/${t}/greek-exposure`),
  ]);
  const ohlcPromises = ohlcTickers.map(t => get(`/stock/${t}/ohlc/5m?limit=400`));
  const allResults = await Promise.all([...dpGexPromises, ...ohlcPromises]);
  const dpGexResults = allResults.slice(0, dpGexPromises.length);
  const ohlcResults  = allResults.slice(dpGexPromises.length);

  const per_ticker = {};
  topTickers.forEach((t, i) => {
    per_ticker[t] = {
      dp_history:  (dpGexResults[i*2]?.data || []).slice(0, 30),
      gex_snapshot: dpGexResults[i*2+1]?.data?.[0] || null,
    };
  });

  // Pre-compute Ichimoku + the V4 quant stack per ticker on the client —
  // avoids bloating Claude tokens, and keeps the scoring identical to FINAL_V4.
  const ichimokuByTicker = {};
  const v4ByTicker = {};
  ohlcTickers.forEach((t, i) => {
    const bars = ohlcResults[i]?.data || [];
    const ich = computeIchimoku(bars);
    if (ich) ichimokuByTicker[t] = ich;
    try {
      const q = computeV4(bars);
      if (q) v4ByTicker[t] = q;
    } catch (_) { /* one bad symbol must never break the whole scan */ }
  });

  return {
    flow_alerts: flow.data || [],
    dark_pool_recent: dp.data || [],
    market_tide: tide.data || [],
    per_ticker,
    ichimokuByTicker,
    v4ByTicker,
    news_headlines: news.data || [],
  };
}

    const h = +parts.find(p => p.type === "hour").value;

const HIST_KEY = "sfs_history_v1";
const DAY_MS   = 86400000;

function loadHist() {

function saveHist(h) { try { localStorage.setItem(HIST_KEY, JSON.stringify(h)); } catch(_){} }
function pruneHist(h) {
  const now = Date.now();
  const out = {};
  Object.entries(h).forEach(([k,v]) => {
    const t = new Date(v.last_seen || today()).getTime();
    const ageDays = (now - t)/DAY_MS;
    // Hard cap: drop anything older than 30 days
    if (ageDays > 30) return;
    // Stale-and-never-fired: drop items tracked 3+ days that never showed real follow-through
    // ("fired" = had matched sweep+DP confluence OR cleared 70% win prob OR ≥3 distinct sighting days)
    const fired = (v.sweepOk && v.dpOk) || (v.max_win_prob||0) >= 70 || (v.days_seen?.length||0) >= 3;
    if (ageDays > 3 && !fired) return;
    out[k] = v;
  });
  return out;
}

    if (!e.days_seen.includes(td)) e.days_seen.push(td);
    e.last_seen             = td;
    e.total_premium        += parseInt(p.premium)||0;
    e.sighting_count       += 1;
    e.max_win_prob          = Math.max(e.max_win_prob||0, p.winProb||0);
    e.sweepOk               = e.sweepOk || !!p.sweepOk;
    e.dpOk                  = e.dpOk    || !!p.dpOk;
    if (p.strike) e.latest_strike = p.strike;
    if (p.expiry) e.latest_expiry = p.expiry;
    e.latest_staircase_days = Math.max(e.latest_staircase_days||0, parseInt(p.staircase_days)||0);
    // Persist confluence data (always keep the latest non-null snapshot)
    if (p.congress) e.congress = p.congress;
    if (p.insider)  e.insider  = p.insider;
    if (p.news)     e.news     = p.news;
    if (p.fda)      e.fda      = p.fda;
    if (p.earnings) e.earnings = p.earnings;
    if (p.predict && p.predict.any) e.predict = p.predict;
    if (p.gex?.bias) { e.gex_bias = p.gex.bias; e.gex_wall = p.gex.wall || e.gex_wall; }
    h[key] = e;
  });
  return pruneHist(h);
}

// ── WIN-PROB GATE ────────────────────────────────────────────────────────────
// Hard rule: setup must clear 70% win probability before it counts as actionable.
const WIN_GATE = 70;

// ── POSITION SIZE HINT (discipline layer) ────────────────────────────────────
// Maps days-building + win-prob to recommended account % per profile rules:
// <70% win prob = WAIT (gate). < 3d = wait, 3-4d = 1%, 5-6d = 2%, 7+d = 3% cap.
function sizingHint(days, winProb) {
  if ((winProb||0) < WIN_GATE) return { pct: "0%", color: "#556677", label: "WAIT <70%" };
  if (days >= 7) return { pct: "3%", color: "#00ff88", label: "MAX SIZE" };
  if (days >= 5) return { pct: "2%", color: "#ffe033", label: "SIZE UP" };
  if (days >= 3) return { pct: "1%", color: "#ff9955", label: "START" };
  return             { pct: "0%", color: "#556677", label: "BUILD"   };
}
function topBuilds(h, cat, sortMode, n, gateOn) {
  return Object.values(h||{})
    .filter(e => e.cat === cat)
    .filter(e => !gateOn || (e.max_win_prob||0) >= WIN_GATE)
    .sort((a,b) => {
      if (sortMode === "premium") {
        if ((b.total_premium||0) !== (a.total_premium||0)) return (b.total_premium||0)-(a.total_premium||0);
        return (b.days_seen?.length||0) - (a.days_seen?.length||0);
      }
      const da = a.days_seen?.length||0, db = b.days_seen?.length||0;
      if (db !== da) return db - da;
      return (b.total_premium||0) - (a.total_premium||0);
    })
    .slice(0, n||10);
}
