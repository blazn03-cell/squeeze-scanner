              <div style={{ display:"grid", gridTemplateColumns:"repeat(4, 1fr)", gap:10, marginBottom:12 }}>
                {[
                  ["TENKAN (9)", tech.ichimoku.tenkan, "#66ccff"],
                  ["KIJUN (26)", tech.ichimoku.kijun,  "#ffe033"],
                  ["SPAN A", tech.ichimoku.spanA, tech.ichimoku.cloudColor==="green"?"#00ff88":"#ff9955"],
                  ["SPAN B (52)", tech.ichimoku.spanB, tech.ichimoku.cloudColor==="green"?"#ff9955":"#ff3355"],
                ].map(([l,v,c])=>(
                  <div key={l} style={{ padding:"10px 12px", background:"#040810", border:`1px solid ${c}33`, borderRadius:4, textAlign:"center" }}>
                    <div className="label" style={{ marginBottom:4, color:c+"cc", fontSize:11 }}>{l}</div>
                    <div style={{ fontSize:15, fontWeight:700, color:c, fontFamily:"'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" }}>${v.toFixed(2)}</div>
                  </div>
                ))}
              </div>
              {/* Price vs Cloud + signals */}
              <div style={{ display:"grid", gridTemplateColumns:"repeat(3, 1fr)", gap:10 }}>
                <div style={{ padding:"10px 12px", background:"#040810", border:"1px solid #15212e", borderRadius:4 }}>
                  <div className="label" style={{ marginBottom:4 }}>PRICE vs CLOUD</div>
                  <div style={{ fontSize:13, fontWeight:700, color: tech.ichimoku.priceZone==="above"?"#00ff88":tech.ichimoku.priceZone==="below"?"#ff3355":"#ffaa44" }}>
                    {tech.ichimoku.priceZone==="above"?"▲ ABOVE CLOUD":tech.ichimoku.priceZone==="below"?"▼ BELOW CLOUD":"◆ INSIDE CLOUD"}
                  </div>
                  <div className="mini" style={{marginTop:3}}>
                    Cloud: ${tech.ichimoku.cloudBot.toFixed(2)}–${tech.ichimoku.cloudTop.toFixed(2)}
                  </div>
                </div>
                <div style={{ padding:"10px 12px", background:"#040810", border:"1px solid #15212e", borderRadius:4 }}>
                  <div className="label" style={{ marginBottom:4 }}>TK CROSS</div>
                  <div style={{ fontSize:13, fontWeight:700, color: tech.ichimoku.tkCross==="bullish"?"#00ff88":tech.ichimoku.tkCross==="bearish"?"#ff3355":"#7aaed0" }}>
                    {tech.ichimoku.tkCross==="bullish"?"▲ BULL CROSS":tech.ichimoku.tkCross==="bearish"?"▼ BEAR CROSS":tech.ichimoku.tenkan > tech.ichimoku.kijun?"T > K (bull posture)":tech.ichimoku.tenkan < tech.ichimoku.kijun?"T < K (bear posture)":"T = K (flat)"}
                  </div>
                  <div className="mini" style={{marginTop:3}}>Tenkan vs Kijun</div>
                </div>
                <div style={{ padding:"10px 12px", background:"#040810", border:"1px solid #15212e", borderRadius:4 }}>
                  <div className="label" style={{ marginBottom:4 }}>CHIKOU</div>
                  <div style={{ fontSize:13, fontWeight:700, color: tech.ichimoku.chikouConfirm==="bullish"?"#00ff88":tech.ichimoku.chikouConfirm==="bearish"?"#ff3355":"#7aaed0" }}>
                    {tech.ichimoku.chikouConfirm==="bullish"?"▲ CONFIRMS BULL":tech.ichimoku.chikouConfirm==="bearish"?"▼ CONFIRMS BEAR":"— NO CONFIRM"}
                  </div>
                  <div className="mini" style={{marginTop:3}}>Close vs 26 bars ago</div>
                </div>
              </div>
            </div>
          ) : (
            <div style={{ padding:"14px 22px", background:"#060d15", borderBottom:"1px solid #111d28" }}>
              <div className="sec-label" style={{ marginBottom:6 }}>ICHIMOKU · 5M</div>
              <div style={{ fontSize:13, color:"#8aabc2", lineHeight:1.6 }}>
                No 5m OHLC data fetched for {p.ticker} this scan cycle. Ichimoku only runs on top-12 tickers by premium — if this ticker ranks lower, tech bias defaults to PENDING and verdict holds for next scan.
              </div>
            </div>
          )}

          {/* ─── 3. MACRO + IV + SUGGESTED STRATEGY ─── */}
          <div style={{ padding:"14px 22px", background:"#050b12", borderBottom:"1px solid #111d28" }}>
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 2fr", gap:14, alignItems:"center" }}>
              <div>
                <div className="label" style={{ marginBottom:4 }}>MACRO</div>
                <div style={{ fontSize:16, fontWeight:700, color:tech.macroBias==="BULLISH"?"#00ff88":tech.macroBias==="BEARISH"?"#ff3355":"#7aaed0" }}>{tech.macroBias}</div>
                <div className="mini" style={{marginTop:2}}>from market tide</div>
              </div>
              <div>
                <div className="label" style={{ marginBottom:4 }}>IV RANK</div>
                <div style={{ fontSize:16, fontWeight:700, color:tech.ivRank===null?"#7aaed0":tech.ivRank>=55?"#ffaa44":"#44ffbb" }}>
                  {tech.ivRank===null?"—":tech.ivRank+"%"}
                </div>
                <div className="mini" style={{marginTop:2}}>{tech.ivRank===null?"pending":tech.ivHigh?"elevated":"normal"}</div>
              </div>
              <div>
                <div className="label" style={{ marginBottom:4 }}>SUGGESTED STRATEGY</div>
                <div style={{ display:"flex", gap:8, alignItems:"center", flexWrap:"wrap" }}>
                  <span style={{ fontSize:14, fontWeight:700, color:"#ffe033", padding:"5px 10px", background:"#141008", border:"1px solid #ffe03355", borderRadius:4 }}>
                    {tech.suggestedStrategy}
                  </span>
                  {tech.creditAlt && <span style={{ fontSize:12, color:"#aa88ff" }}>· or {tech.creditAlt}</span>}
                </div>
                <div className="mini" style={{marginTop:3}}>DTE {prof.dte} · hold {prof.hold}</div>
              </div>
            </div>
          </div>

          {/* ─── 4. WHY — plain-English explanation + news ─── */}
          <div style={{ padding:"16px 22px", borderBottom:"1px solid #111d28" }}>
            <div className="sec-label" style={{ marginBottom:10 }}>WHY THIS SETUP</div>
            <div className="body-text-lg" style={{ marginBottom:12 }}>
              {p.sqType==="staircase"     && `Institutions quietly buying ${p.ticker} through dark pools for ${sc} consecutive days at ${p.staircase_zone||"the same zone"}. Classic pre-squeeze. When call sweeps appear on top, the squeeze fires.`}
              {p.sqType==="short_squeeze" && `Shorts are trapped. Short-interest and reported-flow conditions align with a possible squeeze setup; direction is not assured. ${sc>=3?`Staircase visible (${sc}d) adds fuel.`:"Watch for staircase confirmation."}`}
              {p.sqType==="gamma_squeeze" && "Dealers SHORT gamma. As price rises they must buy stock to hedge — accelerates the move. Violent and fast, days not weeks."}
              {p.sqType==="delta_squeeze" && "Massive call buying forcing dealers to buy stock for delta hedge. Sustained heavy call volume mechanically drives price up."}
              {p.sqType==="liquidity_sq"  && "Tiny float = very few shares available. Small buying creates massive moves. Staircase on low float = extremely powerful."}
              {p.sqType==="ftd_squeeze"   && "FTDs elevated — shorts sold shares they never borrowed. T+35 rule forces mandatory buy-ins. Rips with no warning."}
              {p.sqType==="vol_squeeze"   && "IV compressed and about to snap. When vol explodes back, premium and underlying move violently. UVXY/VIX sweeps lead."}
              {p.sqType==="cap_flush"     && "Reported put-flow and dark-pool selling conditions align with a possible bearish setup. This does not identify the trader or predict a sustained decline."}
              {p.sqType==="gamma_flush"   && "Dealers LONG gamma — they sell into every bounce, amplifying drops. Mirror of gamma squeeze. Bearish and mechanical."}
              {p.sqType==="stop_hunt"     && "Price pushed below support to trigger stops. After stops clear, the real move. Day trade only — resolves intraday."}
              {p.sqType==="margin_flush"  && "Leveraged longs getting margin called. Forced selling at any price. Large DP sell + no news = classic margin flush."}
              {p.sqType==="vix_flush"     && "VIX spiking hard. Don't buy SPY puts — IV too expensive. Buy UVXY calls to ride the vol spike directly."}
              {p.sqType==="liq_flush"     && "Thin bids + market sells cascading. Happens fast in low volume. Watch for DP buy prints as reversal signal."}
              {p.cat==="macro"            && "Use as overall market bias. Bullish = size up on squeezes. Bearish = size down everything, don't fight the tape."}
            </div>
            {p.news?.any && p.news.latest && (
              <div style={{ padding:"10px 14px", background:"#0e0a05", border:"1px solid #ff995555", borderLeft:"3px solid #ff9955", borderRadius:3, display:"flex", gap:10 }}>
                <span style={{ fontSize:16, flexShrink:0 }}>📰</span>
                <div style={{ flex:1 }}>
                  <div style={{ fontSize:11, color:"#ff9955", fontWeight:700, letterSpacing:"0.1em", marginBottom:3 }}>
                    LATEST NEWS{p.news.hours_ago!=null?` · ${p.news.hours_ago}h ago`:""}{p.news.catalyst_type?` · ${p.news.catalyst_type.toUpperCase()}`:""}
                  </div>
                  <div style={{ fontSize:13, color:"#d5c0a8", lineHeight:1.6 }}>{p.news.latest}</div>
                </div>
              </div>
            )}
          </div>

          {/* ─── 5. KEY LEVELS ─── */}
          {(p.levels || sc>=2) && (
            <div style={{ padding:"16px 22px", borderBottom:"1px solid #111d28" }}>
              <div className="sec-label" style={{ marginBottom:12 }}>KEY LEVELS</div>
              {p.levels && (
                <div style={{ display:"grid", gridTemplateColumns:"repeat(4, 1fr)", gap:10, marginBottom:sc>=2?14:0 }}>
                  {[["SUPPORT","#00ff88",p.levels.support],["ENTRY ZONE","#66ccff",p.levels.entry_zone],["RESISTANCE","#ff9955",p.levels.resistance],["TARGET","#ffe033",p.levels.target]].map(([l,c,v])=>(
                    <div key={l} style={{ padding:"12px", background:"#040810", border:`1px solid ${c}33`, textAlign:"center", borderRadius:4 }}>
                      <div className="label" style={{ marginBottom:5, color:c+"cc" }}>{l}</div>
                      <div style={{ fontSize:16, fontWeight:700, color:c }}>{v||"—"}</div>
                    </div>
                  ))}
                </div>
              )}
              {p.gex?.wall && <div style={{ fontSize:13, color:"#aa88ff", background:"#0d0814", border:"1px solid #aa88ff44", padding:"10px 14px", marginBottom:sc>=2?12:0, borderRadius:4 }}>📍 <b>Gamma wall: {p.gex.wall}</b> — price gravitates here. Magnet + accelerator.</div>}
              {sc>=2 && <StaircaseViz days={sc} zone={p.staircase_zone}/>}
            </div>
          )}

          {/* ─── 6. DATA — shorts + flow quality + IV ─── */}
          <div style={{ padding:"16px 22px", borderBottom:"1px solid #111d28" }}>
            <div className="sec-label" style={{ marginBottom:12 }}>DATA & FLOW QUALITY</div>
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:18 }}>
              <div>
                <div style={{ fontSize:12, color:"#7591a8", fontWeight:700, marginBottom:8, letterSpacing:"0.08em" }}>SHORTS</div>
                <DataRow label="Short Interest %" value={fmtP(sh.si_pct)} color={parseFloat(sh.si_pct||0)>=20?"#ff3355":parseFloat(sh.si_pct||0)>=10?"#ffe033":"#44ffbb"} sub={parseFloat(sh.si_pct||0)>=20?"HIGH FUEL":parseFloat(sh.si_pct||0)>=10?"MODERATE":"LOW"}/>
                <DataRow label="Days to Cover" value={sh.days_to_cover?parseFloat(sh.days_to_cover).toFixed(1)+"d":"—"} color={parseFloat(sh.days_to_cover||0)>=5?"#ff3355":parseFloat(sh.days_to_cover||0)>=3?"#ffe033":"#44ffbb"} sub={parseFloat(sh.days_to_cover||0)>=5?"TRAPPED":parseFloat(sh.days_to_cover||0)>=3?"MODERATE":"EASY OUT"}/>
                <DataRow label="Borrow Rate" value={sh.borrow_rate?parseFloat(sh.borrow_rate).toFixed(0)+"%/yr":"—"} color={parseFloat(sh.borrow_rate||0)>=30?"#ff9955":"#a0b8cc"}/>
                <DataRow label="Float" value={sh.float_shares_outstanding?`${(parseFloat(sh.float_shares_outstanding)/1e6).toFixed(1)}M`:"—"} color={parseFloat(sh.float_shares_outstanding||0)/1e6<15?"#ff88cc":"#a0b8cc"}/>
              </div>
              <div>
                <div style={{ fontSize:12, color:"#7591a8", fontWeight:700, marginBottom:8, letterSpacing:"0.08em" }}>FLOW</div>
                <DataRow label="Premium" value={fmt(p.premium)} color={parseInt(p.premium||0)>=500000?"#00ff88":parseInt(p.premium||0)>=100000?"#ffe033":"#a0b8cc"}/>
                <DataRow label="Size vs OI" value={p.oi>0?`${(p.size/p.oi).toFixed(1)}x`:"—"} color={p.oi>0&&p.size/p.oi>=2?"#00ff88":"#a0b8cc"}/>
                <DataRow label="Ask Side %" value={p.ask_pct?`${(p.ask_pct*100).toFixed(0)}%`:"—"} color={parseFloat(p.ask_pct||0)>=0.8?"#00ff88":"#a0b8cc"}/>
                <DataRow label="Sweeps Today" value={`${p.sweep_count||1}x`} color={(p.sweep_count||1)>=3?"#ff88cc":"#a0b8cc"}/>
              </div>
            </div>
            {p.iv && (
              <div style={{ marginTop:14, padding:"12px 14px", background:"#040810", border:`1px solid ${tech.ivHigh?"#ffaa4444":"#44ffbb33"}`, borderRadius:4, display:"flex", gap:18, alignItems:"center" }}>
                <div style={{ flex:1 }}>
                  <div className="label" style={{ marginBottom:4 }}>VOLATILITY</div>
                  <div style={{ fontSize:14, color:tech.ivHigh?"#ffaa44":"#44ffbb" }}>
                    Near: <b>{p.iv.near||"—"}%</b> · Far: <b>{p.iv.far||"—"}%</b> · Status: <b>{tech.ivHigh?"HIGH — USE SPREAD":"NORMAL — calls ok"}</b>
                  </div>
                </div>
              </div>
            )}
          </div>

          {/* ─── 7. BEST PLAY ─── */}
          {strats.length > 0 && (
            <div style={{ padding:"16px 22px", borderBottom:"1px solid #111d28" }}>
              <div className="sec-label" style={{ marginBottom:12 }}>BEST PLAY</div>
              {strats.slice(0,1).map(([key, s]) => (
                <div key={key} style={{ border:`1.5px solid ${s.color}66`, background:"#040810", borderRadius:4, overflow:"hidden" }}>
                  <div style={{ padding:"12px 16px", borderBottom:`1px solid ${s.color}33`, display:"flex", alignItems:"center", gap:12 }}>
                    <span style={{ fontSize:22 }}>{s.emoji}</span>
                    <div style={{ flex:1 }}>
                      <div style={{ fontSize:15, fontWeight:700, color:s.color }}>{s.name}</div>
                      <div className="mini">{s.risk} RISK · IV {s.ivNeed}</div>
                    </div>
                    <span style={{ fontSize:11, color:"#ffe033", background:"#14100a", border:"1px solid #ffe03344", padding:"3px 8px", borderRadius:3, fontWeight:700 }}>★ BEST FIT</span>
                  </div>
                  <div style={{ padding:"14px 16px", display:"grid", gridTemplateColumns:"1fr 1fr", gap:14 }}>
                    <div><div className="label" style={{color:"#66ccff", marginBottom:4}}>→ ENTER</div><div className="body-text">{s.how}</div></div>
                    <div><div className="label" style={{color:"#00ff88", marginBottom:4}}>← EXIT</div><div className="body-text">{s.exit}</div></div>
                    <div><div className="label" style={{color:"#ff3355", marginBottom:4}}>⛔ STOP</div><div className="body-text">{s.stop}</div></div>
                    <div><div className="label" style={{color:"#7090a8", marginBottom:4}}>✓/✗</div><div className="body-text">{s.pros} · <span style={{color:"#8aabc2"}}>{s.cons}</span></div></div>
                  </div>
                </div>
              ))}
            </div>
          )}

          {/* ─── 8. GUIDANCE NOTES ─── */}
          <div style={{ padding:"16px 22px", borderBottom:"1px solid #111d28" }}>
            <div className="sec-label" style={{ marginBottom:10 }}>GUIDANCE</div>
            {guidance.map((line,i) => (
              <div key={i} style={{ fontSize:13, color:line.startsWith("✅")?"#00ff88":line.startsWith("🚨")?"#ff3355":line.startsWith("⚠️")?"#ff9955":line.startsWith("🟡")?"#ffe033":line.startsWith("👀")?"#00ddff":line.startsWith("BEST")?"#44ffdd":line.startsWith("EXIT")?"#00ff88":line.startsWith("STOP")?"#ff9955":"#9fb5c8", lineHeight:1.75, marginBottom:4 }}>{line}</div>
            ))}
          </div>

          {/* ─── 9. POSITION TRACKER (collapsible) ─── */}
          <div style={{ padding:"16px 22px" }}>
            <div onClick={()=>setPosOpen(o=>!o)} style={{ cursor:"pointer", display:"flex", alignItems:"center", gap:10, marginBottom:posOpen?14:0 }}>
              <span className="sec-label">POSITION TRACKER</span>
              {pos?.entryPrice && <span style={{ fontSize:11, color:"#44ffbb", fontWeight:700 }}>· IN @ ${pos.entryPrice}</span>}
              {pnlPct !== null && <span style={{ fontSize:12, color:parseFloat(pnlPct)>=0?"#00ff88":"#ff3355", fontWeight:700 }}>{parseFloat(pnlPct)>=0?"+":""}{pnlPct}%</span>}
              <span style={{ marginLeft:"auto", fontSize:12, color:"#7591a8" }}>{posOpen?"▲ hide":"▼ show"}</span>
            </div>
            {posOpen && (
              <div>
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:12, marginBottom:12 }}>
                  {[["ENTRY PRICE",ep,setEp,"e.g. 2.45"],["CURRENT PRICE",cp,setCp,"e.g. 3.60"],["STOP PRICE",stop,setStop,"e.g. 1.45"]].map(([l,v,s,ph])=>(
                    <div key={l}>
                      <div className="label" style={{ marginBottom:6 }}>{l}</div>
                      <input value={v} onChange={e=>s(e.target.value)} placeholder={ph}
                        style={{ width:"100%", background:"#040810", border:`1px solid ${l==="STOP PRICE"&&stopHit?"#ff3355":"#15212e"}`, color: l==="STOP PRICE"&&stopHit?"#ff3355":"#d0deec", padding:"10px 12px", fontSize:14, outline:"none", boxSizing:"border-box", borderRadius:3 }}/>
                    </div>
                  ))}
                </div>
                {stopHit && <div className="urgent" style={{ padding:"12px 16px", marginBottom:12, background:"#1a0005", border:"1px solid #ff3355", borderRadius:3, fontSize:13, fontWeight:700, color:"#ff3355" }}>🛑 STOP HIT — Sell now. Don't negotiate with a loss.</div>}
                {pnlPct!==null && (
                  <div style={{ padding:"12px 16px", marginBottom:12, background:parseFloat(pnlPct)>=0?"#001a0e":"#1a0005", border:`1px solid ${parseFloat(pnlPct)>=0?"#00ff8855":"#ff335555"}`, borderRadius:3 }}>
                    <span className="label">P&L: </span>
                    <span style={{ fontSize:22, fontWeight:700, color:parseFloat(pnlPct)>=0?"#00ff88":"#ff3355" }}>{parseFloat(pnlPct)>=0?"+":""}{pnlPct}%</span>
                    {lockNudge && <span style={{ fontSize:12, color:"#00ff88", marginLeft:14 }}>💰 Lock 50% now, move stop to breakeven</span>}
                  </div>
                )}
                <div style={{ marginBottom:12 }}>
                  <div className="label" style={{ marginBottom:6 }}>NOTES</div>
                  <textarea value={note} onChange={e=>setNote(e.target.value)} rows={3}
                    placeholder="SI, chart read, news, float, insider buys…"
                    style={{ width:"100%", background:"#040810", border:"1px solid #15212e", color:"#9fb5c8", padding:"10px 12px", fontSize:13, outline:"none", resize:"vertical", lineHeight:1.65, boxSizing:"border-box", borderRadius:3 }}/>
                </div>
                <button onClick={savePos}
                  style={{ padding:"10px 22px", background:ep?"#001a0e":"#060b10", border:`1px solid ${ep?"#00ff8888":"#15212e"}`, color:ep?"#00ff88":"#3e5268", fontSize:12, fontWeight:700, letterSpacing:"0.12em", cursor:ep?"pointer":"default", borderRadius:3 }}>
                  {saved?"✓ SAVED":"SAVE POSITION"}
                </button>
              </div>
            )}
          </div>

        </div>
      )}
    </div>
  );
}

// ── COLUMN ───────────────────────────────────────────────────────────────────
function Column({ title, color, items, openId, onToggle, positions, onSave, newIds, viewMode, topEntries, sortMode, macroBias }) {
  const enter = items.filter(p=>(p.trade_day||1)<=1&&(p.winProb||0)>=50).length;
  const hold  = items.filter(p=>(p.trade_day||1)>1&&(p.trade_day||1)<=7).length;
  const early = items.filter(p=>(p.staircase_days||0)>=3&&!p.sweepOk&&p.cat!=="macro").length;

  // Auto-fallback: when LIVE column is empty, show 30-day Top 10 so the column is never blank.
  const showTop = viewMode === "top10" || items.length === 0;

  return (
    <div style={{ display:"flex", flexDirection:"column", borderRight:"1px solid #0e1a24", overflow:"hidden" }}>
      <div style={{ padding:"10px 14px", background:"#060b10", borderBottom:`1px solid ${color}33`, flexShrink:0 }}>
        <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:6, flexWrap:"wrap" }}>
          <div style={{ fontSize:11, color, fontWeight:700, letterSpacing:"0.1em" }}>{title}</div>
          {showTop && (
            <span title="Backup view: 30-day pre-squeeze tracker — what's been building when nothing has fired live yet" style={{ fontSize:9, color:"#66ccff", border:"1px solid #66ccff55", padding:"2px 7px", letterSpacing:"0.08em", borderRadius:3, fontWeight:600 }}>
              30D BACKUP · TOP {Math.min(10, topEntries?.length||0)}{sortMode==="premium"?" · BY $":" · BY DAYS"}
            </span>
          )}
        </div>
        <div style={{ display:"flex", gap:5, flexWrap:"wrap" }}>
          {!showTop && enter>0 && <span style={{ fontSize:10, padding:"2px 9px", background:"#00ff8818", border:"1px solid #00ff8855", color:"#00ff88", fontWeight:600, borderRadius:2 }}>{enter} ENTER</span>}
          {!showTop && hold>0  && <span style={{ fontSize:10, padding:"2px 9px", background:"#ffe03318", border:"1px solid #ffe03355", color:"#ffe033", fontWeight:600, borderRadius:2 }}>{hold} HOLD</span>}
          {!showTop && early>0 && <span style={{ fontSize:10, padding:"2px 9px", background:"#00ddff18", border:"1px solid #00ddff55", color:"#00ddff", fontWeight:600, borderRadius:2 }}>{early} EARLY</span>}
          <span style={{ fontSize:10, color:"#7591a8", marginLeft:"auto", fontWeight:500 }}>
            {showTop ? `${topEntries?.length||0} tracked` : `${items.length} live`}
          </span>
        </div>
      </div>
      <div style={{ overflowY:"auto", flex:1, padding: showTop ? 0 : "6px" }}>
        {showTop ? (
          <TopList entries={topEntries||[]} sortMode={sortMode} emptyLabel="Waiting for first hits — auto-records on every scan."/>
        ) : (
          items.map(p=>(
            <Card key={p.id} p={p} open={openId===p.id} onToggle={()=>onToggle(p.id)}
              pos={positions[p.id]} onSave={pos=>onSave(p.id,pos)} isNew={newIds.has(p.id)} macroBias={macroBias}/>
          ))
        )}
      </div>
    </div>
  );
}

// ── START SCREEN ─────────────────────────────────────────────────────────────
// No key is required to use this app. Only ONE feature needs paid keys — the
// live options-flow scan. Everything else (market read, danger windows, the
// ThinkorSwim scanner, the income lab, the glossary) is pure local computation
// and always available. The old screen demanded both keys before rendering a
// single pixel, which made the whole product look broken to anyone without an
// Unusual Whales subscription.
function Setup({ onConnect }) {
  const [ak, setAk]     = useState("");
  const [uk, setUk]     = useState("");
  const [open, setOpen] = useState(false);
  const both = ak.trim() && uk.trim();
  return (

// NAV scenarios multiply the base drift. This is the honest dial: a model run at
// "Ignore NAV" is the one most income spreadsheets show, and it is the one that
// gets people hurt.
const NAV_SCENARIOS = {
  ignore: { label:"Ignore NAV (income only)", mult:0,   note:"What most income spreadsheets show. Assumes the share price never moves. Optimistic." },
  base:   { label:"Base case",                mult:1,   note:"Assumes the higher-yield funds slowly lose share price, which is what several have done." },
  stress: { label:"Stress test",              mult:2,   note:"Doubles the share-price decay. Run this before you size a position." },
  bear:   { label:"Bear year",                mult:4,   note:"Quadruples the decay. Note this still only models slow NAV bleed — a real crash hits the underlying stock directly and lands far harder and faster than this." },
};

// Monthly projection. Each family compounds separately so NAV drift, yield and
// weight all apply to the right slice of money.
function projectIncome({ start, monthlyAdd, weights, months, reinvest, taxPct, navScenario }) {
  const mult = NAV_SCENARIOS[navScenario]?.mult ?? 1;
  const totalW = Object.values(weights).reduce((a, b) => a + (+b || 0), 0);
  if (!(start > 0) || totalW <= 0) return null;

  const sleeves = INCOME_FAMILIES
    .map(f => ({ f, w: (+weights[f.key] || 0) / totalW }))
    .filter(s => s.w > 0)
    .map(s => ({ ...s, bal: start * s.w }));

  const rows = [];
  let cumGross = 0, cumNet = 0, cumCash = 0, contributed = 0;

  for (let m = 1; m <= months; m++) {
    let gross = 0;
    for (const s of sleeves) {
      const monthlyYield = s.f.yieldPct / 100 / 12;
      const monthlyDrift = (s.f.driftPct * mult) / 100 / 12;
      const income = s.bal * monthlyYield;   // distributions come off the pre-drift balance
      gross += income;
      s.bal *= (1 + monthlyDrift);           // then the share price moves
      const net = income * (1 - taxPct / 100);
      if (reinvest) s.bal += net;
      s.bal += monthlyAdd * s.w;
    }
    const net = gross * (1 - taxPct / 100);
    cumGross += gross;
    cumNet += net;
    if (!reinvest) cumCash += net;
    contributed += monthlyAdd;
    rows.push({
      m, gross, net,
      balance: sleeves.reduce((a, s) => a + s.bal, 0),
      cumNet, cumCash,
    });
  }

  const endBalance = rows[rows.length - 1].balance;
  const invested = start + contributed;
  // Total return counts money you actually kept: end value, plus cash taken out
  // if not reinvesting, minus everything you put in.
  const profit = endBalance + (reinvest ? 0 : cumCash) - invested;
  return {
    rows, endBalance, invested, cumGross, cumNet, cumCash, profit,
    totalReturnPct: invested > 0 ? (profit / invested) * 100 : 0,
    blendedYieldPct: sleeves.reduce((a, s) => a + s.w * s.f.yieldPct, 0),
    blendedDriftPct: sleeves.reduce((a, s) => a + s.w * s.f.driftPct * mult, 0),
  };
}

// ── LIVE INTELLIGENCE — UI ───────────────────────────────────────────────────
const STATUS_STYLE = {
  CONFIRMED:  { color:"#00ff88", bg:"#00ff8818" },
  REPORTED:   { color:"#00ddff", bg:"#00ddff18" },
  DEVELOPING: { color:"#ffe033", bg:"#ffe03318" },
  RUMOR:      { color:"#ff9955", bg:"#ff995518" },
  UNVERIFIED: { color:"#ff3355", bg:"#ff335518" },
};
const agoTxt = ms => {
  const s = Math.max(0, Math.round(ms / 1000));
  if (s < 60) return `${s}s`;
  if (s < 3600) return `${Math.round(s / 60)}m`;
  if (s < 86400) return `${Math.round(s / 3600)}h`;
  return `${Math.round(s / 86400)}d`;
};
const etClock = ts => new Date(ts).toLocaleTimeString("en-US", { timeZone:"America/New_York", hour12:false });

function DimBar({ label, value, min = 0, max = 100, color, hint }) {
  const pct = Math.max(0, Math.min(100, ((value - min) / (max - min)) * 100));
  return (
    <div title={hint} style={{ marginBottom:7 }}>
      <div style={{ display:"flex", justifyContent:"space-between", fontSize:10, letterSpacing:"0.1em", color:"#7591a8", marginBottom:3 }}>
        <span>{label}</span>
        <span style={{ color, fontWeight:700, fontFamily:"'JetBrains Mono',monospace" }}>{value > 0 && min < 0 ? "+" : ""}{value}</span>
      </div>
      <div style={{ height:4, background:"#0d1620", borderRadius:2, overflow:"hidden" }}>
        <div style={{ width:`${pct}%`, height:"100%", background:color, transition:"width .3s" }}/>
      </div>
    </div>
  );
}

function EventCard({ ev, technical, watchlist, now }) {
  const [open, setOpen] = useState(false);
  const cat = CATEGORIES[ev.category] || CATEGORIES.OTHER;
  const st = STATUS_STYLE[ev.status] || STATUS_STYLE.REPORTED;
  const band = impactBand(ev.impactNow);
  const pri = alertPriority(ev, watchlist);
  const priM = PRIORITY_META[pri];
  const dirColor = ev.direction > 20 ? "#00ff88" : ev.direction < -20 ? "#ff3355" : "#7591a8";
  const fusion = fuseState({ technical, news: ev, eventProximityMin: null });
  const fs = FUSION_STATES[fusion.state];
  const onWatch = (watchlist || []).some(t => ev.tickers.includes(t));

  return (
    <div style={{ border:`1px solid ${pri <= 1 ? priM.color + "55" : "#13202e"}`, background:"#070d15",
                  borderLeft:`3px solid ${cat.color}`, borderRadius:4, marginBottom:8, overflow:"hidden" }}>
      <div onClick={() => setOpen(o => !o)} style={{ padding:"11px 14px", cursor:"pointer" }}>
        <div style={{ display:"flex", alignItems:"center", gap:9, flexWrap:"wrap", marginBottom:7 }}>
          <span style={{ fontSize:11, fontFamily:"'JetBrains Mono',monospace", color:"#8aabc2" }}>{etClock(ev.latest)} ET</span>
          <span style={{ fontSize:10, padding:"2px 7px", background:priM.color + "1f", border:`1px solid ${priM.color}55`, color:priM.color, fontWeight:700, borderRadius:2 }}>{priM.label}</span>
          <span style={{ fontSize:10, padding:"2px 7px", background:cat.color + "1a", border:`1px solid ${cat.color}44`, color:cat.color, fontWeight:600, borderRadius:2 }}>{cat.label}</span>
          <span style={{ fontSize:10, padding:"2px 7px", background:st.bg, border:`1px solid ${st.color}66`, color:st.color, fontWeight:700, borderRadius:2 }}>{ev.status}</span>
          {ev.sourceCount > 1 && <span style={{ fontSize:10, color:"#7591a8" }}>{ev.sourceCount} sources</span>}
          {onWatch && <span style={{ fontSize:10, color:"#ffe033", fontWeight:700 }}>★ WATCHLIST</span>}
          <span style={{ marginLeft:"auto", fontSize:10, color:"#7591a8" }}>{agoTxt(now - ev.latest)} ago</span>
        </div>
        <div style={{ fontSize:14, color:"#eaf2ff", fontWeight:600, lineHeight:1.5, marginBottom:8 }}>{ev.headline}</div>
        <div style={{ display:"flex", gap:8, flexWrap:"wrap", alignItems:"center" }}>
          {ev.tickers.slice(0, 8).map(t => (
            <span key={t} style={{ fontSize:11, padding:"2px 7px", background:"#0d1a26", border:"1px solid #1a2a3a", color:"#9fb5c8", fontWeight:700, borderRadius:2, fontFamily:"'JetBrains Mono',monospace" }}>{t}</span>
          ))}
          {ev.tickers.length === 0 && <span style={{ fontSize:11, color:"#5a7a92", fontStyle:"italic" }}>macro — no single ticker</span>}
          <span style={{ marginLeft:"auto", fontSize:11, color:fs.color, fontWeight:700 }}>{fs.icon} {fs.label}</span>
          <span style={{ fontSize:12, color:"#7591a8" }}>{open ? "▲" : "▼"}</span>
        </div>
      </div>

      {open && (
        <div style={{ borderTop:"1px solid #0e1a24", padding:"12px 14px", background:"#050a10" }}>
          <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(190px,1fr))", gap:14 }}>
            <div>
              <div className="sec-label" style={{ marginBottom:8 }}>CATALYST DIMENSIONS</div>

                Raw impact {ev.impact} → {ev.impactNow} after {Math.round(ev.ageMin)}m decay (half-life {cat.halfLifeMin}m)

function DangerTimeline({ zones, now }) {
  const p = new Date(now);
  const fmt = ts => new Date(ts).toLocaleTimeString("en-US", { timeZone:"America/New_York", hour:"2-digit", minute:"2-digit", hour12:false });
  const merged = [];
  for (const z of zones) {
    const last = merged[merged.length - 1];
    if (last && z.start <= last.end && z.severity === last.severity && z.label === last.label) { last.end = Math.max(last.end, z.end); continue; }
    merged.push({ ...z });
  }
  if (!merged.length) return <div style={{ fontSize:12, color:"#5a7a92", fontStyle:"italic" }}>No risk windows generated for today.</div>;
  return (
    <div style={{ fontFamily:"'JetBrains Mono','SF Mono',Menlo,monospace", fontSize:12, lineHeight:1.9 }}>
      {merged.map((z, i) => {
        const sev = ZONE_SEV[z.severity];
        const live = now >= z.start && now < z.end;
        return (
          <div key={i} title={z.note} style={{ display:"flex", gap:10, alignItems:"center",
                background: live ? sev.color + "18" : "transparent", padding:"1px 6px", borderRadius:2 }}>
            <span style={{ color:"#7591a8", minWidth:88 }}>{fmt(z.start)}–{fmt(z.end)}</span>
            <span style={{ color:sev.color, letterSpacing:"-1px" }}>{sev.bar}</span>
            <span style={{ color: live ? "#eaf2ff" : "#9fb5c8", fontWeight: live ? 700 : 500, fontFamily:"'Inter',sans-serif", fontSize:12 }}>
              {z.label}{live && <span style={{ color:sev.color, fontWeight:700 }}> ← NOW</span>}
            </span>
            <span style={{ marginLeft:"auto", fontSize:10, color:"#5a7a92" }}>{z.kind}</span>
          </div>
        );
      })}
    </div>
  );
}

const polyCents = v => (v == null || !Number.isFinite(v)) ? "—" : `${v > 0 ? "" : ""}${v.toFixed(2)}¢`;
const polyDollars = v => (v == null || !Number.isFinite(v)) ? "—" : `${v < 0 ? "-" : ""}$${Math.abs(v).toLocaleString(undefined,{maximumFractionDigits:2})}`;
const polyDimColor = (v, invert) => {
  const x = invert ? 100 - v : v;
  return x >= 75 ? "#00ff88" : x >= 55 ? "#00ddff" : x >= 40 ? "#ffe033" : x >= 25 ? "#ff9955" : "#ff5577";
};

function PolyDim({ label, value, invert, hint }) {
  const c = polyDimColor(value, invert);
  return (
    <div title={hint} style={{ marginBottom:6 }}>
      <div style={{ display:"flex", justifyContent:"space-between", fontSize:10, letterSpacing:"0.09em", color:"#7591a8", marginBottom:3 }}>
        <span>{label}{invert && <span style={{ color:"#5a7a92" }}> (lower is better)</span>}</span>
        <span style={{ color:c, fontWeight:700, fontFamily:"'JetBrains Mono',monospace" }}>{value}</span>
      </div>
      <div style={{ height:4, background:"#0d1620", borderRadius:2, overflow:"hidden" }}>
        <div style={{ width:`${Math.max(0,Math.min(100,value))}%`, height:"100%", background:c }}/>
      </div>
    </div>
  );
}

// Reads the CSS custom properties so the palette lives in exactly one place.
// Re-read on every theme change; the values are strings React drops straight
// into inline styles.
function readTheme() {
  const cs = getComputedStyle(document.documentElement);
  const v = n => cs.getPropertyValue(n).trim();
  return {
    bg:v("--bg"), surface:v("--surface"), raised:v("--raised"),
    line:v("--line"), lineSoft:v("--line-soft"),
    text:v("--text"), text2:v("--text-2"), text3:v("--text-3"), text4:v("--text-4"),
    accent:v("--accent"), good:v("--good"), warn:v("--warn"), bad:v("--bad"),
    warnText:v("--warn-text"), warnBg:v("--warn-bg"), warnLine:v("--warn-line"),
    chipBg:v("--chip-bg"),
    goodBg:v("--good")+"15", goodLine:v("--good")+"55", accentLine:v("--accent")+"66",
  };
}

const SIMPLE_KEY = "wsh_ui_mode_v1";
const THEME_KEY  = "wsh_theme_v1";
const MONEY_KEY  = "wsh_money_v1";

// ── Position sizing ─────────────────────────────────────────────────────────
// Given what someone is willing to put in, work out what they can actually take
// on. This sizes the UNDERLYING SHARES only. It does not pick an options
// contract, and it must not: docs/OPTIONS_TRADING_SCOPE.md Gate B requires a
// live contract quote — real bid/ask, volume, open interest, fresh timestamp —
// before any contract may be named, and no licensed options feed is connected.
//
// The stop distance is 1.5 x ATR. That is a stated convention for "further than
// this stock's normal daily wiggle", NOT a prediction and NOT a guarantee: a gap
// opens past a stop and the loss is larger than the number shown here.
const STOP_ATR_MULT = 1.5;

function sizeFor(v4, budget, riskPct) {
  const price = Number(v4?.last), atrPct = Number(v4?.atrPct);
  if (!(price > 0) || !(budget > 0)) return null;

  const stopPerShare = atrPct > 0 ? price * (atrPct / 100) * STOP_ATR_MULT : null;
  // Never round a zero result up to one — OPTIONS_TRADING_SCOPE.md calls this out
  // explicitly, and it is the difference between "you cannot take this" and a
  // position the person cannot actually afford.
  const affordable = Math.floor(budget / price);
  const riskCap    = budget * (riskPct / 100);
  const byRisk     = stopPerShare ? Math.floor(riskCap / stopPerShare) : affordable;
  const shares     = Math.max(0, Math.min(affordable, byRisk));

  return {
    price, shares, affordable, riskCap: +riskCap.toFixed(2),
    cost: +(shares * price).toFixed(2),
    stopPerShare: stopPerShare ? +stopPerShare.toFixed(2) : null,
    stopPrice: stopPerShare ? +(price - stopPerShare).toFixed(2) : null,
    atRisk: stopPerShare ? +(shares * stopPerShare).toFixed(2) : null,
    fits: shares > 0,
    // Why it does not fit, so the screen can say something useful instead of "no".
    blocker: shares > 0 ? null : (affordable === 0 ? "PRICE" : "RISK"),
  };
}

const usd = n => "$" + Number(n).toLocaleString("en-US", { maximumFractionDigits: 2 });

// ── Expiry horizons ─────────────────────────────────────────────────────────
// The engine is a DAILY-BAR model. FINAL_V4/DOCUMENTATION/V4_PARAMETER_STANDARD.md:
// "Daily is the default and the ceiling ... the intended holding period is 1-3
// days." A 0DTE contract resolves in hours, inside a single bar the model cannot
// see. So the scanner's score carries no information about a 0DTE outcome, and
// the app says exactly that rather than letting the number imply otherwise.
const SIGNAL_HOLD_DAYS = [1, 3];

const DTE_INFO = {
  0: { label:"0DTE — expires today",
       plain:"The contract dies at the closing bell today. Minutes matter, and it can go to zero while you are looking away.",
       verdict:"OUTSIDE",
       why:"This scanner reads one bar per day and is built for 1-3 day moves. It has nothing to say about what happens in the next few hours." },
  1: { label:"1DTE — expires tomorrow",
       plain:"The contract dies at tomorrow's closing bell. Still fast, but an overnight move can work in your favour.",
       verdict:"EDGE",
       why:"This is the shortest expiry that overlaps the 1-3 day window the signal is built for, and it only just overlaps." },
};

// Which scheduled events land on the day a short-dated contract expires. Only
// rule-derived events are available here — jobless claims, NFP, opex, triple
// witching. FOMC and CPI are NOT: they come from MACRO_SEED, which ships empty
// because those dates are published, not derivable, and inventing them would be
// worse than omitting them.
//
// So this returns `blind: true` alongside any hits. A quiet calendar must never
// be presented as an all-clear — the absence of a warning here means "nothing
// this app can derive", not "nothing is happening".
function expiryRisk(scheduled, nowMs, dteDays) {
  const target = new Date(nowMs + dteDays * 86400000);
  const t = etParts(target);
  const hits = (scheduled || []).filter(e => {
    const p = etParts(new Date(e.ts));
    return p.y === t.y && p.m === t.m && p.d === t.d;
  }).filter(e => e.importance === "CRITICAL" || e.importance === "HIGH" || e.importance === "MEDIUM");
  return {
    day: `${t.y}-${String(t.m).padStart(2,"0")}-${String(t.d).padStart(2,"0")}`,
    hits,
    worst: hits.some(h => h.importance === "CRITICAL") ? "CRITICAL"
         : hits.some(h => h.importance === "HIGH") ? "HIGH"
         : hits.length ? "MEDIUM" : "NONE",
    // Always true: the app cannot see central-bank or inflation dates.
    blind: true,
  };
}

// Contract sizing, implementing docs/OPTIONS_TRADING_SCOPE.md verbatim:
//   contracts = floor(max_dollar_risk / (option_debit * 100 + estimated_costs))
//   "If this returns zero, the correct result is skip."
// The reader supplies the debit from their own broker screen. This function does
// arithmetic on a quote it was given; it never sources, chooses or names a
// contract, which Gate B forbids without a licensed options quote feed.
function contractsFor(maxRisk, debitPerShare, costPerContract = 0) {
  const risk = Number(maxRisk), debit = Number(debitPerShare), cost = Number(costPerContract) || 0;
  if (!(risk > 0) || !(debit > 0)) return null;
  const perContract = debit * 100 + cost;
  const contracts = Math.floor(risk / perContract);
  return {
    perContract: +perContract.toFixed(2),
    contracts,
    // Max loss on a long option is the debit paid plus costs — the doc's wording.
    maxLoss: +(contracts * perContract).toFixed(2),
    skip: contracts === 0,
  };
}

function plainMarketRead(brain, zone, dataStatus) {
  if (!brain) return { light:"grey", headline:"Loading…", what:"" };
  // activeZone() returns { severity: 0..3, labels: [] } — 3 is the worst.
  const sev = zone?.severity || 0;
  const n = (brain.best || []).length;
  const st = dataStatus?.state;
  // How many stocks actually have a score right now, from EITHER data path.
  // The headline must key on this rather than on /api/bars alone: bar rows are
  // retained across a refresh, and the paid options-flow feed scores tickers of
  // its own. Keying on the endpoint status alone printed "No prices today" over
  // a list of real setups whenever bars were down but the paid feed was live.
  const scored = brain.sampleSize || 0;
  if (sev >= 2) return {
    light:"red",
    headline:"Do not start a trade right now.",
    what:`Big news is landing (${(zone.labels || []).join(", ")}). Prices jump around for reasons that have nothing to do with your setup. Wait.`,
  };
  if (scored === 0 && (st === "loading" || st === "idle")) return {
    light:"grey", headline:"Getting today's prices…", what:"A few seconds.",
  };
  if (scored === 0) return {
    light:"blue",
    headline:"No prices today.",
    what: dataStatus?.reason === "NO_PROVIDER_CONFIGURED"
      ? "The site owner has not added a price key yet, so there is nothing to score."
      : "Today's price download did not work. Try again later.",
  };
  // Scores exist but the daily download is not healthy — say so, because these
  // numbers are then either held over from earlier or came only from the paid feed.
  const stale = st !== "ok" ? "Today's prices did not all arrive, so this is based on what we have." : "";
  if (n === 0) return {
    light:"amber",
    headline:"Nothing worth buying today.",
    what:`Checked ${scored} stocks. None of them passed. Doing nothing is fine — most days look like this.`,
    note: stale,
  };
  return {
    light:"green",
    headline:`${n} thing${n === 1 ? "" : "s"} to look at.`,
    what:"Worth a look is not the same as worth buying. Read the note under each one.",
    note: stale,
  };
}

// Derived from the tokens so the traffic light stays legible on white — the
// neon dark-mode greens are unreadable on a light background.
const lightsFor = V => ({
  green:{ e:"🟢", c:V.good }, amber:{ e:"🟡", c:V.warn }, red:{ e:"🔴", c:V.bad },
  blue:{ e:"🔵", c:V.accent }, grey:{ e:"⚪", c:V.text4 },
});

// Set synchronously, never in an effect: the simple view reads the resulting
// computed values during render, and a child effect would run before the parent
// had applied the attribute.
function applyTheme(mode) {
  if (mode === "light" || mode === "dark") document.documentElement.dataset.theme = mode;
  else delete document.documentElement.dataset.theme;   // "system"
  return mode;
}

function SimpleHome({ brain, zones, zone, calendar, liveMode, dataStatus, nowMs, feed, onExpert, onOpen, mode, onMode, theme, onTheme, budget, riskPct, onMoney }) {
  // A Set, not a single value: opening one explanation must not close the one you
  // were already reading.
  const [openFolds, setOpenFolds] = useState(() => new Set());
  const flip   = k => setOpenFolds(o => { const n = new Set(o); n.has(k) ? n.delete(k) : n.add(k); return n; });
  const isOpen = k => openFolds.has(k);
  const [dte, setDte]     = useState(1);        // 1DTE first: it is the one that overlaps the signal
  const [debit, setDebit] = useState("");       // the reader reads this off their own broker

  // Re-read whenever the theme changes. applyTheme has already set the attribute
  // synchronously, so the computed values are correct by the time we get here.
  const V = React.useMemo(() => readTheme(), [theme]);
  const LIGHTS = lightsFor(V);

  const read = plainMarketRead(brain, zone, dataStatus);
  const L = LIGHTS[read.light];

  // Size every candidate against the reader's money, then put what they can
  // actually take first. A 95-score setup they cannot afford is not the best
  // option FOR THEM — that is the whole point of asking.
  const sized = (brain?.best || []).map(b => ({ ...b, size: sizeFor(b, budget, riskPct) }));
  const best = (budget > 0
    ? [...sized].sort((a, b) => (b.size?.fits ? 1 : 0) - (a.size?.fits ? 1 : 0))
    : sized).slice(0, 5);
  const fitCount = sized.filter(x => x.size?.fits).length;
  const soon = (zones || []).filter(z => z.end > nowMs && z.severity >= 2);
  const fmt = ts => new Date(ts).toLocaleTimeString("en-US", { hour:"numeric", minute:"2-digit", timeZone:"America/New_York" });

  return (
    <div style={{ flex:1, overflowY:"auto", background:V.bg }}>
      <div style={{ maxWidth:640, margin:"0 auto", padding:"26px 20px 70px" }}>

        <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:24, flexWrap:"wrap" }}>
          <div style={{ fontSize:21, fontWeight:800, color:V.text, letterSpacing:"-0.02em" }}>⚡ WallstreetHustler</div>
          <span style={{ fontSize:10, fontWeight:700, color:V.good, background:V.goodBg, border:`1px solid ${V.goodLine}`, padding:"3px 9px", borderRadius:20 }}>FREE</span>
          <button onClick={onTheme} title="Switch between light and dark"

                     fontSize:13, cursor:"pointer", fontFamily:"inherit", padding:"5px 9px", borderRadius:6 }}>
            {theme === "light" ? "🌙 Dark" : "☀ Light"}
          </button>
          <button onClick={onExpert}
            style={{ background:"transparent", border:`1px solid ${V.line}`, color:V.text3, fontSize:12.5,
                     cursor:"pointer", fontFamily:"inherit", padding:"5px 10px", borderRadius:6 }}>
            Expert view →
          </button>
        </div>

        {/* Always visible. These are whole features — they were buried inside a
            collapsed "Other tools" fold, which is three clicks and a guess away
            from anyone who does not already know they exist. */}
        <div style={{ display:"flex", gap:6, marginBottom:18, flexWrap:"wrap" }}>
          {[
            { k:"v4",     icon:"📊", label:"Scores",  hint:"Every score for every stock, in a table" },
            { k:"income", icon:"💵", label:"Income",  hint:"High-payout funds, explained simply" },
            { k:"intel",  icon:"📡", label:"News",    hint:"What just happened and which way it points" },
            { k:"poly",   icon:"◈",  label:"Markets", hint:"Prediction markets. Research only." },
          ].map(o => (
            <button key={o.k} onClick={()=>onOpen(o.k)} title={o.hint} aria-label={o.label}
              style={{ flex:"1 1 auto", minWidth:92, background:V.surface, border:`1px solid ${V.line}`,
                       color:V.text2, borderRadius:8, padding:"9px 10px", cursor:"pointer",
                       fontFamily:"inherit", fontSize:13, fontWeight:600, display:"flex",
