    /* ── Theme tokens ────────────────────────────────────────────────────────

    :root{

  <script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ── SIGNAL TYPES ─────────────────────────────────────────────────────────────
const SQ = {
  staircase:     { label:"STAIRCASE",    color:"#00ddff", icon:"📊", tier:1, cat:"squeeze" },
  short_squeeze: { label:"SHORT SQ",     color:"#00ff88", icon:"🚀", tier:1, cat:"squeeze" },
  gamma_squeeze: { label:"GAMMA SQ",     color:"#ffe033", icon:"⚡", tier:1, cat:"squeeze" },
  delta_squeeze: { label:"DELTA SQ",     color:"#44ffdd", icon:"∆",  tier:2, cat:"squeeze" },
  liquidity_sq:  { label:"LIQUIDITY SQ", color:"#ff88cc", icon:"💧", tier:2, cat:"squeeze" },
  ftd_squeeze:   { label:"FTD SQ",       color:"#ff9900", icon:"📌", tier:2, cat:"squeeze" },
  vol_squeeze:   { label:"VOL SQ",       color:"#cc88ff", icon:"🌀", tier:3, cat:"squeeze" },
};
const FL = {
  cap_flush:    { label:"CAPITULATION",  color:"#ff3355", icon:"🩸", tier:1, cat:"flush" },
  gamma_flush:  { label:"GAMMA FLUSH",   color:"#ff6600", icon:"🔥", tier:1, cat:"flush" },
  stop_hunt:    { label:"STOP HUNT",     color:"#ff9955", icon:"🎯", tier:2, cat:"flush" },
  margin_flush: { label:"MARGIN CALL",   color:"#ff5577", icon:"💥", tier:2, cat:"flush" },
  vix_flush:    { label:"VIX SPIKE",     color:"#cc44ff", icon:"🌋", tier:2, cat:"flush" },
  liq_flush:    { label:"LIQ FLUSH",     color:"#ff7788", icon:"📉", tier:3, cat:"flush" },
};
const MC = {
  macro_bull: { label:"MACRO BULL", color:"#66ccff", icon:"📈", tier:2, cat:"macro" },
  macro_bear: { label:"MACRO BEAR", color:"#ff9955", icon:"📉", tier:2, cat:"macro" },
};
const ALL = { ...SQ, ...FL, ...MC };

// ── SETUP PROFILES ───────────────────────────────────────────────────────────
const PROF = {
  staircase:     { dte:"14–21", hold:"5–14 days", holdDays:14 },
  short_squeeze: { dte:"7–21",  hold:"3–10 days", holdDays:10 },
  gamma_squeeze: { dte:"3–10",  hold:"1–4 days",  holdDays:4  },
  delta_squeeze: { dte:"5–14",  hold:"2–5 days",  holdDays:5  },
  liquidity_sq:  { dte:"7–14",  hold:"2–7 days",  holdDays:7  },
  ftd_squeeze:   { dte:"21–45", hold:"1–3 weeks", holdDays:21 },
  vol_squeeze:   { dte:"7–21",  hold:"3–7 days",  holdDays:7  },
  cap_flush:     { dte:"7–14",  hold:"2–5 days",  holdDays:5  },
  gamma_flush:   { dte:"5–14",  hold:"2–5 days",  holdDays:5  },
  stop_hunt:     { dte:"0–3",   hold:"Same day",   holdDays:1  },
  margin_flush:  { dte:"5–14",  hold:"2–4 days",  holdDays:4  },
  vix_flush:     { dte:"7–21",  hold:"2–5 days",  holdDays:5  },
  liq_flush:     { dte:"5–10",  hold:"1–3 days",  holdDays:3  },
  macro_bull:    { dte:"7–14",  hold:"1–5 days",  holdDays:5  },
  macro_bear:    { dte:"7–14",  hold:"1–5 days",  holdDays:5  },
};

// ── STRATEGIES ───────────────────────────────────────────────────────────────
const STRATS = {
  naked_call:  { name:"Naked Call (OTM)",   emoji:"🎯", color:"#00ff88", risk:"HIGH",    ivNeed:"low",  best:["short_squeeze","delta_squeeze","staircase"],        how:"Buy 1 OTM call 1–2 strikes above price. DTE = profile. Max 2% account.",          exit:"Sell 50–100% gain or when sweeps stop. Never past max hold day.", stop:"Down 50% OR put sweeps appear on same ticker.", pros:"Unlimited upside. Simple.", cons:"Full premium at risk. IV crush on high-IV tickers." },
  call_spread: { name:"Call Debit Spread",  emoji:"📐", color:"#ffe033", risk:"DEFINED", ivNeed:"high", best:["short_squeeze","gamma_squeeze","cap_flush","staircase"], how:"Buy ATM call + sell OTM call same expiry. Cuts cost and IV risk ~50%.",              exit:"Close at 50–75% max profit.",              stop:"Down 50% on spread.",          pros:"Defined risk. Cheaper. IV crush halved.", cons:"Caps upside at short strike." },
  atm_call:    { name:"ATM Call",           emoji:"⚡", color:"#44ffdd", risk:"MED",     ivNeed:"any",  best:["gamma_squeeze","delta_squeeze"],                     how:"Buy ATM call 3–10 DTE. Max delta sensitivity for fast moves.",                    exit:"50–80% and leave. Gamma reverses fast.",   stop:"Price stalls at GEX wall.",    pros:"Max delta. Best for explosive moves.", cons:"Expensive. Theta kills on stall." },
  itm_call:    { name:"Deep ITM Call",      emoji:"🐋", color:"#44ffbb", risk:"LOWER",   ivNeed:"any",  best:["liquidity_sq","ftd_squeeze","staircase"],            how:"Buy 0.80+ delta call. Moves 1:1 with stock. Minimal theta.",                       exit:"Sell when volume dries or hits resistance.", stop:"Break below staircase zone.",  pros:"Minimal decay. High delta.", cons:"More capital. Less leverage." },
  leaps:       { name:"LEAPS (45–90 DTE)",  emoji:"⏳", color:"#ff9900", risk:"MEDIUM",  ivNeed:"any",  best:["ftd_squeeze","staircase"],                          how:"Buy call 45–90 DTE, delta 0.50–0.70. Time for T+35 buy-in cycles.",               exit:"Close when SI drops sharply.",             stop:"FTDs normalize 5+ days.",      pros:"Survives false starts. Low daily theta.", cons:"Slower move. More premium at risk." },
  naked_put:   { name:"Naked Put (OTM)",    emoji:"🩸", color:"#ff3355", risk:"HIGH",    ivNeed:"low",  best:["cap_flush","margin_flush"],                         how:"Buy OTM put 1–2 strikes below price. 7–14 DTE.",                                 exit:"50–100% gain. Exit by Day 5.",             stop:"Call sweeps appear.",          pros:"Max downside profit.", cons:"Full premium at risk." },
  put_spread:  { name:"Put Debit Spread",   emoji:"📉", color:"#ff7755", risk:"DEFINED", ivNeed:"high", best:["cap_flush","gamma_flush","liq_flush"],               how:"Buy ATM put + sell OTM put same expiry.",                                         exit:"50–75% max profit.",                       stop:"DP buy prints at lows.",       pros:"Cheaper. Defined risk.", cons:"Caps downside capture." },
  fast_put:    { name:"0–3 DTE ATM Put",    emoji:"🎯", color:"#ff9955", risk:"V.HIGH",  ivNeed:"any",  best:["stop_hunt"],                                        how:"ATM put 0–3 DTE. Enter on support break. Day trade only.",                        exit:"Same session or next morning. Never overnight.", stop:"Price reclaims support.",  pros:"Cheap. Max leverage intraday.", cons:"Theta destroys overnight." },
  uvxy_call:   { name:"UVXY Calls",         emoji:"🌋", color:"#cc44ff", risk:"V.HIGH",  ivNeed:"any",  best:["vix_flush","vol_squeeze"],                          how:"UVXY calls ATM 2–3 weeks out. Vol spikes fast and brutal.",                       exit:"Sell INTO the spike. 2–4 days max.",       stop:"VIX starts dropping.",         pros:"Designed for vol spikes. 3–5x potential.", cons:"UVXY decays hard." },
  diagonal:    { name:"Diagonal Spread",    emoji:"📅", color:"#7799bb", risk:"MEDIUM",  ivNeed:"any",  best:["ftd_squeeze","vol_squeeze","staircase"],            how:"Buy 30–45 DTE call + sell 7–14 DTE OTM call.",                                   exit:"Near-term expires, reassess.",             stop:"Long leg down 40%.",           pros:"Reduces cost basis. Time on side.", cons:"Complex. Capped near-term." },
};

function getBestStrats(sqType, ivHigh) {
  if (!sqType) return [];
  const m = Object.entries(STRATS).filter(([,s]) =>
    s.best.includes(sqType) && (s.ivNeed==="any"||(s.ivNeed==="high"&&ivHigh)||(s.ivNeed==="low"&&!ivHigh))
  );
  if (m.length < 2) m.push(["diagonal", STRATS.diagonal]);
  return m.slice(0,2);
}

// ── WIN PROBABILITY ──────────────────────────────────────────────────────────
function calcWinProb(p) {
  if (p.cat === "macro") return null;
  let pts = 0;
  const s   = p.short || {};
  const si  = parseFloat(s.si_pct || 0);
  const dtc = parseFloat(s.days_to_cover || 0);
  const soi = p.oi > 0 ? p.size / p.oi : 0;
  const sc  = parseInt(p.staircase_days || 0);
  const pc  = parseFloat(p.options_vol?.put_call_ratio || 0);
  // Core flow confirmation (0-28)
  pts += p.sweepOk && p.dpOk ? 28 : p.sweepOk || p.dpOk ? 12 : 4;
  // Staircase — institutional accumulation (0-20)
  pts += sc >= 7 ? 20 : sc >= 5 ? 15 : sc >= 3 ? 9 : sc >= 2 ? 4 : 0;
  // Repeat sweeps (0-10)
  pts += (p.sweep_count||1) >= 3 ? 10 : (p.sweep_count||1) >= 2 ? 5 : 0;
  // Size vs OI (0-12)
  pts += soi >= 5 ? 12 : soi >= 3 ? 8 : soi >= 2 ? 4 : 0;
  // Short data for squeezes (0-20)
  if (p.cat === "squeeze") {
    pts += si >= 30 ? 10 : si >= 20 ? 7 : si >= 10 ? 3 : 0;
    pts += dtc >= 5 ? 6 : dtc >= 3 ? 3 : 0;
    pts += parseFloat(s.borrow_rate||0) >= 30 ? 2 : 0;
    pts += s.ftds_elevated ? 2 : 0;
  }
  // GEX bias (0-8)
  if (p.gex?.bias === "short_gamma" && p.cat === "squeeze") pts += 8;
  if (p.gex?.bias === "long_gamma"  && p.cat === "flush")   pts += 8;
  // Net premium momentum (0-8)
  if (p.cat === "squeeze" && p.net_prem?.trending === "up")   pts += 8;
  if (p.cat === "flush"   && p.net_prem?.trending === "down") pts += 8;
  if (p.cat === "squeeze" && p.net_prem?.trending === "down") pts -= 5;
  // P/C ratio (0-6)
  if (p.cat === "squeeze" && pc > 0 && pc < 0.5) pts += 6;
  if (p.cat === "flush"   && pc > 1.2)           pts += 6;
  // Ask quality (0-4)
  pts += parseFloat(p.ask_pct||0) >= 0.9 ? 4 : parseFloat(p.ask_pct||0) >= 0.7 ? 2 : 0;
  // OTM bonus (0-2)
  if (p.is_otm) pts += 2;
  // Penalties
  if (p.earnings?.within_14_days) pts = Math.round(pts * 0.7);
  const td = parseInt(p.trade_day || p.day || 1);
  if (td === 2) pts = Math.round(pts * 0.85);
  if (td === 3) pts = Math.round(pts * 0.65);
  if (td >= 7)  pts = Math.round(pts * 0.45);
  return Math.max(5, Math.min(95, pts));
}

function getHoldStatus(td, sqType) {
  const max = (PROF[sqType] || PROF.short_squeeze).holdDays;
  const pct = td / max;
  if (td <= 1)    return { label:"ENTER",       color:"#00ff88", action:"enter" };
  if (pct <= 0.4) return { label:"HOLD",         color:"#ffe033", action:"hold" };
  if (pct <= 0.7) return { label:"MONITOR",      color:"#ffaa44", action:"monitor" };
  if (pct <= 0.9) return { label:"TRIM 25–50%",  color:"#ff9955", action:"prepare" };
  return           { label:"EXIT NOW",      color:"#ff3355", action:"exit" };
}

function getGuidance(p) {
  const prob = p.winProb || 0;
  const prof = PROF[p.sqType] || PROF.short_squeeze;
  const td   = parseInt(p.trade_day || p.day || 1);
  const hs   = getHoldStatus(td, p.sqType);
  const sc   = parseInt(p.staircase_days || 0);
  const lines = [];
  if (p.cat === "macro") {
    lines.push(p.sqType === "macro_bull" ? "Market bias BULLISH. Squeeze setups get a tailwind. Size up on confirmed plays." : "Market bias BEARISH. Strong headwind. Size down everything. Don't fight the tape.");
    return lines;
  }
  if (sc >= 3 && !p.sweepOk)        lines.push(`👀 ${sc}-DAY STAIRCASE — Institutions quietly accumulating at ${p.staircase_zone || "this zone"}. No sweep yet. Watch for call sweeps to fire entry.`);
  else if (hs.action === "exit")     lines.push(`🚨 EXIT NOW — Day ${td}, max hold (${prof.hold}) reached. Sell today. Non-negotiable.`);
  else if (hs.action === "prepare")  lines.push(`⚠️ TRIM — Approaching max hold. Cut 25–50% now. Hold rest if sweeps still printing.`);
  else if (td===1 && p.sweepOk && p.dpOk) lines.push(`✅ ENTER NOW — Both sweep + DP confirmed Day 1${sc>=3?` + ${sc}-day staircase`:""}. ${prob>=65?"High conviction":"Solid"} setup.`);
  else if (td===1 && (p.sweepOk||p.dpOk)) lines.push("⚠️ WAIT — One signal confirmed. Watch for second (sweep OR DP) before entering.");
  else if (td===2 && prob>=50)       lines.push("🟡 HOLD — Day 2. Still valid. Last good entry if not in yet.");
  else if (td===2 && prob<50)        lines.push("⚠️ CAUTION — Day 2, weak signals. Only hold if already in.");
  else                               lines.push("📊 MONITORING — Watch for sweep + DP confirmation before committing capital.");
  const strats = getBestStrats(p.sqType, !!p.iv?.elevated);
  if (strats.length > 0) {
    const [, s] = strats[0];
    lines.push(`BEST PLAY: ${s.emoji} ${s.name} (${s.risk} risk) — ${s.how}`);
    lines.push(`EXIT: ${s.exit}`);
    lines.push(`STOP: ${s.stop}`);
  }
  if (p.earnings?.within_14_days) lines.push("⚠️ EARNINGS in 14 days — IV crush risk. Use spread or skip.");
  if (p.iv?.elevated)             lines.push("⚠️ HIGH IV — Use debit spread to cut IV crush risk in half.");
  if (p.gex?.bias==="short_gamma" && p.cat==="squeeze") lines.push("🔥 SHORT GAMMA — Moves amplified. Squeeze goes further and faster than normal.");
  if (p.sqType==="vol_squeeze")   lines.push("📌 VOL SQUEEZE — IV compressed like a coiled spring. Break will be violent.");
  return lines;
}

// ── TECHNICAL READ + VERDICT ENGINE ──────────────────────────────────────────
// Tech bias comes from ICHIMOKU on 5m bars — not from the signal category.
// Macro bias comes from UW market tide (macro_bull / macro_bear signals in feed).
// Framework rule:
//   Tech BULLISH + Macro BULLISH = CALLS full size
//   Tech BEARISH + Macro BEARISH = PUTS full size
//   Tech BULLISH + Macro BEARISH = COIN FLIP (conflict — can't tell which wins)
//   Tech BEARISH + Macro BULLISH = COIN FLIP (conflict — can't tell which wins)
//   Tech NEUTRAL or Macro NEUTRAL = CASH (no edge either way)
//   No Ichimoku data = PENDING (not enough technical data to decide)
function getTechnicalRead(p, macroBias) {
  // MACRO comes from market tide — unchanged
  const mb = macroBias === "BULLISH" || macroBias === "BEARISH" ? macroBias : "NEUTRAL";

  // TECH BIAS strictly from Ichimoku. No fallback to squeeze/flush category.
  const ich = p.ichimoku || null;
  const techBias = ich?.bias || "PENDING";
  const techStrength = ich?.strength || null;

  // IV READ — from near/far term structure + elevated flag
  const ivNear = parseFloat(p.iv?.near) || 0;
  const ivFar  = parseFloat(p.iv?.far)  || 0;
  const ivRank = (ivNear > 0 && ivFar > 0)
    ? Math.min(100, Math.max(0, Math.round(((ivNear - ivFar) / Math.max(ivFar, 1)) * 100 + 50)))
    : null;
  const ivHigh = !!p.iv?.elevated || (ivRank !== null && ivRank >= 55);

  // SUGGESTED STRATEGY based on tech direction + IV regime
  const suggestedStrategy = (() => {
    if (techBias === "BULLISH") return ivHigh ? "Call Debit Spread (IV hedge)" : "Naked Call OTM";
    if (techBias === "BEARISH") return ivHigh ? "Put Debit Spread (IV hedge)" : "Naked Put OTM";
    if (techBias === "NEUTRAL") return "Iron Condor or Stay Out";
    return "Wait for Ichimoku read";
  })();
  const creditAlt = (() => {
    if (!ivHigh) return null;
    if (techBias === "BULLISH") return "Bull Put Credit Spread (sell IV)";
    if (techBias === "BEARISH") return "Bear Call Credit Spread (sell IV)";
    return null;
  })();

  // VERDICT logic — implements the framework rule precisely
  let verdict, verdictConf, verdictReason, verdictColor;
  if (techBias === "PENDING") {
    verdict = "PENDING";
    verdictConf = 0;
    verdictReason = "Ichimoku data not yet loaded for this ticker. Wait for next scan cycle.";
    verdictColor = "#7591a8";
  } else if (techBias === "NEUTRAL" || mb === "NEUTRAL") {
    verdict = "CASH";
    verdictConf = 50;
    verdictReason = techBias === "NEUTRAL"
      ? "Price inside Ichimoku cloud — no trend. No directional edge."
      : "Macro neutral — no tailwind. Wait for tide to pick a side.";
    verdictColor = "#7aaed0";
  } else if (techBias === mb) {
    // Aligned — CALLS or PUTS
    verdict = techBias === "BULLISH" ? "CALLS" : "PUTS";
    const strengthBonus = techStrength === "STRONG" ? 15 : techStrength === "MODERATE" ? 8 : 0;
    verdictConf = Math.min(95, 50 + strengthBonus + Math.round((p.winProb || 50) * 0.3));
    verdictReason = `${techBias} Ichimoku (${techStrength}) + ${mb} macro aligned. Full size per framework.`;
    verdictColor = techBias === "BULLISH" ? "#00ff88" : "#ff3355";
  } else {
    // Conflict — tech and macro disagree → COIN FLIP
    verdict = "COIN FLIP";
    verdictConf = 50;
    verdictReason = `CONFLICT: ${techBias} Ichimoku vs ${mb} macro. No directional edge — 50/50 which side wins. Skip or size down hard.`;
    verdictColor = "#ffaa44";
  }

  // News sanity check — 24h recent news adds a confirm-flow caveat
  const newsRecent = p.news?.any && p.news.hours_ago != null && p.news.hours_ago <= 24;
  if (newsRecent && verdict !== "PENDING") {
    verdictReason += ` News ${p.news.hours_ago}h ago — confirm flow holds post-headline.`;
  }

  return {
    techBias, techStrength, macroBias: mb, ivNear, ivFar, ivRank, ivHigh,
    suggestedStrategy, creditAlt,
    verdict, verdictConf, verdictReason, verdictColor,
    ichimoku: ich,
  };
}

// ── SYSTEM PROMPT BUILDER ────────────────────────────────────────────────────
const buildSystem = (uwKey) => `You connect to Unusual Whales MCP (paid). Return ONE raw JSON array ONLY. First char MUST be [. Last char MUST be ]. No text before or after.

UW Bearer token: ${uwKey}

// ── ICHIMOKU CLOUD — client-side math on 5m OHLC bars ────────────────────────
// Computes Tenkan (9), Kijun (26), Senkou Span A/B (52 for B), Chikou (26-back),
// cloud state vs price, TK cross, and derives a BULLISH/BEARISH/NEUTRAL read.
function computeIchimoku(barsRaw) {
  if (!Array.isArray(barsRaw) || barsRaw.length < 55) return null;
  // Normalize bar shape — UW returns {open, high, low, close, start_time} or similar
  const bars = barsRaw.map(b => ({
    h: +(b.high ?? b.h ?? 0),
    l: +(b.low  ?? b.l ?? 0),
    c: +(b.close?? b.c ?? 0),
    t: b.start_time || b.timestamp || b.t || null,
  })).filter(b => b.h > 0 && b.l > 0 && b.c > 0);
  if (bars.length < 55) return null;
  // Assume bars arrive newest-first from UW; sort ascending (oldest → newest)
  const sorted = [...bars].sort((a,b) => {
    if (!a.t || !b.t) return 0;
    return new Date(a.t).getTime() - new Date(b.t).getTime();
  });
  const n = sorted.length;
  const hl = (period, endIdx) => {
    const start = Math.max(0, endIdx - period + 1);
    let hi = -Infinity, lo = Infinity;
    for (let i = start; i <= endIdx; i++) {
      if (sorted[i].h > hi) hi = sorted[i].h;
      if (sorted[i].l < lo) lo = sorted[i].l;
    }
    return (hi + lo) / 2;
  };
  const last = n - 1;
  const tenkan = hl(9, last);
  const kijun  = hl(26, last);
  const spanA  = (tenkan + kijun) / 2;
  const spanB  = hl(52, last);
  const close  = sorted[last].c;
  // Previous bar for TK-cross detection
  const prevTenkan = n >= 2 ? hl(9, last - 1)  : tenkan;
  const prevKijun  = n >= 2 ? hl(26, last - 1) : kijun;
  const tkCross =
    (prevTenkan <= prevKijun && tenkan > kijun) ? "bullish" :
    (prevTenkan >= prevKijun && tenkan < kijun) ? "bearish" :
    null;
  // Chikou confirmation: today's close vs price 26 bars ago
  const chikouRef = n > 26 ? sorted[last - 26].c : null;
  const chikouConfirm =
    chikouRef === null ? null :
    close > chikouRef ? "bullish" :
    close < chikouRef ? "bearish" : "neutral";
  // Cloud geometry
  const cloudTop = Math.max(spanA, spanB);
  const cloudBot = Math.min(spanA, spanB);
  const cloudColor = spanA > spanB ? "green" : spanA < spanB ? "red" : "flat";
  const priceZone = close > cloudTop ? "above" : close < cloudBot ? "below" : "inside";
  // Bias synthesis — standard Ichimoku rules
  let bias, strength, summary;
  if (priceZone === "above" && cloudColor === "green" && tenkan > kijun) {
    bias = "BULLISH"; strength = "STRONG";
    summary = "Price above green cloud + Tenkan>Kijun. Full trend-up posture.";
  } else if (priceZone === "above" && cloudColor === "green") {
    bias = "BULLISH"; strength = "MODERATE";
    summary = "Price above green cloud but TK flat — trend intact, momentum pausing.";
  } else if (priceZone === "above" && cloudColor === "red") {
    bias = "BULLISH"; strength = "WEAK";
    summary = "Price above cloud but cloud still red — recovery, not confirmed trend.";
  } else if (priceZone === "below" && cloudColor === "red" && tenkan < kijun) {
    bias = "BEARISH"; strength = "STRONG";
    summary = "Price below red cloud + Tenkan<Kijun. Full trend-down posture.";
  } else if (priceZone === "below" && cloudColor === "red") {
    bias = "BEARISH"; strength = "MODERATE";
    summary = "Price below red cloud but TK flat — downtrend intact, momentum pausing.";
  } else if (priceZone === "below" && cloudColor === "green") {
    bias = "BEARISH"; strength = "WEAK";
    summary = "Price below cloud but cloud still green — pullback, not confirmed reversal.";
  } else {
    bias = "NEUTRAL"; strength = "TRANSITION";
    summary = "Price inside the cloud — no trend. Wait for break above/below before acting.";
  }
  return {
    tenkan: +tenkan.toFixed(2),
    kijun:  +kijun.toFixed(2),
    spanA:  +spanA.toFixed(2),
    spanB:  +spanB.toFixed(2),
    cloudTop: +cloudTop.toFixed(2),
    cloudBot: +cloudBot.toFixed(2),
    close:  +close.toFixed(2),
    cloudColor, priceZone, tkCross, chikouConfirm,
    bias, strength, summary,
    bars: n,
  };
}

// ── V4 QUANT ENGINE ──────────────────────────────────────────────────────────
// Straight JS port of FINAL_V4/WATCHLIST_COLUMNS/*.ts — same buckets, same caps,
// same penalties, same thresholds. Kept in lockstep on purpose: if the dashboard
// and ThinkorSwim disagree on a ticker, one of them is wrong, and you need to be
// able to tell which. Runs on the same 5m OHLC bars the Ichimoku engine uses.
//
// Two deliberate deviations from the ThinkScript, both because the input is 5m
// bars rather than a daily column:
//   1. dollarVol is scaled by BARS_PER_DAY to approximate average DAILY dollar
//      volume, so the $2M liquidity floor means the same thing in both places.
//   2. VWAP is a real session VWAP rebuilt from the bars, not TOS's `vwap`.
const V4_BARS_PER_DAY = 78;   // 5m regular-hours bars

function v4Series(arr, len, fn) { return arr.map((_, i) => fn(i, len)); }

function v4Ema(arr, len) {
  const out = [], k = 2 / (len + 1);
  let prev = arr[0];
  out[0] = prev;
  for (let i = 1; i < arr.length; i++) { prev = arr[i] * k + prev * (1 - k); out[i] = prev; }
  return out;
}

function v4Wilder(arr, len) {
  const out = [];
  let prev = NaN;
  for (let i = 0; i < arr.length; i++) {
    if (i < len - 1) { out[i] = NaN; continue; }
    if (i === len - 1) { let t = 0; for (let k = 0; k < len; k++) t += arr[k]; prev = t / len; out[i] = prev; continue; }
    prev = (prev * (len - 1) + arr[i]) / len;
    out[i] = prev;
  }
  return out;
}

function v4Sma(arr, len, i) {
  if (i < len - 1) return NaN;
  let t = 0; for (let k = i - len + 1; k <= i; k++) t += arr[k];
  return t / len;
}
function v4Hi(arr, len, i) { let m = -Infinity; for (let k = Math.max(0, i - len + 1); k <= i; k++) if (arr[k] > m) m = arr[k]; return m; }
function v4Lo(arr, len, i) { let m = Infinity;  for (let k = Math.max(0, i - len + 1); k <= i; k++) if (arr[k] < m) m = arr[k]; return m; }
function v4Std(arr, len, i) {
  if (i < len - 1) return NaN;
  const m = v4Sma(arr, len, i);
  let t = 0; for (let k = i - len + 1; k <= i; k++) t += (arr[k] - m) ** 2;
  return Math.sqrt(t / len);   // population, matching ThinkScript StDev
}
// Inertia() = value of the linear regression line at the end of the window
function v4Linreg(arr, len, i) {
  if (i < len - 1) return NaN;
  let sx = 0, sy = 0, sxx = 0, sxy = 0;
  for (let k = 0; k < len; k++) { const x = k, y = arr[i - len + 1 + k]; sx += x; sy += y; sxx += x * x; sxy += x * y; }
  const den = len * sxx - sx * sx;
  if (den === 0) return NaN;
  const b = (len * sxy - sx * sy) / den;
  return (sy - b * sx) / len + b * (len - 1);
}
const v4Clamp = (x, lo, hi) => Math.max(lo, Math.min(hi, x));

function computeV4(barsRaw) {
  if (!Array.isArray(barsRaw) || barsRaw.length < 60) return null;
  const norm = barsRaw.map(b => ({
    o: +(b.open ?? b.o ?? 0), h: +(b.high ?? b.h ?? 0), l: +(b.low ?? b.l ?? 0),
    c: +(b.close ?? b.c ?? 0), v: +(b.volume ?? b.v ?? 0),
    t: b.start_time || b.timestamp || b.t || null,
  })).filter(b => b.h > 0 && b.l > 0 && b.c > 0);
  if (norm.length < 60) return null;
  const s = [...norm].sort((a, b) => (!a.t || !b.t) ? 0 : new Date(a.t) - new Date(b.t));

  const n = s.length, i = n - 1;
  const C = s.map(b => b.c), H = s.map(b => b.h), L = s.map(b => b.l), O = s.map(b => b.o), V = s.map(b => b.v);

  // ── ATR ────────────────────────────────────────────────────────────────────
  const TR = C.map((c, x) => x === 0 ? H[x] - L[x]
    : Math.max(H[x] - L[x], Math.abs(H[x] - C[x - 1]), Math.abs(L[x] - C[x - 1])));
  const ATR = v4Wilder(TR, 14);
  const atr = ATR[i], atrOK = isFinite(atr) && atr > 0;
  const atrPct = (C[i] > 0 && atrOK) ? 100 * atr / C[i] : NaN;

  // ── trend ──────────────────────────────────────────────────────────────────
  const emaF = v4Ema(C, 8), emaM = v4Ema(C, 21), emaS = v4Ema(C, 50);
  const stackUp = (emaF[i] > emaM[i] ? 1 : 0) + (emaM[i] > emaS[i] ? 1 : 0) + (C[i] > emaF[i] ? 1 : 0);
  const stackDn = (emaF[i] < emaM[i] ? 1 : 0) + (emaM[i] < emaS[i] ? 1 : 0) + (C[i] < emaF[i] ? 1 : 0);
  const stackUp5 = i >= 5 ? (emaF[i-5] > emaM[i-5] ? 1 : 0) + (emaM[i-5] > emaS[i-5] ? 1 : 0) + (C[i-5] > emaF[i-5] ? 1 : 0) : 0;
  const stackDn5 = i >= 5 ? (emaF[i-5] < emaM[i-5] ? 1 : 0) + (emaM[i-5] < emaS[i-5] ? 1 : 0) + (C[i-5] < emaF[i-5] ? 1 : 0) : 0;
  const slopeATR = (atrOK && i >= 10) ? (emaM[i] - emaM[i - 10]) / atr : 0;

  // ── ADX / DI ───────────────────────────────────────────────────────────────
  const plusDM = [], minusDM = [];
  for (let x = 0; x < n; x++) {
    if (x === 0) { plusDM[x] = 0; minusDM[x] = 0; continue; }
    const up = H[x] - H[x - 1], dn = L[x - 1] - L[x];
    plusDM[x]  = (up > dn && up > 0) ? up : 0;
    minusDM[x] = (dn > up && dn > 0) ? dn : 0;
  }
  const trW = v4Wilder(TR, 14), pW = v4Wilder(plusDM, 14), mW = v4Wilder(minusDM, 14);
  const DX = [];
  for (let x = 0; x < n; x++) {
    const t = trW[x];
    const pdi = (!isFinite(t) || t <= 0) ? 0 : 100 * pW[x] / t;
    const mdi = (!isFinite(t) || t <= 0) ? 0 : 100 * mW[x] / t;
    DX[x] = (pdi + mdi) <= 0 ? 0 : 100 * Math.abs(pdi - mdi) / (pdi + mdi);
  }
  const plusDI  = (trW[i] > 0) ? 100 * pW[i] / trW[i] : 0;
  const minusDI = (trW[i] > 0) ? 100 * mW[i] / trW[i] : 0;
  const ADXs = v4Wilder(DX, 14);
  const adx = ADXs[i] || 0;

  // ── RSI ────────────────────────────────────────────────────────────────────
  const up = [], dn = [];
  for (let x = 0; x < n; x++) { const d = x === 0 ? 0 : C[x] - C[x - 1]; up[x] = Math.max(d, 0); dn[x] = Math.max(-d, 0); }
  const uW = v4Wilder(up, 14)[i], dW = v4Wilder(dn, 14)[i];
  const rsi = (!isFinite(uW) || !isFinite(dW) || (uW + dW) <= 0) ? 50 : 100 * uW / (uW + dW);

  // ── volume / liquidity ─────────────────────────────────────────────────────
  const avgVol = v4Sma(V, 30, i);
  const rvol = (!isFinite(avgVol) || avgVol <= 0) ? NaN : V[i] / avgVol;
  const rvolSafe = isFinite(rvol) ? rvol : 0;
  const volFast = v4Sma(V, 5, i), volSlow = v4Sma(V, 50, i);
  const volTrend = (!isFinite(volSlow) || volSlow <= 0) ? 1 : volFast / volSlow;
  const dollarVol = C[i] * (isFinite(avgVol) ? avgVol : 0) * V4_BARS_PER_DAY;
  const minDollarVol = 2000000;

  // ── money flow ─────────────────────────────────────────────────────────────
  let mfSum = 0, volSum = 0;
  for (let x = Math.max(0, i - 19); x <= i; x++) {
    const r = H[x] - L[x];
    const clv = r <= 0 ? 0 : (2 * C[x] - H[x] - L[x]) / r;
    mfSum += clv * V[x]; volSum += V[x];
  }
  const cmf = volSum <= 0 ? 0 : mfSum / volSum;

  // ── session VWAP ───────────────────────────────────────────────────────────
  const VW = [];
  let num = 0, den = 0, curDay = null;
  for (let x = 0; x < n; x++) {
    const d = s[x].t ? new Date(s[x].t).toDateString() : "0";
    if (d !== curDay) { curDay = d; num = 0; den = 0; }
    num += ((H[x] + L[x] + C[x]) / 3) * V[x]; den += V[x];
    VW[x] = den > 0 ? num / den : NaN;
  }
  const vw = VW[i], vwapOK = isFinite(vw) && vw > 0;
  const vwapEdge = (vwapOK && atrOK) ? v4Clamp((C[i] - vw) / (1.5 * atr), -1, 1) : 0;
  const vwapSide = !vwapOK ? 0 : C[i] > vw ? 1 : C[i] < vw ? -1 : 0;

  // ── Darvas box (completed bars only) ───────────────────────────────────────
  const boxTopAt = x => x < 1 ? NaN : v4Hi(H, 20, x - 1);
  const boxBotAt = x => x < 1 ? NaN : v4Lo(L, 20, x - 1);
  const boxTop = boxTopAt(i), boxBot = boxBotAt(i);
  const boxRange = boxTop - boxBot;
  const posInBox = boxRange <= 0 ? 0.5 : v4Clamp((C[i] - boxBot) / boxRange, 0, 1);
  const distTopATR = atrOK ? (boxTop - C[i]) / atr : NaN;
  const brokeOut = C[i] > boxTop, brokeDown = C[i] < boxBot;
  const confirmUp = brokeOut && C[i - 1] > boxTopAt(i - 1);
  const confirmDn = brokeDown && C[i - 1] < boxBotAt(i - 1);
  const failedBO = !brokeOut && [1, 2, 3].some(k => i - k >= 1 && C[i - k] > boxTopAt(i - k));
  let sinceBO = 999;
  for (let x = 1; x < n; x++) {
    const bo = C[x] > boxTopAt(x), boPrev = C[x - 1] > boxTopAt(x - 1);
    sinceBO = (bo && !boPrev) ? 0 : Math.min(sinceBO + 1, 999);
  }
  const boxRising = boxTop > boxTopAt(i - 20) ? 1 : boxTop < boxTopAt(i - 20) ? -1 : 0;

  // ── squeeze ────────────────────────────────────────────────────────────────
  const sqzSrc = C.map((c, x) => c - ((v4Hi(H, 20, x) + v4Lo(L, 20, x)) / 2 + v4Sma(C, 20, x)) / 2);
  const sqzMomAt = x => v4Linreg(sqzSrc, 20, x);
  const sqzMom = sqzMomAt(i), sqzMom1 = sqzMomAt(i - 1), sqzMom3 = sqzMomAt(i - 3);
  const BW = [], SQZ = [];
  for (let x = 0; x < n; x++) {
    const basis = v4Sma(C, 20, x), sd = v4Std(C, 20, x), kc = v4Sma(TR, 20, x);
    const bbU = basis + 2.0 * sd, bbD = basis - 2.0 * sd;
    const kcU = basis + 1.5 * kc, kcD = basis - 1.5 * kc;
    SQZ[x] = isFinite(bbU) && isFinite(kcU) && bbU < kcU && bbD > kcD;
    BW[x] = (!isFinite(basis) || basis <= 0) ? NaN : 100 * (bbU - bbD) / basis;
  }
  const BWlo = BW.map(x => isFinite(x) ? x : Infinity), BWhi = BW.map(x => isFinite(x) ? x : -Infinity);
  const bwRankAt = x => {
    if (x < 0 || !isFinite(BW[x])) return 50;
    const lo = v4Lo(BWlo, 100, x), hi = v4Hi(BWhi, 100, x);
    return (hi - lo) <= 0 ? 50 : 100 * (BW[x] - lo) / (hi - lo);
  };
  const bwRank = bwRankAt(i);
  let sqzBars = 0, sinceFire = 999;
  for (let x = 1; x < n; x++) {
    sqzBars = SQZ[x] ? sqzBars + 1 : 0;
    sinceFire = (!SQZ[x] && SQZ[x - 1]) ? 0 : Math.min(sinceFire + 1, 999);
  }
  const sqzOn = !!SQZ[i];

  // ── efficiency / extension / spike ─────────────────────────────────────────
  let erDen = 0; for (let x = Math.max(1, i - 19); x <= i; x++) erDen += Math.abs(C[x] - C[x - 1]);
  const effRatio = erDen <= 0 ? 0 : v4Clamp(Math.abs(C[i] - C[Math.max(0, i - 20)]) / erDen, 0, 1);
  const extATR = atrOK ? (C[i] - emaM[i]) / atr : 0;
  const spike = (atrOK && isFinite(ATR[i - 1]) && ATR[i - 1] > 0) ? TR[i] > 3 * ATR[i - 1] : false;

  // ── extension from equilibrium, in ATR units ───────────────────────────────
  // Distance from the NEARER of two equilibria: trend mean (EMA21) and session
  // mean (VWAP). VWAP alone was wrong — on a normal intraday trend day price
  // drifts several ATR from the session open while sitting on its trend mean,
  // which read as "chase risk" and hard-blocked SCORE. You are not chasing if
  // price is near EITHER equilibrium. On Daily this collapses to the EMA term.
  const extEma  = atrOK ? Math.abs(C[i] - emaM[i]) / atr : NaN;
  const extVwap = (atrOK && vwapOK) ? Math.abs(C[i] - vw) / atr : NaN;
  const extensionATR = !isFinite(extEma) ? extVwap
    : !isFinite(extVwap) ? extEma : Math.min(extEma, extVwap);
  const extSafe = isFinite(extensionATR) ? extensionATR : 0;
  const extBand = !isFinite(extensionATR) ? 0
    : extensionATR < 0.50 ? 2 : extensionATR < 1.00 ? 1
    : extensionATR < 1.50 ? 0 : extensionATR < 2.00 ? -1 : -2;

  // ── liquidity score — tradeability, NOT market depth ──────────────────────
  const liqDV = dollarVol >= 200000000 ? 45 : dollarVol >= 100000000 ? 40
    : dollarVol >= 50000000 ? 34 : dollarVol >= 25000000 ? 28
    : dollarVol >= 10000000 ? 20 : dollarVol >= 5000000 ? 12
    : dollarVol >= minDollarVol ? 6 : 0;
  const liqPrice = C[i] >= 10 ? 25 : C[i] >= 5 ? 20 : C[i] >= 2 ? 12 : C[i] >= 1 ? 5 : 0;
  const liqPart  = rvolSafe >= 1.5 ? 20 : rvolSafe >= 1.0 ? 16 : rvolSafe >= 0.75 ? 10 : 4;
  const liqTurn  = avgVol >= 2000000 ? 10 : avgVol >= 500000 ? 7 : avgVol >= 200000 ? 4 : 0;
  const liquidityScore = Math.round(v4Clamp(liqDV + liqPrice + liqPart + liqTurn, 0, 100));

  // ── SmartFlow proxy ────────────────────────────────────────────────────────
  const cmfN = v4Clamp(cmf / 0.25, -1, 1);
  const cmfSign = cmfN > 0 ? 1 : cmfN < 0 ? -1 : 0;
  const smartFlow = Math.round(v4Clamp(
    55 * cmfN + 25 * vwapEdge + 20 * cmfSign * v4Clamp((rvolSafe - 1) / 2, 0, 1), -100, 100));

  // ── squeeze quality ────────────────────────────────────────────────────────
  const compression = v4Clamp(100 - bwRank, 0, 100);
  const durScore = Math.min(100, sqzBars * 4);
  const volContract = v4Clamp(100 * (1.4 - ((volSlow > 0) ? volFast / volSlow : 1)) / 0.8, 0, 100);
  const atrSlow = v4Sma(ATR.map(x => isFinite(x) ? x : 0), 50, i);
  const atrCompress = atrSlow <= 0 ? 50 : v4Clamp(100 * (1.3 - atr / atrSlow) / 0.7, 0, 100);
  const momBuild = Math.abs(sqzMom) > Math.abs(sqzMom3) ? 100 : Math.abs(sqzMom) > Math.abs(sqzMom1) ? 60 : 20;
  const sqzHitRaw = 0.30 * compression + 0.20 * durScore + 0.15 * volContract + 0.15 * atrCompress + 0.20 * momBuild;
  const sqzHit = Math.round(v4Clamp(
    sqzOn ? sqzHitRaw : sinceFire <= 3 ? Math.max(sqzHitRaw, 70) : sinceFire <= 10 ? sqzHitRaw * 0.85 : sqzHitRaw * 0.60, 0, 100));
  const sqzState = sqzOn ? 2 : sinceFire <= 3 ? 1 : sinceFire <= 10 ? -1 : 0;

  // ── Darvas state + bias ────────────────────────────────────────────────────
  const darvasScan = confirmUp ? 3 : brokeOut ? 2
    : (isFinite(distTopATR) && distTopATR > 0 && distTopATR <= 1.0 && rvolSafe >= 1.0) ? 1
    : confirmDn ? -2 : brokeDown ? -1 : 0;
  const biasRaw = (posInBox >= 0.80 ? 2 : posInBox >= 0.60 ? 1 : posInBox <= 0.20 ? -2 : posInBox <= 0.40 ? -1 : 0)
    + boxRising + (stackUp === 3 ? 1 : stackDn === 3 ? -1 : 0);
  const darvasBias = biasRaw >= 3 ? 2 : biasRaw >= 1 ? 1 : biasRaw <= -3 ? -2 : biasRaw <= -1 ? -1 : 0;

  // ── StableScore ────────────────────────────────────────────────────────────
  const trendPts = Math.min(20,
      (stackUp === 3 || stackDn === 3 ? 8 : stackUp === 2 || stackDn === 2 ? 5 : 0)
    + (adx >= 30 ? 7 : adx >= 22 ? 5 : adx >= 16 ? 2 : 0)
    + (Math.abs(slopeATR) >= 2 ? 5 : Math.abs(slopeATR) >= 1 ? 3 : 0));
  const rsiQual = (rsi >= 55 && rsi <= 72) ? 6 : (rsi <= 45 && rsi >= 28) ? 6
    : (rsi > 78 || rsi < 22) ? 1 : (rsi > 72 || rsi < 28) ? 2 : 3;
  const momPts = Math.min(15, rsiQual
    + (effRatio >= 0.45 ? 5 : effRatio >= 0.30 ? 3 : 0)
    + (Math.abs(sqzMom) > Math.abs(sqzMom3) ? 4 : 0));
  const rvolPts = rvolSafe >= 3 ? 12 : rvolSafe >= 2 ? 10 : rvolSafe >= 1.5 ? 8
    : rvolSafe >= 1.0 ? 5 : rvolSafe >= 0.75 ? 2 : 0;
  const partPts = Math.min(20, rvolPts
    + (volTrend >= 1.3 ? 4 : volTrend >= 1.1 ? 2 : 0)
    + (Math.abs(cmf) >= 0.15 ? 4 : Math.abs(cmf) >= 0.07 ? 2 : 0));
  const atrBand = !isFinite(atrPct) ? 0
    : (atrPct >= 1.5 && atrPct <= 5) ? 10 : (atrPct >= 1.0 && atrPct < 1.5) ? 7
    : (atrPct > 5 && atrPct <= 8) ? 6 : atrPct > 8 ? 2 : 3;
  const atrMean = v4Sma(ATR.map(x => isFinite(x) ? x : 0), 20, i);
  const atrStable = (atrOK && atrMean > 0) ? (Math.abs(atr / atrMean - 1) <= 0.35 ? 5 : 2) : 0;
  const volaPts = Math.min(15, atrBand + atrStable);
  const locPts = Math.min(15,
      ((posInBox >= 0.75 || posInBox <= 0.25) ? 6 : 3)
    + ((isFinite(distTopATR) && distTopATR >= 0 && distTopATR <= 1.5) ? 5 : (brokeOut || brokeDown) ? 4 : 0)
    + (Math.abs(extATR) <= 3 ? 4 : 0));
  const liqPts = dollarVol >= 100000000 ? 15 : dollarVol >= 25000000 ? 12
    : dollarVol >= 10000000 ? 9 : dollarVol >= minDollarVol ? 5 : 0;
  const rawStable = trendPts + momPts + partPts + volaPts + locPts + liqPts;
  const penalty =
      (dollarVol < minDollarVol ? 0.55 : 1)
    * (rvolSafe < 0.50 ? 0.80 : 1)
    * (spike ? 0.80 : 1)
    * (Math.abs(extATR) > 4 ? 0.80 : 1)
    * ((adx < 15 && !sqzOn) ? 0.85 : 1)
    * ((isFinite(atrPct) && atrPct > 12) ? 0.75 : 1)
    * (failedBO ? 0.80 : 1);
  const penaltyFloor = Math.max(0.40, penalty);
  const buckets70 = (trendPts >= 14 ? 1 : 0) + (momPts >= 10.5 ? 1 : 0) + (partPts >= 14 ? 1 : 0)
                  + (volaPts >= 10.5 ? 1 : 0) + (locPts >= 10.5 ? 1 : 0) + (liqPts >= 10.5 ? 1 : 0);
  const stableUncapped = rawStable * penaltyFloor;
  const stableScore = Math.round(v4Clamp(buckets70 >= 3 ? stableUncapped : Math.min(74, stableUncapped), 0, 100));

  // ── direction + confidence ─────────────────────────────────────────────────
  const sigTrend  = (stackUp >= 2 && slopeATR > 0) ? 1 : (stackDn >= 2 && slopeATR < 0) ? -1 : 0;
  const sigMom    = (rsi > 55 && sqzMom > 0) ? 1 : (rsi < 45 && sqzMom < 0) ? -1 : 0;
  const sigFlow   = cmf > 0.05 ? 1 : cmf < -0.05 ? -1 : 0;
  const sigStruct = (brokeOut || posInBox >= 0.75) ? 1 : (brokeDown || posInBox <= 0.25) ? -1 : 0;
  const sigDI     = plusDI > minusDI ? 1 : minusDI > plusDI ? -1 : 0;
  const netSig = sigTrend + sigMom + sigFlow + sigStruct + vwapSide + sigDI;
  const activeSig = Math.abs(sigTrend) + Math.abs(sigMom) + Math.abs(sigFlow)
                  + Math.abs(sigStruct) + Math.abs(vwapSide) + Math.abs(sigDI);
  const direction = netSig >= 4 ? 2 : netSig >= 2 ? 1 : netSig <= -4 ? -2 : netSig <= -2 ? -1 : 0;
  const agreement = activeSig <= 0 ? 0 : 100 * Math.abs(netSig) / activeSig;
  const confidence = Math.round(v4Clamp(
    direction === 0 ? Math.min(45, agreement) : agreement * (0.75 + 0.25 * Math.min(1, activeSig / 6)), 0, 100));

  // ── SCORE ───────────────────────────────────────────────────────────────────
  const scoreRaw = 0.55 * stableScore + 0.20 * Math.abs(smartFlow) + 0.15 * confidence + 0.10 * sqzHit;
  // QUALITY GATES. A high raw blend is necessary but never sufficient: elite
  // SCORE needs four of six gates, and three conditions block it outright.
  const scoreGate = (stableScore >= 55 ? 1 : 0) + (confidence >= 55 ? 1 : 0)
                 + (Math.abs(smartFlow) >= 25 ? 1 : 0) + (Math.abs(darvasScan) >= 1 ? 1 : 0)
                 + (liquidityScore >= 50 ? 1 : 0) + (direction !== 0 ? 1 : 0);
  const scoreBlock = direction === 0 || liquidityScore < 35 || extSafe > 3.0;
  // A one-bar spike maxes SmartFlow and Confidence at once, which clears
  // several gates on its own. StableScore already discounts it; SCORE must too.
  const scorePenalty = (spike ? 0.85 : 1) * (failedBO ? 0.90 : 1);
  const v4Score = Math.round(v4Clamp(
    (scoreBlock ? Math.min(55, scoreRaw) : scoreGate >= 4 ? scoreRaw : Math.min(72, scoreRaw)) * scorePenalty, 0, 100));

  // ── timing: is the move still available? ──────────────────────────────────
  const volAccel  = i >= 3 && rvolSafe > ((v4Sma(V,30,i-3) > 0) ? V[i-3] / v4Sma(V,30,i-3) : 0) && rvolSafe >= 1.1;
  const momAccel  = Math.abs(sqzMom) > Math.abs(sqzMom3);
  const nearBO    = isFinite(distTopATR) && distTopATR > 0 && distTopATR <= 1.0;
  const sqzTrans  = (sqzOn && sqzBars >= 5) || sinceFire <= 2;
  const exhausted = (rsi > 78 || rsi < 22) && extSafe >= 1.5;
  const timingRaw = extBand + (volAccel ? 1 : 0) + (momAccel ? 1 : 0)
                  + (nearBO ? 1 : 0) + (sqzTrans ? 1 : 0) + (exhausted ? -2 : 0);
  const v4Timing = timingRaw >= 4 ? 2 : timingRaw >= 2 ? 1
                 : timingRaw <= -3 ? -2 : timingRaw <= -1 ? -1 : 0;

  // ── regime ─────────────────────────────────────────────────────────────────
  const revUp = rsi < 32 && C[i] > O[i] && cmf > 0 && C[i] > C[i - 1];
  const revDn = rsi > 68 && C[i] < O[i] && cmf < 0 && C[i] < C[i - 1];
  const regime = sqzOn ? 3 : (brokeOut || brokeDown || sinceFire <= 3) ? 2 : (revUp || revDn) ? 4
    : (adx >= 25 && Math.abs(slopeATR) >= 1) ? 1
    : (isFinite(atrPct) && atrPct > 6) ? 5 : (isFinite(atrPct) && atrPct < 1) ? 6 : 0;
  const regimeName = ["CHOP", "TREND", "BREAKOUT", "SQUEEZE", "REVERSAL", "HIGH VOL", "LOW VOL"][regime] || "CHOP";

  // ── early entry ────────────────────────────────────────────────────────────
  // TRANSITION engine: every term compares now against a few bars ago, so a
  // name that has been strong for weeks scores near zero and a name crossing
  // into strength scores high. Not "the master scan with lower thresholds".
  const rvolAt = x => { const a = v4Sma(V, 30, x); return (!isFinite(a) || a <= 0) ? 0 : V[x] / a; };
  const volTrendAt = x => { const sl = v4Sma(V, 50, x); return (!isFinite(sl) || sl <= 0) ? 1 : v4Sma(V, 5, x) / sl; };
  const rvolRising    = i >= 3 && rvolSafe > rvolAt(i - 3) && rvolSafe >= 1.1;
  const volAccelE     = i >= 3 && volTrend > volTrendAt(i - 3) && volTrend >= 1.05;
  const adxImproving  = i >= 3 && adx > (ADXs[i - 3] || 0) && adx >= 15 && adx < 35;
  const stackFlip     = (stackUp >= 2 && stackUp5 < 2) || (stackDn >= 2 && stackDn5 < 2);
  const vwapReclaim   = vwapOK && C[i] > vw && i >= 3 && C[i - 3] < VW[i - 3];
  const momSlopeUp    = Math.abs(sqzMom) > Math.abs(sqzMom3) && Math.abs(sqzMom3) > Math.abs(sqzMomAt(i - 6));
  const compReleasing = (sqzOn && bwRank < bwRankAt(i - 3)) || sinceFire <= 2;
  const approachingBO = isFinite(distTopATR) && distTopATR > 0 && distTopATR <= 1.5;
  const earlyScore = Math.round(v4Clamp(
      (rvolRising ? 16 : 0) + (volAccelE ? 10 : 0) + (adxImproving ? 12 : 0)
    + (stackFlip ? 14 : 0) + (vwapReclaim ? 12 : 0) + (momSlopeUp ? 10 : 0)
    + (compReleasing ? 12 : 0) + (approachingBO ? 14 : 0)
    - (extSafe > 1.5 ? 20 : extSafe > 1.0 ? 8 : 0), 0, 100));

  // ── confirmation level ─────────────────────────────────────────────────────
  const cTrend  = (stackUp >= 2 || stackDn >= 2) && adx >= 20;
  const cMom    = Math.abs(sqzMom) > Math.abs(sqzMom3) && ((sqzMom > 0 && rsi > 50) || (sqzMom < 0 && rsi < 50));
  const cVola   = isFinite(atrPct) && atrPct >= 1.0 && atrPct <= 8;
  const cLiq    = dollarVol >= minDollarVol;
  const confCount = (cTrend ? 1 : 0) + (cMom ? 1 : 0) + (rvolSafe >= 1.25 ? 1 : 0) + (cVola ? 1 : 0)
    + (Math.abs(darvasScan) >= 1 ? 1 : 0) + (Math.abs(smartFlow) >= 25 ? 1 : 0) + ((sqzOn || sinceFire <= 5) ? 1 : 0);
  const v4Confirmed = !cLiq ? 0
    : (confCount >= 6 && stableScore >= 75 && confidence >= 70) ? 4
    : (confCount >= 5 && stableScore >= 65) ? 3
    : (confCount >= 3 && stableScore >= 55) ? 2
    : confCount >= 2 ? 1 : 0;

  return {
    last: +C[i].toFixed(2), score: v4Score, direction, confidence, stable: stableScore,
    early: earlyScore, confirmed: v4Confirmed, atrPct: isFinite(atrPct) ? +atrPct.toFixed(2) : null,
    rvol: isFinite(rvol) ? +rvol.toFixed(2) : null, darvas: darvasScan, darvasBias,
    sqzHit, sqzState, smartFlow, regime, regimeName,
    timing: v4Timing, extension: isFinite(extensionATR) ? +extensionATR.toFixed(2) : null,
    liquidityScore,
    liquidity: Math.round(dollarVol), adx: +adx.toFixed(1), rsi: +rsi.toFixed(1),
    bars: n,
  };
}

// ── V4 display helpers ───────────────────────────────────────────────────────
const v4Color = (val, band) => {
  for (const [threshold, color] of band) if (val >= threshold) return color;
  return "#3e5268";
};
const V4_SCORE_BAND = [[85,"#00ff88"],[75,"#22ddaa"],[65,"#00ddff"],[55,"#ffe033"],[40,"#ff9955"],[0,"#7591a8"]];
const v4DirLabel = d => d === 2 ? "+2" : d === 1 ? "+1" : d === -1 ? "−1" : d === -2 ? "−2" : "0";
const v4DirColor = d => d > 0 ? (d === 2 ? "#00ff88" : "#44cc88") : d < 0 ? (d === -2 ? "#ff3355" : "#cc5566") : "#7591a8";
const V4_REGIME_COLOR = { CHOP:"#7591a8", TREND:"#00ff88", BREAKOUT:"#00ddff", SQUEEZE:"#cc88ff", REVERSAL:"#ff9955", "HIGH VOL":"#ff3355", "LOW VOL":"#556677" };

// ── CATALYST & NEWS INTELLIGENCE ENGINE ──────────────────────────────────────
// Separate architecture from the technical scanner, on purpose. ThinkorSwim /
// FINAL_V4 is the technical signal engine; this is the intelligence engine.
// Nothing in here ever mutates SCORE, Direction, Confidence or StableScore —
// news is carried as its own dimensions and FUSED at display time, never
// subtracted. `fuseState()` takes the technical read as a read-only input.
//
// WHAT RUNS HERE vs WHAT NEEDS A BACKEND — read this before trusting a number.
// This dashboard is a static page. It can normalise, dedupe, score, decay,
// propagate, fuse and persist to localStorage. It CANNOT ingest continuously
// while closed, share an event database between devices, poll dozens of wires,
// or push notifications. Those need a server. Every stat shown here is computed
// from samples this browser actually observed, and the sample size is always
// displayed. See docs/CATALYST_ARCHITECTURE.md and docs/V5_PRODUCT_SPEC.md.

// ── SOURCE TIERS ─────────────────────────────────────────────────────────────
const SOURCE_TIERS = {
  1: { label:"PRIMARY",   weight:1.00, color:"#00ff88", note:"Authoritative issuer: SEC, Fed, BLS, BEA, Treasury, FDA, exchange notice, company IR." },
  2: { label:"WIRE",      weight:0.88, color:"#00ddff", note:"Professional financial newswire." },
  3: { label:"SECONDARY", weight:0.68, color:"#ffe033", note:"Established secondary reporting." },
  4: { label:"SOCIAL",    weight:0.42, color:"#ff9955", note:"Social / community / aggregator." },
  5: { label:"UNVERIFIED",weight:0.22, color:"#ff3355", note:"Unverified rumour. Never displayed as fact." },
};

const TIER1_PATTERNS = [/\bsec\.gov\b/i, /federalreserve\.gov/i, /\bbls\.gov\b/i, /\bbea\.gov\b/i,
  /treasury\.gov/i, /\bfda\.gov\b/i, /investor relations/i, /\b8-?k\b/i, /\b10-?[qk]\b/i,
  /press release/i, /\bnyse\b|\bnasdaq\b.*notice/i, /whitehouse\.gov/i, /\bcftc\.gov\b/i];
const TIER2_PATTERNS = [/reuters/i, /bloomberg/i, /dow jones/i, /\bap\b|associated press/i,
  /marketwatch/i, /barron/i, /wall street journal|wsj/i, /financial times|\bft\b/i, /cnbc/i, /benzinga/i];
const TIER3_PATTERNS = [/yahoo/i, /investing\.com/i, /seeking ?alpha/i, /the street/i, /forbes/i, /business insider/i];
const TIER4_PATTERNS = [/reddit/i, /twitter|\bx\.com\b/i, /stocktwits/i, /discord/i, /telegram/i, /\bblog\b/i];
const RUMOUR_PATTERNS = [/\brumou?r\b/i, /sources say/i, /people familiar/i, /reportedly/i,
  /is said to/i, /may be (?:in talks|considering)/i, /unconfirmed/i, /speculat/i, /\bcould\b.*\btalks\b/i];

function classifySource(sourceName, headline) {
  const s = String(sourceName || ""), h = String(headline || "");
  if (RUMOUR_PATTERNS.some(r => r.test(h))) return 5;
  if (TIER1_PATTERNS.some(r => r.test(s) || r.test(h))) return 1;
  if (TIER2_PATTERNS.some(r => r.test(s))) return 2;
  if (TIER4_PATTERNS.some(r => r.test(s))) return 4;
  if (TIER3_PATTERNS.some(r => r.test(s))) return 3;
  return 3;   // unknown named source → secondary, never primary
}

// CONFIRMED / REPORTED / DEVELOPING / RUMOR / UNVERIFIED
function confirmationStatus(tier, sourceCount, hasPrimaryDoc) {
  if (hasPrimaryDoc || tier === 1) return "CONFIRMED";
  if (tier === 5) return sourceCount >= 3 ? "DEVELOPING" : "RUMOR";
  if (tier === 2 && sourceCount >= 2) return "CONFIRMED";
  if (tier <= 3 && sourceCount >= 2) return "REPORTED";
  if (tier === 4) return "UNVERIFIED";
  return "REPORTED";
}

function classifyCategory(headline) {
  const h = String(headline || "");
  for (const [re, cat] of CATEGORY_RULES) if (re.test(h)) return cat;
  return "OTHER";
}

// ── DIRECTION LEXICON ────────────────────────────────────────────────────────
// Heuristic sentiment, deliberately narrow. Each entry is [pattern, points].
// This is a keyword classifier, not language understanding — it is why
// NEWS_CONFIDENCE exists and why an ambiguous headline resolves to 0.
const BULLISH_TERMS = [
  [/\bbeat[s]?\b|\btops\b|above (?:consensus|estimates)|better than expected/i, 55],
  [/\bupgrade[sd]?\b|raise[sd]? (?:price target|guidance|outlook)|overweight|\bbuy\b rating/i, 45],
  [/approval|approved|breakthrough therapy|positive (?:results|data)|met primary endpoint/i, 65],
  [/\bacquire[sd]?\b|takeover|buyout|merger|stake in/i, 50],
  [/buyback|repurchase|dividend (?:increase|hike)|special dividend/i, 35],
  [/record (?:revenue|profit|quarter)|surge[sd]?|soar[sd]?|jump[sd]?/i, 40],
  [/ceasefire|de-?escalat|trade deal|tariff (?:relief|exemption|removed)/i, 45],
  [/rate cut|dovish|easing|accommodative/i, 40],
  [/settle[ds]? (?:lawsuit|litigation)|dismissed/i, 30],
];
const BEARISH_TERMS = [
  [/\bmiss(?:es|ed)?\b|below (?:consensus|estimates)|worse than expected|shortfall/i, -55],
  [/\bdowngrade[sd]?\b|cut[s]? (?:price target|guidance|outlook)|underweight|\bsell\b rating/i, -45],
  [/\bcrl\b|complete response letter|failed|did not meet|negative (?:results|data)|halted trial/i, -70],
  [/investigation|probe|charge[sd]?|subpoena|fraud|antitrust suit/i, -50],
  [/recall|breach|hack(?:ed)?|ransomware|outage|shutdown of/i, -45],
  [/bankrupt|chapter 11|default|going concern|delist/i, -80],
  [/layoff|job cut|restructur|impairment|writedown/i, -35],
  [/tariff|sanction|export control|trade restriction/i, -40],
  [/rate hike|hawkish|tightening/i, -40],
  [/plunge[sd]?|slump[sd]?|tumble[sd]?|crash|sink[s]?/i, -40],
  [/offering|dilut|secondary offering/i, -30],
  [/\bwar\b|missile|invasion|escalation|strike[sd]? on/i, -45],
];

// For macro releases the sign flips: a HOT inflation print is bearish for
// equities even though the words read "higher than expected".
const INVERTED_MACRO = /\bcpi\b|\bppi\b|\bpce\b|inflation|unemployment rate|jobless claims/i;

function scoreDirection({ headline, category, surprise }) {
  const h = String(headline || "");
  // Explicit surprise data beats keywords when we have it.
  if (surprise && Number.isFinite(surprise.actual) && Number.isFinite(surprise.consensus)) {
    const denom = Math.abs(surprise.consensus) > 1e-9 ? Math.abs(surprise.consensus) : 1;
    const rel = (surprise.actual - surprise.consensus) / denom;
    const mag = Math.max(-1, Math.min(1, rel * 4));      // ±25% surprise saturates
    const inverted = INVERTED_MACRO.test(h) || surprise.invert === true;
    return Math.round((inverted ? -mag : mag) * 100);
  }
  let score = 0, hits = 0;
  for (const [re, pts] of BULLISH_TERMS) if (re.test(h)) { score += pts; hits++; }
  for (const [re, pts] of BEARISH_TERMS) if (re.test(h)) { score += pts; hits++; }
  if (!hits) return 0;                                    // ambiguous stays 0
  if (hits > 1) score = score / Math.sqrt(hits);           // conflicting terms damp
  // A scheduled event that has not happened yet has impact but no direction.
  if (/ahead of|awaits|preview|expected (?:to|at)|due (?:today|tomorrow)/i.test(h)) return 0;
  return Math.max(-100, Math.min(100, Math.round(score)));
}

// ── ENTITY / TICKER MAPPING ──────────────────────────────────────────────────
// Seed map. A backend would resolve entities properly; this covers the names
// that actually move an index and is explicitly incomplete.
const INDEX_TIER = {
  MEGA:  { weight:1.00, names:["AAPL","MSFT","NVDA","AMZN","GOOGL","GOOG","META","AVGO","TSLA"] },
  LARGE: { weight:0.62, names:["JPM","V","MA","UNH","XOM","LLY","WMT","JNJ","PG","HD","COST","ORCL","AMD","NFLX","CRM","BAC","KO","PEP","CVX","MRK","ABBV","ADBE","QCOM","TXN","INTC","MU","SMCI","PLTR"] },
