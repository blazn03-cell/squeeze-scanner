function getBestStrat(sqType, ivHigh) {
  if (!sqType) return null;
  const match = Object.entries(STRATS).find(([, s]) =>
    s.best.includes(sqType) && (s.ivNeed === "any" || (s.ivNeed === "high" && ivHigh) || (s.ivNeed === "low" && !ivHigh))
  );

}

// ─── WIN PROBABILITY ───────────────────────────────────────────────────────────
function calcWinProb(p) {
  if (p.cat === "macro") return null;
  let pts = 0;
  const sh  = p.short || {};
  const si  = parseFloat(sh.si_pct || 0);
  const dtc = parseFloat(sh.days_to_cover || 0);
  const soi = p.oi > 0 ? p.size / p.oi : 0;
  const sc  = parseInt(p.staircase_days || 0);
  const pc  = parseFloat(p.options_vol?.put_call_ratio || 0);
  pts += p.sweepOk && p.dpOk ? 28 : p.sweepOk || p.dpOk ? 12 : 4;
  pts += sc >= 7 ? 20 : sc >= 5 ? 15 : sc >= 3 ? 9 : sc >= 2 ? 4 : 0;
  pts += (p.sweep_count || 1) >= 3 ? 10 : (p.sweep_count || 1) >= 2 ? 5 : 0;
  pts += soi >= 5 ? 12 : soi >= 3 ? 8 : soi >= 2 ? 4 : 0;
  if (p.cat === "squeeze") {
    pts += si >= 30 ? 10 : si >= 20 ? 7 : si >= 10 ? 3 : 0;
    pts += dtc >= 5 ? 6 : dtc >= 3 ? 3 : 0;
    pts += parseFloat(sh.borrow_rate || 0) >= 30 ? 2 : 0;
    pts += sh.ftds_elevated ? 2 : 0;
  }
  if (p.gex?.bias === "short_gamma" && p.cat === "squeeze") pts += 8;
  if (p.gex?.bias === "long_gamma"  && p.cat === "flush")   pts += 8;
  if (p.cat === "squeeze" && p.net_prem?.trending === "up")   pts += 8;
  if (p.cat === "flush"   && p.net_prem?.trending === "down") pts += 8;
  if (p.cat === "squeeze" && p.net_prem?.trending === "down") pts -= 5;
  if (p.cat === "squeeze" && pc > 0 && pc < 0.5) pts += 6;
  if (p.cat === "flush"   && pc > 1.2)           pts += 6;
  pts += parseFloat(p.ask_pct || 0) >= 0.9 ? 4 : parseFloat(p.ask_pct || 0) >= 0.7 ? 2 : 0;
  if (p.is_otm) pts += 2;
  if (p.earnings?.within_14_days) pts = Math.round(pts * 0.7);
  const td = parseInt(p.trade_day || 1);
  if (td === 2) pts = Math.round(pts * 0.85);
  if (td === 3) pts = Math.round(pts * 0.65);
  if (td >= 7)  pts = Math.round(pts * 0.45);
  return Math.max(5, Math.min(95, pts));
}

function getHoldStatus(td, sqType) {
  const max = (PROF[sqType] || PROF.short_squeeze).holdDays;
  const pct = td / max;
  if (td <= 1)    return { label:"ENTER",     color:"#3fb950" };
  if (pct <= 0.4) return { label:"HOLD",       color:"#d29922" };
  if (pct <= 0.7) return { label:"MONITOR",    color:"#d29922" };
  if (pct <= 0.9) return { label:"TRIM 25–50%",color:"#f85149" };
  return               { label:"EXIT NOW",   color:"#f85149" };
}

// ─── TECHNICAL READ ─────────────────────────────────────────────────────────────
function getTechnicalRead(p, macroBias) {
  const mb = macroBias === "BULLISH" || macroBias === "BEARISH" ? macroBias : "NEUTRAL";
  const ich = p.ichimoku || null;
  const techBias = ich?.bias || "PENDING";
  const techStrength = ich?.strength || null;
  const ivNear = parseFloat(p.iv?.near) || 0;
  const ivFar  = parseFloat(p.iv?.far)  || 0;
  const ivHigh = !!p.iv?.elevated || (ivNear > 0 && ivFar > 0 && ivNear > ivFar * 1.1);
  const suggestedStrategy = (() => {
    if (techBias === "BULLISH") return ivHigh ? "Call Debit Spread" : "Naked Call OTM";
    if (techBias === "BEARISH") return ivHigh ? "Put Debit Spread"  : "Naked Put OTM";
    if (techBias === "NEUTRAL") return "Iron Condor or Skip";
    return "Wait for signal";
  })();
  let verdict, verdictConf, verdictReason, verdictColor;
  if (techBias === "PENDING") {
    verdict = "PENDING"; verdictConf = 0; verdictColor = "#7d8590";
    verdictReason = "No 5m data yet. Wait for next scan.";
  } else if (techBias === "NEUTRAL" || mb === "NEUTRAL") {
    verdict = "CASH"; verdictConf = 50; verdictColor = "#58a6ff";
    verdictReason = techBias === "NEUTRAL" ? "Price inside cloud — no trend edge." : "Macro neutral. Wait for direction.";
  } else if (techBias === mb) {
    verdict = techBias === "BULLISH" ? "CALLS" : "PUTS";
    const sb = techStrength === "STRONG" ? 15 : techStrength === "MODERATE" ? 8 : 0;
    verdictConf = Math.min(95, 50 + sb + Math.round((p.winProb || 50) * 0.3));
    verdictColor = techBias === "BULLISH" ? "#3fb950" : "#f85149";
    verdictReason = `${techBias} Ichimoku (${techStrength || "–"}) + ${mb} macro aligned.`;
  } else {
    verdict = "CONFLICT"; verdictConf = 50; verdictColor = "#d29922";
    verdictReason = `${techBias} Ichimoku vs ${mb} macro — skip or size down hard.`;
  }
  return { techBias, techStrength, macroBias: mb, ivHigh, suggestedStrategy, verdict, verdictConf, verdictReason, verdictColor, ichimoku: ich };
}

// ─── ICHIMOKU ──────────────────────────────────────────────────────────────────
const MACRO_TICKERS = new Set(["SPY","QQQ","IWM","DIA","TLT","GLD","XLF","XLE","SQQQ","TQQQ","UVXY","VIX"]);

function computeIchimoku(barsRaw) {
  if (!Array.isArray(barsRaw) || barsRaw.length < 55) return null;
  const bars = barsRaw.map(b => ({
    h: +(b.high ?? b.h ?? 0), l: +(b.low ?? b.l ?? 0),
    c: +(b.close ?? b.c ?? 0), t: b.start_time || b.timestamp || b.t || null,
  })).filter(b => b.h > 0 && b.l > 0 && b.c > 0);
  if (bars.length < 55) return null;
  const sorted = [...bars].sort((a, b) => {
    if (!a.t || !b.t) return 0;
    return new Date(a.t).getTime() - new Date(b.t).getTime();
  });
  const n = sorted.length;
  const hl = (period, endIdx) => {
    const start = Math.max(0, endIdx - period + 1);
    let hi = -Infinity, lo = Infinity;
    for (let i = start; i <= endIdx; i++) { if (sorted[i].h > hi) hi = sorted[i].h; if (sorted[i].l < lo) lo = sorted[i].l; }
    return (hi + lo) / 2;
  };
  const last = n - 1;
  const tenkan = hl(9, last), kijun = hl(26, last);
  const spanA = (tenkan + kijun) / 2, spanB = hl(52, last);
  const close = sorted[last].c;
  const tkCross = n >= 2
    ? (hl(9, last-1) <= hl(26, last-1) && tenkan > kijun ? "bullish" : hl(9, last-1) >= hl(26, last-1) && tenkan < kijun ? "bearish" : null)
    : null;
  const cloudTop = Math.max(spanA, spanB), cloudBot = Math.min(spanA, spanB);
  const cloudColor = spanA > spanB ? "green" : spanA < spanB ? "red" : "flat";
  const priceZone = close > cloudTop ? "above" : close < cloudBot ? "below" : "inside";
  let bias, strength, summary;
  if      (priceZone === "above" && cloudColor === "green" && tenkan > kijun) { bias = "BULLISH"; strength = "STRONG";   summary = "Price above green cloud + Tenkan>Kijun. Full uptrend."; }
  else if (priceZone === "above" && cloudColor === "green")                   { bias = "BULLISH"; strength = "MODERATE"; summary = "Price above green cloud, TK flat — trend intact."; }
  else if (priceZone === "above" && cloudColor === "red")                     { bias = "BULLISH"; strength = "WEAK";     summary = "Recovery — price above cloud but cloud still red."; }
  else if (priceZone === "below" && cloudColor === "red" && tenkan < kijun)  { bias = "BEARISH"; strength = "STRONG";   summary = "Price below red cloud + Tenkan<Kijun. Full downtrend."; }
  else if (priceZone === "below" && cloudColor === "red")                     { bias = "BEARISH"; strength = "MODERATE"; summary = "Price below red cloud — downtrend intact."; }
  else if (priceZone === "below" && cloudColor === "green")                   { bias = "BEARISH"; strength = "WEAK";     summary = "Pullback — price below cloud but cloud still green."; }
  else                                                                         { bias = "NEUTRAL"; strength = "TRANSITION"; summary = "Price inside cloud — no trend. Wait for breakout."; }
  return { tenkan: +tenkan.toFixed(2), kijun: +kijun.toFixed(2), spanA: +spanA.toFixed(2), spanB: +spanB.toFixed(2), cloudTop: +cloudTop.toFixed(2), cloudBot: +cloudBot.toFixed(2), close: +close.toFixed(2), cloudColor, priceZone, tkCross, bias, strength, summary, bars: n };
}

// ─── UW DIRECT FETCH ───────────────────────────────────────────────────────────
async function fetchUWDirect(uwKey, signal) {
  const H = { Authorization: `Bearer ${uwKey}` };
  const get = (path) => fetch(`https://api.unusualwhales.com/api${path}`, { headers: H, signal })
    .then(r => r.ok ? r.json() : { data: [] }).catch(() => ({ data: [] }));
  const [flow, dp, tide] = await Promise.all([
    get(`/option-trades/flow-alerts?limit=30&size_greater_oi=true&is_otm=true&min_ask_perc=0.7`),
    get(`/darkpool/recent?limit=25`),
    get(`/market/market-tide`),
  ]);
  const premBy = {};
  (flow.data||[]).forEach(r => { const t = r.ticker; if (!t || MACRO_TICKERS.has(t)) return; premBy[t] = (premBy[t]||0) + (+r.total_premium||0); });
  (dp.data||[]).forEach(r   => { const t = r.ticker; if (!t || MACRO_TICKERS.has(t)) return; premBy[t] = (premBy[t]||0) + (+r.premium||0); });
  const sorted = Object.entries(premBy).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
  const topTickers = sorted.slice(0,6), ohlcTickers = sorted.slice(0,12);
  const dpGexRes = await Promise.all(topTickers.flatMap(t=>[get(`/darkpool/${t}?limit=30`),get(`/stock/${t}/greek-exposure`)]));
  const ohlcRes  = await Promise.all(ohlcTickers.map(t=>get(`/stock/${t}/ohlc/5m?limit=400`)));
  const per_ticker = {};
  topTickers.forEach((t,i)=>{ per_ticker[t] = { dp_history: (dpGexRes[i*2]?.data||[]).slice(0,30), gex_snapshot: dpGexRes[i*2+1]?.data?.[0]||null }; });
  const ichimokuByTicker = {};
  ohlcTickers.forEach((t,i)=>{ const ich=computeIchimoku(ohlcRes[i]?.data||[]); if(ich) ichimokuByTicker[t]=ich; });
  return { flow_alerts: flow.data||[], dark_pool_recent: dp.data||[], market_tide: tide.data||[], per_ticker, ichimokuByTicker };
}

// ─── 30-DAY HISTORY ────────────────────────────────────────────────────────────
const HIST_KEY = "ie_hist_v1";
function loadHist() { try { return JSON.parse(localStorage.getItem(HIST_KEY)||"{}}"); } catch { return {}; } }
function saveHist(h) { try { localStorage.setItem(HIST_KEY,JSON.stringify(h)); } catch(_){} }
function pruneHist(h) {
  const now = Date.now(), out = {};
  Object.entries(h).forEach(([k,v])=>{ const age=(now-new Date(v.last_seen||"2000").getTime())/86400000; if(age<=30) out[k]=v; });
  return out;
}
function recordHist(prints, prev) {
  const h = {...prev}, td = new Date().toISOString().slice(0,10);
  (prints||[]).forEach(p=>{
    if (!p.ticker||!p.sqType||!ALL[p.sqType]) return;
    const key=`${p.ticker}|${p.sqType}`;
    const e = h[key] || { ticker:p.ticker, sqType:p.sqType, cat:p.cat, first_seen:td, last_seen:td, days_seen:[], total_premium:0, sighting_count:0, max_win_prob:0, sweepOk:false, dpOk:false };
    if (!e.days_seen.includes(td)) e.days_seen.push(td);
    e.last_seen = td; e.total_premium += parseInt(p.premium)||0; e.sighting_count += 1;
    e.max_win_prob = Math.max(e.max_win_prob||0, p.winProb||0);
    e.sweepOk = e.sweepOk || !!p.sweepOk; e.dpOk = e.dpOk || !!p.dpOk;
    if (p.strike) e.latest_strike = p.strike; if (p.expiry) e.latest_expiry = p.expiry;
    h[key] = e;
  });
  return pruneHist(h);
}

  section: { fontSize:10, fontWeight:700, color:C.textDim, letterSpacing:"0.14em", textTransform:"uppercase" },
};

function Badge({ color, children }) {
  return <span style={s.pill(color)}>{children}</span>;
}

function WinBar({ prob }) {
  if (prob === null) return null;
  const c = prob >= 70 ? C.green : prob >= 50 ? C.yellow : prob >= 35 ? "#f0883e" : C.red;
  return (
    <div style={{ display:"flex", alignItems:"center", gap:8 }}>
      <div style={{ flex:1, height:4, background:C.border, borderRadius:2, overflow:"hidden" }}>
        <div style={{ height:"100%", width:`${prob}%`, background:c, borderRadius:2, transition:"width .5s" }}/>
      </div>
      <span style={{ fontSize:12, fontWeight:700, color:c, minWidth:36, textAlign:"right" }}>{prob}%</span>
    </div>
  );
}

function Divider() {
  return <div style={{ height:1, background:C.border, margin:"0" }}/>;
}

// ─── SIGNAL CARD ───────────────────────────────────────────────────────────────
function SignalCard({ p, open, onToggle, macroBias }) {
  const def   = ALL[p.sqType] || ALL[p.sig] || { label:"Signal", color:C.blue, icon:"·" };
  const prof  = PROF[p.sqType] || PROF.short_squeeze;
  const td    = Math.max(1, Math.min(21, parseInt(p.trade_day || 1)));
  const hs    = getHoldStatus(td, p.sqType);
  const sc    = parseInt(p.staircase_days || 0);
  const tech  = getTechnicalRead(p, macroBias);
  const strat = getBestStrat(p.sqType, tech.ivHigh);
  const sh    = p.short || {};

  return (
    <div style={{ ...s.card, marginBottom:8, border:`1px solid ${open ? def.color+"55" : C.border}`, transition:"border-color .15s" }}>
      <div onClick={onToggle} style={{ display:"flex", alignItems:"center", gap:12, padding:"14px 16px", cursor:"pointer" }}>
        <span style={{ fontSize:20, flexShrink:0 }}>{def.icon}</span>
        <div style={{ flex:1, minWidth:0 }}>
          <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:6, flexWrap:"wrap" }}>
            <span style={{ fontSize:18, fontWeight:700, color:C.text }}>{p.ticker}</span>
            <Badge color={def.color}>{def.label}</Badge>
            <span style={{ fontSize:11, fontWeight:700, padding:"2px 8px", borderRadius:4, background:tech.verdictColor+"28", border:`1.5px solid ${tech.verdictColor}88`, color:tech.verdictColor }}>
              {tech.verdict}{tech.verdictConf > 0 ? ` ${tech.verdictConf}%` : ""}
            </span>
            {sc >= 3 && <Badge color={C.blue}>📊 {sc}d staircase</Badge>}
            {p.sweepOk && p.dpOk && <Badge color={C.yellow}>⚡ Confirmed</Badge>}
            {p.earnings?.within_14_days && <Badge color={C.red}>📅 Earnings</Badge>}
          </div>
          <div style={{ display:"flex", gap:16, flexWrap:"wrap" }}>
            <span style={{ fontSize:13, color:C.textMuted, fontFamily:"monospace" }}>{p.strike} · {p.expiry}</span>
            <span style={{ fontSize:13, fontWeight:600, color:C.text }}>{fmt(p.premium)}</span>
            <span style={{ fontSize:12, color:C.textMuted }}>{p.time}</span>
          </div>
        </div>
        <div style={{ textAlign:"right", flexShrink:0 }}>
          <div style={{ fontSize:12, fontWeight:700, color:hs.color, marginBottom:3 }}>{hs.label}</div>
          <div style={{ fontSize:11, color:C.textMuted }}>Day {td}/{prof.holdDays}</div>
          {p.winProb !== null && <div style={{ marginTop:6, width:80 }}><WinBar prob={p.winProb}/></div>}
        </div>
        <div style={{ fontSize:16, color:C.textDim, marginLeft:4 }}>{open ? "▲" : "▼"}</div>
      </div>

      {open && (
        <div className="fade-in">
          <Divider/>
          <div style={{ padding:"16px 20px", background:tech.verdictColor+"0d", borderBottom:`1px solid ${tech.verdictColor}33`, display:"flex", justifyContent:"space-between", alignItems:"center", gap:16, flexWrap:"wrap" }}>
            <div>
              <div style={{ fontSize:11, color:tech.verdictColor, fontWeight:700, letterSpacing:"0.12em", marginBottom:4 }}>VERDICT</div>
              <div style={{ fontSize:28, fontWeight:800, color:tech.verdictColor, letterSpacing:"0.01em" }}>{tech.verdict}</div>
              <div style={{ fontSize:13, color:C.textMuted, marginTop:4, maxWidth:480, lineHeight:1.6 }}>{tech.verdictReason}</div>
            </div>
            <div style={{ textAlign:"center", padding:"12px 20px", background:C.surface, border:`1px solid ${tech.verdictColor}44`, borderRadius:8 }}>
              <div style={{ fontSize:11, color:C.textMuted, marginBottom:2 }}>CONFIDENCE</div>
              <div style={{ fontSize:28, fontWeight:800, color:tech.verdictColor }}>{tech.verdictConf}%</div>
              <div style={{ fontSize:11, color:C.textMuted }}>{tech.verdictConf >= 75 ? "HIGH" : tech.verdictConf >= 55 ? "MODERATE" : "LOW"}</div>
            </div>
          </div>

          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:0, borderBottom:`1px solid ${C.border}` }}>
            {[
              { label:"ICHIMOKU (5m)", value: tech.ichimoku ? `${tech.ichimoku.bias} · ${tech.ichimoku.strength}` : "PENDING", color: tech.ichimoku?.bias === "BULLISH" ? C.green : tech.ichimoku?.bias === "BEARISH" ? C.red : C.textMuted, sub: tech.ichimoku?.summary || "No 5m data yet" },
              { label:"MACRO BIAS",    value: tech.macroBias, color: tech.macroBias === "BULLISH" ? C.green : tech.macroBias === "BEARISH" ? C.red : C.textMuted, sub: "from market tide" },
              { label:"IV",            value: tech.ivHigh ? "ELEVATED" : tech.ichimoku ? "NORMAL" : "—", color: tech.ivHigh ? C.yellow : C.green, sub: tech.ivHigh ? "Use spread to cut IV risk" : "Naked call/put ok" },
            ].map((item, i) => (
              <div key={i} style={{ padding:"14px 20px", borderRight: i < 2 ? `1px solid ${C.border}` : "none" }}>
                <div style={s.section}>{item.label}</div>
                <div style={{ fontSize:15, fontWeight:700, color:item.color, marginTop:6 }}>{item.value}</div>
                <div style={{ fontSize:11, color:C.textMuted, marginTop:2 }}>{item.sub}</div>
              </div>
            ))}
          </div>

          <div style={{ padding:"16px 20px", borderBottom:`1px solid ${C.border}` }}>
            <div style={{ ...s.section, marginBottom:10 }}>WHY THIS SETUP</div>
            <div style={{ fontSize:13, color:"#c9d1d9", lineHeight:1.75 }}>
              {p.sqType === "staircase"     && `Institutions quietly accumulating ${p.ticker} through dark pools for ${sc} consecutive days at ${p.staircase_zone || "the same zone"}. Classic pre-squeeze — when call sweeps appear, the squeeze fires.`}
              {p.sqType === "short_squeeze" && `Shorts are trapped. High short interest + institutional accumulation = forced covering. ${sc >= 3 ? `Staircase visible (${sc}d) adds fuel.` : "Watch for staircase confirmation."}`}
              {p.sqType === "gamma_squeeze" && "Dealers SHORT gamma — as price rises they must buy stock to hedge, accelerating the move. Violent and fast, days not weeks."}
              {p.sqType === "delta_squeeze" && "Massive call buying forcing dealers to buy stock for delta hedging. Sustained heavy call volume mechanically drives price up."}
              {p.sqType === "liquidity_sq"  && "Tiny float = very few shares. Small buying creates massive moves. Staircase on low float is extremely powerful."}
              {p.sqType === "ftd_squeeze"   && "FTDs elevated — shorts sold shares never borrowed. T+35 buy-in rule forces mandatory covering. Rips without warning."}
              {p.sqType === "vol_squeeze"   && "IV compressed like a coiled spring. When volatility snaps back, premium and underlying move violently."}
              {p.sqType === "cap_flush"     && "Smart money exiting aggressively. Put sweeps + dark pool sells = institutions getting out fast. Sharp, sustained drop incoming."}
              {p.sqType === "gamma_flush"   && "Dealers LONG gamma — they sell into every bounce, amplifying drops. Mirror of gamma squeeze. Bearish and mechanical."}
              {p.sqType === "stop_hunt"     && "Price pushed below support to trigger stops. After stops clear, the real move begins. Day trade only — resolves intraday."}
              {p.sqType === "margin_flush"  && "Leveraged longs being margin called. Forced selling at any price. Large dark pool sells + no news = classic margin flush."}
              {p.sqType === "vix_flush"     && "VIX spiking hard. Buy UVXY calls (not SPY puts — IV too expensive) to ride the volatility spike directly."}
              {p.sqType === "liq_flush"     && "Thin bids + market sell orders cascading. Watch for dark pool buy prints as the reversal signal."}
              {p.cat   === "macro"          && "Use as overall market bias. Bullish = size up on squeezes. Bearish = size down everything, don't fight the tape."}
            </div>
          </div>

          {p.levels && (
            <div style={{ padding:"16px 20px", borderBottom:`1px solid ${C.border}` }}>
              <div style={{ ...s.section, marginBottom:12 }}>KEY LEVELS</div>
              <div style={{ display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:10 }}>
                {[["Support", C.green, p.levels.support], ["Entry Zone", C.blue, p.levels.entry_zone], ["Resistance", C.yellow, p.levels.resistance], ["Target", C.purple, p.levels.target]].map(([l,c,v]) => (
                  <div key={l} style={{ padding:"10px", background:C.surfaceHigh, border:`1px solid ${c}33`, borderRadius:6, textAlign:"center" }}>
                    <div style={{ fontSize:11, color:c, fontWeight:600, marginBottom:4 }}>{l}</div>
                    <div style={{ fontSize:16, fontWeight:700, color:c }}>{v || "—"}</div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {strat && (
            <div style={{ padding:"16px 20px", borderBottom:`1px solid ${C.border}` }}>
              <div style={{ ...s.section, marginBottom:12 }}>RECOMMENDED PLAY</div>
              <div style={{ background:C.surfaceHigh, border:`1px solid ${strat.color}44`, borderRadius:8, overflow:"hidden" }}>
                <div style={{ padding:"12px 16px", borderBottom:`1px solid ${strat.color}33`, display:"flex", alignItems:"center", gap:10 }}>
                  <span style={{ fontSize:20 }}>{strat.emoji}</span>
                  <div>
                    <div style={{ fontSize:15, fontWeight:700, color:strat.color }}>{strat.name}</div>
                    <div style={{ fontSize:11, color:C.textMuted }}>Risk: {strat.risk} · DTE: {prof.dte} · Hold: {prof.hold}</div>
                  </div>
                </div>
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:0 }}>
                  {[["→ ENTER", C.blue, strat.how], ["← EXIT", C.green, strat.exit], ["⛔ STOP", C.red, strat.stop]].map(([l,c,v], i) => (
                    <div key={l} style={{ padding:"12px 16px", borderRight: i < 2 ? `1px solid ${C.border}` : "none" }}>
                      <div style={{ fontSize:11, fontWeight:700, color:c, marginBottom:6 }}>{l}</div>
                      <div style={{ fontSize:12, color:C.textMuted, lineHeight:1.65 }}>{v}</div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          <div style={{ padding:"16px 20px" }}>
            <div style={{ ...s.section, marginBottom:12 }}>FLOW DATA</div>
            <div style={{ display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:10 }}>
              {[
                ["Premium",     fmt(p.premium),                                               parseInt(p.premium||0) >= 500000 ? C.green : C.textMuted],
                ["Size vs OI",  p.oi > 0 ? `${(p.size/p.oi).toFixed(1)}x` : "—",           p.oi > 0 && p.size/p.oi >= 2 ? C.green : C.textMuted],
                ["Ask Side",    p.ask_pct ? `${(p.ask_pct*100).toFixed(0)}%` : "—",         parseFloat(p.ask_pct||0) >= 0.8 ? C.green : C.textMuted],
                ["Sweeps",      `${p.sweep_count || 1}x`,                                    (p.sweep_count||1) >= 3 ? C.purple : C.textMuted],
                ["Short Int",   fmtP(sh.si_pct),                                             parseFloat(sh.si_pct||0) >= 20 ? C.red : parseFloat(sh.si_pct||0) >= 10 ? C.yellow : C.textMuted],
                ["Days to Cov", sh.days_to_cover ? `${parseFloat(sh.days_to_cover).toFixed(1)}d` : "—", parseFloat(sh.days_to_cover||0) >= 5 ? C.red : C.textMuted],
                ["Staircase",   sc > 0 ? `${sc}d` : "—",                                   sc >= 5 ? C.green : sc >= 3 ? C.yellow : C.textMuted],
                ["Win Prob",    p.winProb !== null ? `${p.winProb}%` : "—",                 p.winProb >= 70 ? C.green : p.winProb >= 50 ? C.yellow : C.textMuted],
              ].map(([l,v,c]) => (
                <div key={l} style={{ padding:"10px 12px", background:C.surfaceHigh, borderRadius:6, border:`1px solid ${C.border}` }}>
                  <div style={{ fontSize:11, color:C.textMuted, marginBottom:4 }}>{l}</div>
                  <div style={{ fontSize:14, fontWeight:700, color:c }}>{v}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ─── SCANNER TAB ───────────────────────────────────────────────────────────────
function ScannerTab({ feed, loading, error, soundOn, setSoundOn, onRefresh, paused, setPaused, pollSec, setPollSec, ready, history }) {
  const [openId,   setOpenId]   = useState(null);
  const [ticker,   setTicker]   = useState("");
  const [minPrem,  setMinPrem]  = useState(0);
  const [minProb,  setMinProb]  = useState(60);
  const [confOnly, setConfOnly] = useState(false);

  const doFilter = (items) => items
    .filter(p =>
      (p.winProb === null || p.winProb >= minProb) &&
      (!confOnly || (p.sweepOk && p.dpOk)) &&
      (!ticker.trim() || p.ticker.includes(ticker.trim().toUpperCase())) &&
      parseInt(p.premium || 0) >= minPrem
    )
    .sort((a,b) => ((ALL[a.sig]?.tier||9) - (ALL[b.sig]?.tier||9)) || ((b.winProb||0) - (a.winProb||0)));

  const squeezes = doFilter(feed.filter(p => p.cat === "squeeze"));
  const flushes  = doFilter(feed.filter(p => p.cat === "flush"));
  const macros   = doFilter(feed.filter(p => p.cat === "macro"));
  const mBull = macros.filter(p => p.sig === "macro_bull").length;
  const mBear = macros.filter(p => p.sig === "macro_bear").length;
  const bias  = mBull > mBear ? "BULLISH" : mBear > mBull ? "BEARISH" : "NEUTRAL";
  const biasC = bias === "BULLISH" ? C.green : bias === "BEARISH" ? C.red : C.textMuted;
  const toggle = id => setOpenId(p => p === id ? null : id);
  const hcCount = feed.filter(p => p.sweepOk && p.dpOk && (p.winProb||0) >= 65).length;
  const trackedCount = Object.keys(history || {}).length;

  return (
    <div style={{ display:"flex", flexDirection:"column", height:"100%" }}>
      <div style={{ padding:"12px 24px", background:C.surface, borderBottom:`1px solid ${C.border}`, flexShrink:0 }}>
        <div style={{ display:"flex", alignItems:"center", gap:10, flexWrap:"wrap" }}>
          <div style={{ display:"flex", alignItems:"center", gap:8 }}>
            <div className={loading ? "live-dot" : ""} style={{ width:8, height:8, borderRadius:"50%", background: error ? C.red : loading ? C.yellow : paused ? C.textDim : C.green, boxShadow:`0 0 6px ${error?C.red:loading?C.yellow:paused?C.textDim:C.green}66` }}/>
            <span style={{ fontSize:12, fontWeight:600, color: error ? C.red : loading ? C.yellow : paused ? C.textMuted : C.green }}>
              {error ? "ERROR" : loading ? "SCANNING…" : paused ? "PAUSED" : "LIVE"}
            </span>
          </div>
          <div style={{ width:1, height:20, background:C.border }}/>
          <div style={{ display:"flex", alignItems:"center", gap:6 }}>
            <span style={{ fontSize:11, color:C.textMuted }}>Market:</span>
            <span style={{ fontSize:12, fontWeight:700, color:biasC }}>{bias}</span>
          </div>
          {hcCount > 0 && <span style={s.pill(C.yellow)}>{hcCount} high conv.</span>}
          {trackedCount > 0 && <span style={s.pill(C.blue)}>{trackedCount} tracked 30d</span>}
          <div style={{ marginLeft:"auto", display:"flex", gap:8, alignItems:"center", flexWrap:"wrap" }}>
            <input value={ticker} onChange={e => setTicker(e.target.value.toUpperCase())} placeholder="Ticker…"
              style={{ ...s.input, width:100, padding:"6px 10px", fontSize:12 }}/>
            <select value={minPrem} onChange={e => setMinPrem(+e.target.value)}
              style={{ ...s.input, width:"auto", padding:"6px 10px", fontSize:12, cursor:"pointer" }}>
              {[0,50000,100000,250000,500000].map(v=><option key={v} value={v}>{v===0?"Any $":v>=1e6?`$${v/1e6}M+`:`$${v/1e3}K+`}</option>)}
            </select>
            <select value={minProb} onChange={e => setMinProb(+e.target.value)}
              style={{ ...s.input, width:"auto", padding:"6px 10px", fontSize:12, cursor:"pointer" }}>
              {[80,70,60,50,0].map(v=><option key={v} value={v}>{v===0?"Any %":`Win ${v}%+`}</option>)}
            </select>
            <select value={pollSec} onChange={e => setPollSec(+e.target.value)}
              style={{ ...s.input, width:"auto", padding:"6px 10px", fontSize:12, cursor:"pointer" }}>
              {[60,90,120,180].map(v=><option key={v} value={v}>{v}s</option>)}
            </select>
            <button onClick={() => setConfOnly(p=>!p)} style={s.btn(confOnly, C.yellow)}>⚡ Confirmed</button>
            <button onClick={() => setSoundOn(p=>!p)} style={s.btn(soundOn)}>{soundOn ? "🔔" : "🔕"}</button>
            <button onClick={onRefresh} disabled={loading} style={{ ...s.btn(false), opacity:loading?.5:1 }}>⟳ Refresh</button>
            <button onClick={() => setPaused(p=>!p)} style={s.btn(paused, C.blue)}>{paused ? "▶ Resume" : "⏸ Pause"}</button>
          </div>
        </div>
        {error && <div style={{ fontSize:12, color:C.red, marginTop:8, padding:"6px 10px", background:C.red+"11", borderRadius:4 }}>⚠ {error}</div>}
      </div>

      <div style={{ flex:1, display:"grid", gridTemplateColumns:"1fr 1fr 0.7fr", overflow:"hidden" }}>
        {[
          { title:"Squeezes", color:C.green, items:squeezes, icon:"🚀" },
          { title:"Flushes",  color:C.red,   items:flushes,  icon:"🩸" },
          { title:"Macro",    color:C.blue,  items:macros,   icon:"📊" },
        ].map(({ title, color, items, icon }) => (
          <div key={title} style={{ display:"flex", flexDirection:"column", borderRight:`1px solid ${C.border}`, overflow:"hidden" }}>
            <div style={{ padding:"12px 16px", background:C.surface, borderBottom:`1px solid ${color}33`, flexShrink:0 }}>
              <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                <span style={{ fontSize:14 }}>{icon}</span>
                <span style={{ fontSize:12, fontWeight:700, color, letterSpacing:"0.06em" }}>{title.toUpperCase()}</span>
                <span style={{ fontSize:11, color:C.textMuted, marginLeft:"auto" }}>{items.length} signals</span>
              </div>
              {items.length > 0 && (
                <div style={{ display:"flex", gap:6, marginTop:8, flexWrap:"wrap" }}>
                  {items.filter(p=>(p.trade_day||1)<=1).length > 0 && <span style={s.pill(C.green)}>{items.filter(p=>(p.trade_day||1)<=1).length} enter</span>}
                  {items.filter(p=>(p.staircase_days||0)>=3&&!p.sweepOk).length > 0 && <span style={s.pill(C.blue)}>{items.filter(p=>(p.staircase_days||0)>=3&&!p.sweepOk).length} early</span>}
                </div>
              )}
            </div>
            <div style={{ overflowY:"auto", flex:1, padding:"10px" }}>
              {items.length === 0 ? (
                <div style={{ padding:"40px 20px", textAlign:"center" }}>
                  <div style={{ fontSize:32, marginBottom:12 }}>{icon}</div>
                  <div style={{ fontSize:13, color:C.textDim }}>No {title.toLowerCase()} yet</div>
                  <div style={{ fontSize:11, color:C.textDim, marginTop:4 }}>{ready ? "Scan in progress…" : "Connect to start scanning"}</div>
                </div>
              ) : items.map(p => (
                <SignalCard key={p.id} p={p} open={openId === p.id} onToggle={() => toggle(p.id)} macroBias={bias}/>
              ))}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ─── INCOME PLAN TAB ───────────────────────────────────────────────────────────
function IncomePlanTab({ claudeKey }) {
  const [goal,       setGoal]    = useState("5000");
  const [strategy,   setStrat]   = useState("cc");
  const [stockPrice, setStkPx]   = useState("");
  const [shares,     setShares]  = useState("100");
  const [strike,     setStrike]  = useState("");
  const [premium,    setPrem]    = useState("");
  const [dte,        setDte]     = useState("30");
  const [account,    setAcct]    = useState("25000");
  const [planText,   setPlanText]= useState("");
  const [loading,    setLoading] = useState(false);
  const [result,     setResult]  = useState(null);

  const stkN   = parseFloat(stockPrice) || 0;
  const strN   = parseFloat(strike) || 0;
  const premN  = parseFloat(premium) || 0;
  const sharesN= parseInt(shares) || 0;
  const goalN  = parseFloat(goal) || 0;
  const acctN  = parseFloat(account) || 0;
  const contracts = Math.floor(sharesN / 100);
  const grossPrem = premN * 100 * contracts;
  const annualized = dte > 0 ? (premN / stkN) * (365 / parseInt(dte || 30)) * 100 : 0;
  const tradesNeeded = goalN > 0 && grossPrem > 0 ? Math.ceil(goalN / grossPrem) : null;
  const monthlyRunRate = grossPrem * (30 / parseInt(dte || 30));

  const STRATS_INFO = {
    cc:  { name:"Covered Call",       desc:"Sell OTM calls against shares you own. Generates income but caps upside above strike.", riskNote:"You must own 100 shares per contract. Max profit = premium + (strike − entry). Risk: shares called away if price rises above strike." },
    csp: { name:"Cash-Secured Put",   desc:"Sell OTM puts with cash to cover assignment. You get paid to wait for a price you'd buy at.", riskNote:"Must hold cash = strike × 100 per contract. Max loss: strike price (stock goes to zero). Best used on stocks you want to own." },
    cs:  { name:"Credit Spread",      desc:"Sell one option, buy a further OTM option for protection. Defined risk, defined reward.", riskNote:"Max gain = net premium. Max loss = spread width − premium. Use when IV is elevated." },
    div: { name:"Dividend Income",    desc:"Collect dividends from high-yield stocks while optionally selling covered calls on top.", riskNote:"Research payout sustainability — high yield can signal a dividend cut. Consider covered calls on top for extra income." },
  };
  const info = STRATS_INFO[strategy];

  async function generatePlan() {
    if (!claudeKey) return;
    setLoading(true); setPlanText(""); setResult(null);
    try {
      const sys = `You are an expert options income trader. Generate a clear, actionable monthly income plan.
Return a JSON object: {"summary":"one paragraph","trades":[{"week":1,"action":"sell AAPL $170 cc","premium":1.50,"max_profit":150,"max_loss":"shares called away at $170","notes":"rolls if price touches $168"}],"risks":["list of key risks"],"monthly_projection":{"low":number,"mid":number,"high":number},"key_rules":["list of discipline rules"]}`;
      const msg = `Create a ${strategy === "cc" ? "covered call" : strategy === "csp" ? "cash-secured put" : strategy === "cs" ? "credit spread" : "dividend income"} income plan.

Account: $${acctN.toLocaleString()}
Monthly income goal: $${goalN.toLocaleString()}

// ─── APP ───────────────────────────────────────────────────────────────────────
function App() {
  const [ready,    setReady]   = useState(false);
  const [tab,      setTab]     = useState("scanner");
  const [feed,     setFeed]    = useState([]);
  const [loading,  setLoading] = useState(false);
  const [error,    setError]   = useState("");
  const [paused,   setPaused]  = useState(false);
  const [pollSec,  setPollSec] = useState(120);
  const [soundOn,  setSoundOn] = useState(true);
  const [history,  setHistory] = useState(() => pruneHist(loadHist()));
  const akRef = useRef(""), ukRef = useRef("");
  const seen = useRef(new Set()), intv = useRef(null), isFetching = useRef(false), fetchRef = useRef(null);

  const parseArr = (text) => {
    if (!text) return [];
    const c = text.replace(/```json|```/g,"").trim();
    try { const r=JSON.parse(c); return Array.isArray(r)?r:[]; } catch {}
    const m = c.match(/\[[\s\S]*\]/);
    if (m) { try { const r=JSON.parse(m[0]); return Array.isArray(r)?r:[]; } catch {} }
    return [];
  };

  useEffect(() => { fetchRef.current = async () => {
    if (isFetching.current) return;
    isFetching.current = true; setLoading(true); setError("");
    let rawFetched = null;
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 75000);
      let res;
      try {
        const raw = await fetchUWDirect(ukRef.current, ctrl.signal);
        rawFetched = raw;
        const { ichimokuByTicker: _ich, ...forClaude } = raw;
        res = await fetch("https://api.anthropic.com/v1/messages", {
          method:"POST", signal:ctrl.signal,
          headers:{"Content-Type":"application/json","x-api-key":akRef.current,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
          body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:2500,system:buildSystemDirect(),messages:[{role:"user",content:`Pre-fetched UW data:\n${JSON.stringify(forClaude)}\n\nClassify and return only the JSON array starting with [`}]})
        });
        clearTimeout(timer);
      } catch(netErr) { clearTimeout(timer); throw netErr; }
      if (!res.ok) {
        const e = await res.json().catch(()=>({}));
        const msg = e?.error?.message||`HTTP ${res.status}`;
        if (res.status===429){await new Promise(r=>setTimeout(r,45000));return;}
        if (res.status>=500){await new Promise(r=>setTimeout(r,60000));return;}
        throw new Error(msg.slice(0,120));
      }
      const data = await res.json();
      const raw2 = (data.content||[]).find(b=>b.type==="text")?.text||"";
      const prints = parseArr(raw2);
      if (!prints.length){setError("No signals returned");return;}
      const ichMap = rawFetched?.ichimokuByTicker||{};
      const fresh = prints
        .filter(p=>p.ticker&&p.sig)
        .map(p=>({
          ...p,
          cat:ALL[p.sig]?.cat||(SQ[p.sqType]?"squeeze":FL[p.sqType]?"flush":"macro"),
          trade_day:Math.max(1,Math.min(21,parseInt(p.trade_day||1))),
          size:parseInt(p.size)||0,oi:parseInt(p.oi)||0,premium:parseInt(p.premium)||0,
          sweepOk:!!p.sweepOk,dpOk:!!p.dpOk,staircase_days:parseInt(p.staircase_days)||0,
          time:p.time||new Date().toTimeString().slice(0,8),
          id:p.id||`${p.ticker}-${p.sig}-${Date.now()}-${Math.random().toString(36).slice(2)}`,
          ichimoku:ichMap[p.ticker]||null,
        }))
        .map(p=>({...p,winProb:calcWinProb(p)}))
        .filter(p=>{
          const uid=`${p.ticker}-${p.sqType}-${p.strike}-${p.expiry}`;
          if(seen.current.has(uid)) return false;
          seen.current.add(uid); return true;
        });
      if (fresh.length>0){
        if(soundOn&&fresh.some(p=>p.sweepOk&&p.dpOk&&(p.winProb||0)>=60)) beep();
        setFeed(prev=>[...fresh,...prev].slice(0,300));
        setHistory(prev=>{const n=recordHist(fresh,prev);saveHist(n);return n;});
        setError("");
      }
    } catch(e) {
      setError(e.message?.slice(0,100)||"Scan failed");
    } finally { isFetching.current=false; setLoading(false); }
  }; });

  useEffect(()=>{
    if(!ready) return;
    const t=setTimeout(()=>fetchRef.current?.(),1200);
    intv.current=setInterval(()=>{if(!paused)fetchRef.current?.();},Math.max(pollSec,60)*1000);
    return()=>{clearTimeout(t);clearInterval(intv.current);};
  },[ready,pollSec]);

  useEffect(()=>{if(paused)clearInterval(intv.current);},[paused]);

  const connect=(a,u)=>{ akRef.current=a; ukRef.current=u; isFetching.current=false; seen.current.clear(); setFeed([]); setReady(true); };
  const manualRefresh=()=>{isFetching.current=false;setTimeout(()=>fetchRef.current?.(),100);};

  if(!ready) return <SetupScreen onConnect={connect}/>;

  return (
    <div style={{ height:"100vh", display:"flex", flexDirection:"column", background:C.bg }}>
      <div style={{ background:C.surface, borderBottom:`1px solid ${C.border}`, flexShrink:0 }}>
        <div style={{ display:"flex", alignItems:"center", padding:"0 24px", height:56 }}>
          <div style={{ marginRight:32 }}>
            <span style={{ fontSize:16, fontWeight:800, color:C.text, letterSpacing:"-0.02em" }}>Income Edge</span>
            <span style={{ fontSize:10, color:C.textMuted, marginLeft:10, letterSpacing:"0.1em" }}>BETA</span>
          </div>
          {[{id:"scanner",label:"Scanner",icon:"📡"},{id:"income",label:"Income Plan",icon:"💰"},{id:"poly",label:"Polymarket",icon:"🎯"}].map(t=>(
            <button key={t.id} onClick={()=>setTab(t.id)}
              style={{ display:"flex", alignItems:"center", gap:6, padding:"0 16px", height:"100%", background:"transparent", border:"none", borderBottom:`2px solid ${tab===t.id?C.blue:"transparent"}`, color:tab===t.id?C.text:C.textMuted, fontSize:13, fontWeight:tab===t.id?600:400, cursor:"pointer", transition:"all .15s", marginRight:4 }}>
              <span>{t.icon}</span>{t.label}
            </button>
          ))}
          <div style={{ marginLeft:"auto", fontSize:11, color:C.textDim }}>{feed.length} signals · Not financial advice</div>
        </div>
      </div>
      <div style={{ flex:1, overflow:"hidden" }}>
        {tab==="scanner"&&<ScannerTab feed={feed} loading={loading} error={error} soundOn={soundOn} setSoundOn={setSoundOn} onRefresh={manualRefresh} paused={paused} setPaused={setPaused} pollSec={pollSec} setPollSec={setPollSec} ready={ready} history={history}/>}
        {tab==="income"&&<div style={{ height:"100%", overflowY:"auto" }}><IncomePlanTab claudeKey={akRef.current}/></div>}
        {tab==="poly"&&<div style={{ height:"100%", overflowY:"auto" }}><PolymarketTab claudeKey={akRef.current}/></div>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
