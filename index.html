        )}

        {/* Two words, not a settings panel. */}
        <div style={{ display:"flex", gap:8, marginBottom:22, marginTop:14 }}>
          {[{ id:"safe", label:"🛡 Only the best" }, { id:"pro", label:"⚙ Show everything" }].map(o => (
            <button key={o.id} onClick={()=>onMode(o.id)}
              style={{ flex:1, padding:"11px 0", borderRadius:7, cursor:"pointer", fontFamily:"inherit",
                       fontSize:13.5, fontWeight:600,
                       color: mode===o.id ? V.text : V.text4,
                       background: mode===o.id ? V.chipBg : "transparent",
                       border:`1px solid ${mode===o.id ? V.accentLine : V.line}` }}>
              {o.label}
            </button>
          ))}
        </div>

        <Fold V={V} title="When to be careful today" open={isOpen("times")} onToggle={()=>flip("times")}>
          {soon.length === 0 ? (
            <div>Nothing scheduled for the rest of today. Surprises are not on a calendar, though.</div>
          ) : soon.map((z, i) => (
            <div key={i} style={{ marginBottom:12 }}>
              <div style={{ color:V.text, fontWeight:600 }}>{fmt(z.start)} – {fmt(z.end)} · {z.label}</div>
              <div style={{ fontSize:13.5 }}>{z.note}</div>
            </div>
          ))}
          <div style={{ fontSize:13, color:V.text4, marginTop:8 }}>
            All times are New York time. Worked out from the clock and the economic calendar —
            not a guess about price.
          </div>
        </Fold>

        <Fold V={V} title="What do the words mean?" open={isOpen("words")} onToggle={()=>flip("words")}>
          {Object.entries(PLAIN).map(([k, v]) => (
            <div key={k} style={{ marginBottom:11 }}>
              <span style={{ color:V.accent, fontWeight:700, textTransform:"uppercase", fontSize:12.5, letterSpacing:"0.05em" }}>{k}</span>
              <div style={{ fontSize:13.5 }}>{v}</div>
            </div>
          ))}
        </Fold>

        <Fold V={V} title="How does it decide?" open={isOpen("how")} onToggle={()=>flip("how")}>
          <div style={{ marginBottom:12 }}>Six checks. Each one has a ceiling, so no single check can run away with the score.</div>
          {[
            ["Trend", "Is it going somewhere? Up to 20 points."],
            ["Momentum", "Is it moving smoothly rather than jerking around? Up to 15 points."],
            ["Volume", "Is anyone actually trading it today? Up to 20 points."],
            ["Movement", "Does it move enough to be worth it, but not so much you cannot size it? Up to 15 points."],
            ["Shape", "Is it breaking out of a real range, not just noise? Up to 15 points."],
            ["Liquidity", "Can you get back out? Up to 15 points, and too thin blocks it completely."],
          ].map(([k, v]) => (
            <div key={k} style={{ marginBottom:9 }}>
              <span style={{ color:V.text, fontWeight:600 }}>{k}</span> — {v}
            </div>
          ))}
          <div style={{ marginTop:12 }}>
            Three things then hold a score down: no clear direction, too thin to trade, or price has
            already run too far. Any one of them caps it. This is built to say <b style={{color:V.text2}}>no</b> more
            often than it says yes.
          </div>
          <div style={{ fontSize:13, color:V.text3, marginTop:12, lineHeight:1.7 }}>
            <b style={{color:V.text2}}>About the money numbers.</b> The "you would be out about"
            figure uses a sell point one and a half times the stock's normal daily swing below your
            buy price. That is a rule of thumb, not a promise — if the price jumps straight past it
            overnight you lose more. It sizes <b style={{color:V.text2}}>shares only</b>, never
            options contracts, because naming a contract needs live option prices this app does not have.
          </div>
          <div style={{ fontSize:13, color:V.text4, marginTop:12 }}>
            The same six checks are also written out as ThinkorSwim columns in the FINAL_V4 folder of
            the project. That is a <b style={{color:V.text3}}>reference</b> copy for checking the logic —
            the app does not run it and does not need it.
          </div>
        </Fold>

        <Fold V={V} title="Trading these with options?  ⚠ HIGH RISK" open={isOpen("dte")} onToggle={()=>flip("dte")}>
          <div style={{ background:V.bad+"14", border:`1px solid ${V.bad}55`, borderRadius:8,
                        padding:"12px 14px", marginBottom:14 }}>
            <div style={{ color:V.bad, fontWeight:800, fontSize:14, letterSpacing:"0.04em", marginBottom:5 }}>
              ⚠ HIGH RISK
            </div>
            <div style={{ fontSize:13.5, lineHeight:1.7, color:V.text2 }}>
              Contracts expiring this week are the fastest way to lose everything you put in.
              The whole amount can go to zero, and it can happen in one day. Nothing on this
              screen changes that. Read all of this before you buy one.
            </div>
          </div>

          {[0, 1].map(d => {
            const info = DTE_INFO[d];
            const outside = info.verdict === "OUTSIDE";
            return (
              <div key={d} style={{ marginBottom:12, paddingLeft:12,
                                    borderLeft:`2px solid ${outside ? V.bad : V.warn}` }}>
                <div style={{ color:V.text, fontWeight:700, fontSize:14 }}>{info.label}</div>
                <div style={{ fontSize:13.5, marginBottom:4 }}>{info.plain}</div>
                <div style={{ fontSize:13, color: outside ? V.bad : V.warnText }}>
                  {outside ? "✕ This scanner cannot help you here. " : "△ Tightest expiry this signal reaches. "}
                  {info.why}
                </div>
                {(() => {
                  const risk = expiryRisk(calendar, nowMs, d);
                  if (!risk.hits.length) return null;
                  return (
                    <div style={{ fontSize:13, color:V.bad, marginTop:5, lineHeight:1.6 }}>
                      📅 <b>Bad day to expire:</b> {risk.hits.map(h => h.name).join(", ")}. Scheduled news
                      moves prices in a way no chart predicts, and a contract dying that day has no time to recover.
                    </div>
                  );
                })()}
              </div>
            );
          })}

          <div style={{ background:V.raised, border:`1px solid ${V.line}`, borderRadius:8,
                        padding:"12px 14px", margin:"14px 0", fontSize:13.5, lineHeight:1.7 }}>
            <b style={{ color:V.text }}>So between the two, 1DTE is the less wrong one</b> — not because
            it wins more, but because it is the only one that overlaps the {SIGNAL_HOLD_DAYS[0]}–{SIGNAL_HOLD_DAYS[1]} day
            window these scores are built for. A same-day contract is a bet on the next few hours, and
            nothing on this screen measures the next few hours.
          </div>

          <div style={{ fontSize:13, color:V.warnText, background:V.warnBg, border:`1px solid ${V.warnLine}`,
                        borderRadius:8, padding:"12px 14px", marginBottom:14, lineHeight:1.7 }}>
            📅 <b>Days this app cannot see.</b> It works out Jobless Claims, the jobs report,
            and options expiration days by the calendar rules, and it will warn you above if your
            expiry lands on one. It does <b>not</b> know Fed announcement days or inflation report
            days — those are published dates, not something that can be worked out, and no list has
            been loaded. <b>A quiet calendar here does not mean it is safe.</b> Check the official
            schedule yourself before buying anything that expires this week.
          </div>

          <div style={{ fontSize:13, color:V.warnText, background:V.warnBg, border:`1px solid ${V.warnLine}`,
                        borderRadius:8, padding:"12px 14px", marginBottom:14, lineHeight:1.7 }}>
            ⚠ <b>Check your own broker's expiry-day rules before you hold one.</b> Brokers commonly
            close in-the-money contracts for you near the closing bell if your account could not cover
            being assigned the shares — and the price you get is whatever is there at that moment, not
            one you chose. That risk is at its worst on the last day, which is another reason a
            same-day contract is the hardest one to hold. Rules differ by broker and change, so read
            yours rather than trusting a summary.
          </div>

          <div style={{ color:V.text, fontWeight:700, fontSize:14, marginBottom:6 }}>How many could you buy?</div>
          <div style={{ fontSize:13, marginBottom:10 }}>
            Look up the contract in your broker and type what it costs per share. This app cannot look
            it up for you — it has no options price feed, so it will not name a contract.
          </div>
          <div style={{ display:"flex", alignItems:"center", gap:8, flexWrap:"wrap", marginBottom:10 }}>
            <select value={dte} onChange={e=>setDte(+e.target.value)}
              style={{ background:V.surface, border:`1px solid ${V.line}`, color:V.text, padding:"7px 8px", fontSize:13.5, borderRadius:6, cursor:"pointer" }}>
              <option value={1}>1DTE</option>
              <option value={0}>0DTE</option>
            </select>
            <span style={{ fontSize:13.5 }}>costs</span>
            <span style={{ fontSize:14, color:V.text3 }}>$</span>
            <input inputMode="decimal" value={debit} placeholder="2.50"
              onChange={e=>setDebit(e.target.value.replace(/[^0-9.]/g,"").slice(0,8))}
              style={{ width:80, background:V.surface, border:`1px solid ${V.line}`, color:V.text,
                       padding:"7px 10px", fontSize:14, fontWeight:700, borderRadius:6, outline:"none" }}/>
            <span style={{ fontSize:13.5 }}>a share</span>
          </div>
          {(() => {
            const cap = budget > 0 ? budget * (riskPct / 100) : 0;
            if (!(cap > 0)) return <div style={{ fontSize:13, color:V.text4 }}>Enter your amount at the top first.</div>;
            const c = contractsFor(cap, debit);
            if (!c) return <div style={{ fontSize:13, color:V.text4 }}>Type the price above and this works out the rest.</div>;
            return (
              <div style={{ fontSize:13.5, lineHeight:1.75 }}>
                One contract covers 100 shares, so it costs <b style={{color:V.text}}>{usd(c.perContract)}</b>.
                {c.skip
                  ? <> With {usd(cap)} to risk, that is <b style={{color:V.bad}}>zero contracts — skip it.</b> Buying one anyway
                      would put {usd(c.perContract)} at risk, more than you said you were willing to lose.</>
                  : <> With {usd(cap)} to risk you could buy <b style={{color:V.text}}>{c.contracts}</b>, and
                      the most you could lose is <b style={{color:V.text}}>{usd(c.maxLoss)}</b> — the whole
                      thing, if it expires worthless.</>}
                {dte === 0 && <div style={{ color:V.bad, marginTop:6 }}>Reminder: the score above says nothing about a contract expiring today.</div>}
              </div>
            );
          })()}
        </Fold>

        <Fold V={V} title="What this cannot do" open={isOpen("limits")} onToggle={()=>flip("limits")}>
          <ul style={{ margin:0, paddingLeft:18, lineHeight:2 }}>
            <li>It does not predict prices. It puts setups in order.</li>
            <li>A high score is not a guarantee. Plenty of high scores lose.</li>
            <li>It cannot know what a stock will do after news.</li>
            <li>It never places a trade and never touches your brokerage account.</li>
          </ul>
          <div style={{ marginTop:12, fontSize:13, color:V.text4 }}>
            Education only. Not financial advice.
          </div>
        </Fold>

      </div>
    </div>
  );
}

function App() {
  const [ready,     setReady]     = useState(false);
  const [feed,      setFeed]      = useState([]);
  const [openId,    setOpenId]    = useState(null);
  const [positions, setPositions] = useState({});
  const [newIds,    setNewIds]    = useState(new Set());
  const [logs,      setLogs]      = useState([]);
  const [loading,   setLoading]   = useState(false);
  const [error,     setError]     = useState("");
  const [paused,    setPaused]    = useState(false);
  const [pollSec,   setPollSec]   = useState(120);
  const [minProb,   setMinProb]   = useState(70);
  const [gateOn,    setGateOn]    = useState(true);
  const [minPrem,   setMinPrem]   = useState(0);
  const [confirmed, setConfirmed] = useState(false);
  const [showLog,   setShowLog]   = useState(false);
  const [soundOn,   setSoundOn]   = useState(true);
  const [ticker,    setTicker]    = useState("");
  const [history,   setHistory]   = useState(() => pruneHist(loadHist()));
  const [viewMode,  setViewMode]  = useState("live");   // "live" | "top10"
  const [sortMode,  setSortMode]  = useState("days");    // "days" | "premium"
  const [usage,     setUsage]     = useState({ in:0, out:0, scans:0 });  // cumulative this session
  const [nowMin,    setNowMin]    = useState(() => nowETMin());          // minutes since midnight ET, ticks every 30s
  const [pbOpen,    setPbOpen]    = useState(false);                     // playbook expanded panel
  const [showLegend,setShowLegend]= useState(false);                     // legend strip hidden by default
  const [directMode,setDirectMode]= useState(true);                      // true = REST direct (fast), false = MCP (slower)
  const [showV4,    setShowV4]    = useState(false);                     // V4 quant grid panel
  const [showIncome,setShowIncome]= useState(false);                     // income ETF lab panel
  const [showBrain, setShowBrain] = useState(true);                      // Market Brain — first thing you see
  const [showIntel, setShowIntel] = useState(false);                     // live catalyst intelligence
  const [tradeMode, setTradeMode] = useState("pro");                     // "safe" | "pro" — changes what is surfaced
  const [newsRaw,   setNewsRaw]   = useState([]);                        // normalised inputs to the catalyst engine
  const [intelRows, setIntelRows] = useState(() => loadIntel());         // observed event database (localStorage)
  const [nowMs,     setNowMs]     = useState(() => Date.now());
  const [showPoly,  setShowPoly]  = useState(false);                     // Poly Intelligence
  const [polyMarkets,setPolyMarkets] = useState([]);                     // read-only; no execution path exists
  // Simple view is the default. Expert is the old dense layout, unchanged.
  const [uiMode,    setUiMode]    = useState(() => {
    try { return localStorage.getItem(SIMPLE_KEY) === "expert" ? "expert" : "simple"; } catch(_) { return "simple"; }
  });
  // "system" until the reader picks a side, so we follow the OS by default and
  // never override an explicit choice.
  // Stays on the device. This is someone's account size — it has no business
  // leaving the browser, and there is no server to send it to anyway.
  const [moneyPrefs, setMoneyState] = useState(() => {
    try { const v = JSON.parse(localStorage.getItem(MONEY_KEY) || "{}");
          return { budget: Number(v.budget) || 0, riskPct: [1,2,5].includes(v.riskPct) ? v.riskPct : 2 }; }
    catch(_) { return { budget: 0, riskPct: 2 }; }
  });
  const [theme,     setTheme]     = useState(() => {
    let t = "system";
    try { const v = localStorage.getItem(THEME_KEY); if (v === "light" || v === "dark") t = v; } catch(_){}
    return applyTheme(t);
  });
  // True only when both paid keys were supplied. Everything else runs without them.
  const [liveMode,  setLiveMode]  = useState(false);
  // Daily bars from /api/bars — the keyless data path. Scores computed client-side
  // by the same computeV4 the options-flow path uses, so there is one engine.
  const [barRows,   setBarRows]   = useState([]);
  const [barStatus, setBarStatus] = useState({ state:"idle" });

  const seen       = useRef(new Set());
  const intv       = useRef(null);
  const isFetching = useRef(false);
  const fetchRef   = useRef(null);
  const akRef      = useRef("");
  const ukRef      = useRef("");

  const addLog = useCallback(msg => {
    const t = new Date().toTimeString().slice(0,8);
    setLogs(p => [`[${t}] ${msg}`, ...p.slice(0,99)]);
  }, []);

  const parseArr = useCallback(text => {
    if (!text) return [];
    const c = text.replace(/```json|```/g,"").trim();
    try { const r=JSON.parse(c); return Array.isArray(r)?r:[]; } catch {}
    const m = c.match(/\[[\s\S]*\]/);
    if (m) { try { const r=JSON.parse(m[0]); return Array.isArray(r)?r:[]; } catch {} }
    return [];
  }, []);

  useEffect(() => { fetchRef.current = async () => {
    if (isFetching.current) { addLog("⏳ Already scanning…"); return; }
    isFetching.current=true; setLoading(true); setError("");
    addLog("Scanning: flow + dark pool + staircase detection + enrichment…");
    let rawFetched = null;  // hoisted — populated in direct mode, read after Claude returns to attach Ichimoku to signals
    try {
      // Retry with exponential backoff. AbortController guards each attempt so a hung
      // MCP tool call can't tie up the next scan cycle.
      const SCAN_TIMEOUT_MS = directMode ? 60000 : 150000;  // direct: 60s · MCP: 2.5min
      const MAX_ATTEMPTS    = 2;
      let res, lastErr;
      for (let attempt=1; attempt<=MAX_ATTEMPTS; attempt++) {
        const ctrl = new AbortController();
        const timer = setTimeout(()=>ctrl.abort(), SCAN_TIMEOUT_MS);
        try {
          // Build the request body — DIRECT mode fetches UW REST first then sends compact data to Claude (no mcp_servers).
          let body;
          if (directMode) {
            addLog("Fetching UW REST (flow + dark pool + tide + per-ticker + OHLC for Ichimoku)…");
            const raw = await fetchUWDirect(ukRef.current, ctrl.signal);
            rawFetched = raw;  // hoisted — used later to attach ichimoku to each classified signal
            const tnames = Object.keys(raw.per_ticker||{});
            const ichCount = Object.keys(raw.ichimokuByTicker||{}).length;
            addLog(`✓ UW: ${raw.flow_alerts.length} flow · ${raw.dark_pool_recent.length} DP · ${tnames.length} top tickers (${tnames.join(", ")}) · ${ichCount} Ichimoku`);
            // Strip ichimokuByTicker from the payload sent to Claude — it's heavy and unused by the classifier
            const { ichimokuByTicker: _ich, ...forClaude } = raw;
            body = JSON.stringify({
              model:"claude-sonnet-4-5", max_tokens:2500,
              system: buildSystemDirect(),
              messages:[{ role:"user", content:`Pre-fetched UW data:\n${JSON.stringify(forClaude)}\n\nClassify and return only the JSON array starting with [` }],
            });
          } else {
            body = JSON.stringify({
              model:"claude-sonnet-4-5", max_tokens:2000,
              system: buildSystem(ukRef.current),
              messages:[{ role:"user", content:"Run full scan now. Return only the JSON array starting with [" }],
              mcp_servers:[{ type:"url", url:"https://api.unusualwhales.com/api/mcp", name:"unusual-whales", authorization_token:ukRef.current }],
            });
          }
          res = await fetch("https://api.anthropic.com/v1/messages", {
            method:"POST",
            signal: ctrl.signal,
            headers:{
              "Content-Type":"application/json",
              "x-api-key":akRef.current,
              "anthropic-version":"2023-06-01",
              ...(directMode ? {} : {"anthropic-beta":"mcp-client-2025-04-04"}),
              "anthropic-dangerous-direct-browser-access":"true"
            },
            body
          });
          clearTimeout(timer);
          break;
        } catch (netErr) {
          clearTimeout(timer);
          lastErr = netErr;
          const aborted = netErr.name === "AbortError";
          const why = aborted
            ? `timed out after ${SCAN_TIMEOUT_MS/1000}s (MCP tool call probably hung)`
            : !navigator.onLine
              ? "you appear to be offline"
              : `browser blocked the request — ${netErr.message} (likely CORS or invalid Anthropic key)`;
          if (attempt < MAX_ATTEMPTS) {
            const wait = 2000 * attempt;
            addLog(`⏳ Attempt ${attempt}/${MAX_ATTEMPTS} failed (${why}) — retrying in ${wait/1000}s…`);
            await new Promise(r=>setTimeout(r, wait));
            continue;
          }
          throw new Error(`Network after ${MAX_ATTEMPTS} attempts: ${why}`);
        }
      }
      if (!res) throw lastErr || new Error("No response");
      if (!res.ok) {
        const e = await res.json().catch(()=>({}));
        const msg = e?.error?.message || `HTTP ${res.status}`;
        if (msg.includes("concurrents")||msg.includes("exceeded_limit")||res.status===429) {
          addLog("⏳ Rate limit — waiting 45s…"); setError("Rate limited…");
          await new Promise(r=>setTimeout(r,45000));
          setError(""); isFetching.current=false; setLoading(false); return;
        }
        if (res.status===529 || res.status===503 || res.status===500) {
          addLog(`⏳ Anthropic overloaded (HTTP ${res.status}) — waiting 60s…`); setError(`Anthropic ${res.status}…`);
          await new Promise(r=>setTimeout(r,60000));
          setError(""); isFetching.current=false; setLoading(false); return;
        }
        if (res.status===401) throw new Error("Invalid Anthropic API key (401)");
        throw new Error(`HTTP ${res.status}: ${msg.slice(0,150)}`);
      }
      const data = await res.json();
      const u = data.usage || {};
      const inTok  = (u.input_tokens||0) + (u.cache_creation_input_tokens||0) + (u.cache_read_input_tokens||0);
      const outTok = u.output_tokens||0;
      if (inTok || outTok) {
        setUsage(prev => ({ in: prev.in + inTok, out: prev.out + outTok, scans: prev.scans + 1 }));
        const cost = (inTok*3 + outTok*15) / 1e6;
        addLog(`Tokens: ${inTok} in / ${outTok} out · ~$${cost.toFixed(3)} this scan`);
      }
      const tools = (data.content||[]).filter(b=>b.type==="mcp_tool_use");
      if (tools.length) addLog(`Tools used: ${[...new Set(tools.map(t=>t.name))].join(", ")}`);
      const raw = ((data.content||[]).find(b=>b.type==="text")?.text)||"";
      addLog(`Response: ${raw.length} chars`);
      const prints = parseArr(raw);
      if (!prints.length) { addLog("⚠ No valid JSON — will retry next cycle"); if(raw) addLog(`Snippet: ${raw.slice(0,100)}`); return; }
      const freshIds = new Set();
      const ichMap = rawFetched?.ichimokuByTicker || {};
      const v4Map  = rawFetched?.v4ByTicker || {};
      if (rawFetched?.news_headlines?.length) setNewsRaw(rawFetched.news_headlines);
      const fresh = prints
        .filter(p=>p.ticker&&p.sig)
        .map(p=>({
          ...p,
          cat: ALL[p.sig]?.cat||(SQ[p.sqType]?"squeeze":FL[p.sqType]?"flush":"macro"),
          trade_day: Math.max(1,Math.min(21,parseInt(p.trade_day||p.day||1))),
          day: Math.max(1,Math.min(3,parseInt(p.day||1))),
          size:parseInt(p.size)||0, oi:parseInt(p.oi)||0, premium:parseInt(p.premium)||0,
          sweepOk:!!p.sweepOk, dpOk:!!p.dpOk,
          staircase_days:parseInt(p.staircase_days)||0,
          time:p.time||new Date().toTimeString().slice(0,8),
          id:p.id||`${p.ticker}-${p.sig}-${Date.now()}-${Math.random().toString(36).slice(2)}`,
          ichimoku: ichMap[p.ticker] || null,  // ← Ichimoku pre-computed client-side from 5m OHLC
          v4: v4Map[p.ticker] || null,         // ← V4 quant stack, same math as FINAL_V4 ThinkScript
        }))
        .map(p=>({...p, winProb:calcWinProb(p)}))
        .filter(p=>{
          if (parseInt(p.premium||0) < minPrem) return false;
          const uid=`${p.ticker}-${p.sqType}-${p.strike}-${p.expiry}`;
          if (seen.current.has(uid)) return false;
          seen.current.add(uid); freshIds.add(p.id); return true;
        });
      if (fresh.length>0) {
        if (soundOn&&fresh.some(p=>p.sweepOk&&p.dpOk&&(p.winProb||0)>=60)) beep();
        setNewIds(freshIds); setTimeout(()=>setNewIds(new Set()),12000);
        setFeed(prev=>[...fresh,...prev].slice(0,300));
        // Record in 30-day localStorage memory
        setHistory(prev => { const next = recordHist(fresh, prev); saveHist(next); return next; });
        const types=[...new Set(fresh.map(p=>p.sqType).filter(Boolean))];
        const sc=fresh.filter(p=>(p.staircase_days||0)>=3).length;
        addLog(`✓ ${fresh.length} signals · ${types.join(", ")} · ${sc} staircase · recorded to 30d memory`);
        setError("");
      } else addLog(`Got ${prints.length} items — none passed filters`);
    } catch(e) {
      setError(e.message.slice(0,100));
      addLog(`✗ ${e.message.slice(0,150)}`);
    } finally { isFetching.current=false; setLoading(false); }
  }; });

  // Polling only runs when the paid feed is actually connected. Without keys the
  // app is fully usable, it just has no options-flow rows — far better than the
  // old behaviour of scanning with empty credentials and surfacing an error.
  useEffect(() => {
    if (!ready || !liveMode) return;
    const t = setTimeout(()=>fetchRef.current?.(),1200);
    intv.current = setInterval(()=>{ if(!paused) fetchRef.current?.(); }, Math.max(pollSec,60)*1000);
    return ()=>{ clearTimeout(t); clearInterval(intv.current); };
  }, [ready, liveMode, pollSec]);

  // ── Keyless data path ──────────────────────────────────────────────────────
  // Pulls daily bars from our own endpoint and scores them locally. This is what
  // makes the scanner work for a visitor with no API key of any kind. It runs
  // regardless of liveMode; the options-flow feed is additive, not a prerequisite.
  const loadBars = useCallback(async () => {
    setBarStatus({ state:"loading" });
    try {
      const r = await fetch("/api/bars");
      const j = await r.json();
      if (!j.ok) {
        setBarRows([]);
        setBarStatus({ state:"unavailable", reason:j.reason, message:j.message, accepts:j.accepts });
        addLog(`Bars unavailable: ${j.reason}`);
        return;
      }
      const rows = [];
      for (const [ticker, bars] of Object.entries(j.bars || {})) {
        try {
          const v4 = computeV4(bars);
          if (v4) rows.push({ ticker, v4 });
        } catch (_) { /* one bad symbol must never break the whole scan */ }
      }
      rows.sort((a, b) => b.v4.score - a.v4.score);
      setBarRows(rows);
      setBarStatus({ state:"ok", provider:j.provider, asOf:j.asOf, scored:rows.length,
                     requested:j.requested, failed:(j.failed || []).length });
      addLog(`Scored ${rows.length}/${j.requested} symbols from ${j.provider}`);
    } catch (e) {
      setBarRows([]);
      setBarStatus({ state:"error", message:String(e.message || e) });
      addLog(`Bars fetch failed: ${e.message || e}`);
    }
  }, [addLog]);

  // Daily bars change once a day. Load on entry, refresh every 15 minutes so a
  // tab left open through the close picks up the new bar without hammering.
  useEffect(() => {
    if (!ready) return;
    loadBars();
    const id = setInterval(loadBars, 15 * 60 * 1000);
    return () => clearInterval(id);
  }, [ready, loadBars]);

  useEffect(()=>{ if(paused) clearInterval(intv.current); }, [paused]);
  useEffect(() => { const id = setInterval(() => setNowMin(nowETMin()), 30000); return () => clearInterval(id); }, []);
  useEffect(() => { const id = setInterval(() => setNowMs(Date.now()), 15000); return () => clearInterval(id); }, []);

  const connect = (a, u) => {
    akRef.current=a; ukRef.current=u;
    isFetching.current=false; seen.current.clear(); setFeed([]);
    const live = !!(a && u);
    setLiveMode(live);
    setReady(true);
    addLog(live ? "Connected · live options flow on · scan starting…"
                : "Started free · live options flow off — everything else is available");
  };

  const setUi = m => { setUiMode(m); try { localStorage.setItem(SIMPLE_KEY, m); } catch(_){} };

  // Toggling from "system" commits to whichever side is the opposite of what the
  // reader is currently looking at, which is what they meant by pressing it.
  const setMoneyPrefs = (budget, riskPct) => {
    const next = { budget: Number(budget) || 0, riskPct: [1,2,5].includes(riskPct) ? riskPct : 2 };
    setMoneyState(next);
    try { localStorage.setItem(MONEY_KEY, JSON.stringify(next)); } catch(_){}
  };

  const flipTheme = () => {
    const showingLight = theme === "light"
      || (theme === "system" && window.matchMedia?.("(prefers-color-scheme: light)").matches);
    const next = showingLight ? "dark" : "light";
    applyTheme(next); setTheme(next);
    try { localStorage.setItem(THEME_KEY, next); } catch(_){}
  };

  const manualFetch = () => { isFetching.current=false; setTimeout(()=>fetchRef.current?.(),100); };
  const savePos = (id,pos) => setPositions(p=>({...p,[id]:pos}));
  const toggle  = id => setOpenId(p=>p===id?null:id);
  const effMinProb = gateOn ? Math.max(minProb, WIN_GATE) : minProb;
  // Tickers in the current rolling feed that have at least one real sweep signal.
  // Used to drop "useless" pure-DP prints (dp_buy/dp_sell) with no matching sweep.
  const SWEEP_SIGS = new Set(["cs_dp","call_sweep","ps_dp","put_sweep"]);
  const PURE_DP_SIGS = new Set(["dp_buy","dp_sell"]);
  const tickersWithSweep = new Set(feed.filter(p => SWEEP_SIGS.has(p.sig)).map(p => p.ticker));
  const doFilter = items => items
    .filter(p =>
      (p.winProb===null||p.winProb>=effMinProb) &&
      (!confirmed||(p.sweepOk&&p.dpOk)) &&
      (!ticker.trim()||p.ticker.includes(ticker.trim().toUpperCase())) &&
      // Drop pure DP prints with no matching sweep on the same ticker in the recent window
      (!PURE_DP_SIGS.has(p.sig) || tickersWithSweep.has(p.ticker))
    )
    .sort((a,b) => {
      const ae=(a.staircase_days||0)>=3&&!a.sweepOk?-1:0, be=(b.staircase_days||0)>=3&&!b.sweepOk?-1:0;
      if (ae!==be) return ae-be;
      return (ALL[a.sig]?.tier||9)-(ALL[b.sig]?.tier||9)||(b.winProb||0)-(a.winProb||0);
    });

  // ── CATALYST INTELLIGENCE LAYER ────────────────────────────────────────────
  // Built fresh from whatever the scan returned. Never writes back into the
  // technical scores — the dimensions stay independent and are fused for display.
  const rawCatalystItems = [
    ...(newsRaw || []),
    // news attached to individual signals, so the engine still works when the
    // headlines endpoint is unavailable
    ...feed.filter(p => p.news?.any && p.news.latest).map(p => ({
      headline: p.news.latest, source: p.news.source || "", ticker: p.ticker,
      timestamp: p.news.hours_ago != null ? nowMs - p.news.hours_ago * 3600000 : nowMs,
      category: null,
    })),
  ];
  const marketOpen = nowMin >= 9 * 60 + 30 && nowMin < 16 * 60;
  const catalystEvents = buildCatalystEvents(rawCatalystItems, {
    now: nowMs, marketOpen, knownIds: new Set(intelRows.map(r => r.key)),
  });
  const scheduled = deriveScheduledEvents(nowMs);
  const zones = dangerZones(scheduled, catalystEvents, nowMs);

  // One scoring surface from two data paths. Options-flow rows win on a tie because
  // they carry the extra signal context (sweeps, dark pool, GEX) that bar rows lack.
  const scanFeed = (() => {
    const seenT = new Set(feed.filter(p => p.v4).map(p => p.ticker));
    return feed.concat(barRows.filter(r => !seenT.has(r.ticker)));
  })();
  const brain = marketBrain({ feed: scanFeed, events: catalystEvents, calendar: scheduled, zones, nowMs });

  // Safe Mode stands down near a critical event and on unverified high-impact news.
  const nextCritical = scheduled.find(e => e.importance === "CRITICAL");
  const unverifiedHot = new Set(catalystEvents
    .filter(e => e.impactNow >= 70 && (e.status === "RUMOR" || e.status === "UNVERIFIED"))
    .flatMap(e => e.tickers));
  const v4Rows = (() => {
    const seenT = new Set(), rows = [];
    scanFeed.forEach(p => { if (p.v4 && !seenT.has(p.ticker)) { seenT.add(p.ticker); rows.push({ ticker:p.ticker, v4:p.v4 }); } });
    return rows.sort((a,b) => b.v4.score - a.v4.score);
  })();
  const modeResult = applyMode(v4Rows, tradeMode, {
    nextCriticalMins: nextCritical ? (nextCritical.ts - nowMs) / 60000 : null,
    unverifiedHighImpactTickers: unverifiedHot,
  });

  // Persist observed events + measure how the tape actually reacted.
  const refPrices = (() => {
    const r = {};
    for (const sym of ["SPY","QQQ","IWM"]) { const v = scanFeed.find(p => p.ticker === sym)?.v4?.last; if (Number.isFinite(v)) r[sym] = v; }
    return Object.keys(r).length ? r : null;
  })();
  useEffect(() => {
    if (!catalystEvents.length && !intelRows.length) return;
    let next = recordEvents(intelRows, catalystEvents.filter(e => e.impactNow >= 40), refPrices, nowMs);
    next = captureReactions(next, refPrices, nowMs);
    if (next !== intelRows) { setIntelRows(next); saveIntel(next); }
  }, [nowMs]);

  const intelStats = Object.keys(CATEGORIES)
    .map(c => ({ category: c, r: reactionStats(intelRows, { category: c, symbol: "QQQ", mark: 30 }) }))
    .filter(s => s.r.n > 0)
    .sort((a, b) => b.r.n - a.r.n);
  const ingestStatus = { ok: (newsRaw || []).length > 0,
    text: (newsRaw || []).length > 0 ? `headlines feed live (${newsRaw.length})`
                                     : "headlines endpoint unavailable — using signal-attached news only" };

  if (!ready) return (
    <div style={{ display:"flex", flexDirection:"column", height:"100vh", fontFamily:"'Inter','Segoe UI',system-ui,sans-serif", background:"#060b10" }}>
      <Setup onConnect={connect}/>
    </div>
  );

  // Simple view — the default. The four deep panels are the same components the
  // expert view uses, opened as overlays, so there is exactly one implementation
  // of each and no chance of the two views disagreeing.
  if (uiMode === "simple") return (
    <div style={{ fontFamily:"'Inter','Segoe UI',system-ui,sans-serif", background:"var(--bg)", height:"100vh", display:"flex", flexDirection:"column", overflow:"hidden", color:"var(--text-2)" }}>
      {showPoly && <PolyTab onClose={()=>setShowPoly(false)} markets={polyMarkets} catalystEvents={catalystEvents} now={nowMs}/>}
      {showIntel && <IntelTab onClose={()=>setShowIntel(false)} events={catalystEvents} feed={feed}
                              calendar={scheduled} macroRiskScore={brain.macroRisk} stats={intelStats}
                              now={nowMs} ingestStatus={ingestStatus}/>}
      {showV4 && <V4Grid feed={scanFeed} onClose={()=>setShowV4(false)} modeResult={modeResult} mode={tradeMode}/>}
      {showIncome && <IncomeTab onClose={()=>setShowIncome(false)}/>}
      <SimpleHome
        brain={brain} zones={zones} zone={activeZone(zones, nowMs)} calendar={scheduled}
        liveMode={liveMode} dataStatus={barStatus} nowMs={nowMs} feed={scanFeed}
        mode={tradeMode} onMode={setTradeMode}
        theme={theme} onTheme={flipTheme}
        budget={moneyPrefs.budget} riskPct={moneyPrefs.riskPct} onMoney={setMoneyPrefs}
        onExpert={()=>setUi("expert")}
        onOpen={k => { if (k==="v4") setShowV4(true); else if (k==="income") setShowIncome(true);
                       else if (k==="intel") setShowIntel(true); else if (k==="poly") setShowPoly(true); }}/>
    </div>
  );

  const squeezes = doFilter(feed.filter(p=>p.cat==="squeeze"));
  const flushes  = doFilter(feed.filter(p=>p.cat==="flush"));
  const macros   = doFilter(feed.filter(p=>p.cat==="macro"));
  const topSq    = topBuilds(history, "squeeze", sortMode, 10, gateOn);
  const topFl    = topBuilds(history, "flush",   sortMode, 10, gateOn);
  const topMc    = topBuilds(history, "macro",   sortMode, 10, gateOn);
  const trackedCount = Object.keys(history||{}).length;
  const stopHits = Object.entries(positions).filter(([,pp]) => {
    const c = parseFloat(pp?.currentPrice), s = parseFloat(pp?.stopPrice);
    return !isNaN(c) && !isNaN(s) && s > 0 && c <= s;
  }).map(([id]) => feed.find(p=>p.id===id)).filter(Boolean);
  const winLocks = Object.entries(positions).filter(([,pp]) => {
    const e = parseFloat(pp?.entryPrice), c = parseFloat(pp?.currentPrice);
    return !isNaN(e) && !isNaN(c) && e > 0 && ((c-e)/e) >= 0.5;
  }).map(([id]) => feed.find(p=>p.id===id)).filter(Boolean);
  const mBull = macros.filter(p=>p.sig==="macro_bull").length;
  const mBear = macros.filter(p=>p.sig==="macro_bear").length;
  const bias  = mBull>mBear?"BULLISH":mBear>mBull?"BEARISH":"NEUTRAL";
  const biasC = {BULLISH:"#00ff88",BEARISH:"#ff3355",NEUTRAL:"#556677"}[bias];
  const exitAlerts = Object.entries(positions).filter(([,p])=>p?.entryPrice).map(([id])=>feed.find(p=>p.id===id)).filter(p=>p&&getHoldStatus(parseInt(p.trade_day||1),p.sqType).action==="exit");
  const earnAlerts = Object.entries(positions).filter(([,p])=>p?.entryPrice).map(([id])=>feed.find(p=>p.id===id)).filter(p=>p?.earnings?.within_14_days);
  const hcCount = feed.filter(p=>p.sweepOk&&p.dpOk&&(p.winProb||0)>=65).length;
  const scCount = feed.filter(p=>(p.staircase_days||0)>=3).length;
  const gexShort = feed.filter(p=>p.gex?.bias==="short_gamma" && p.cat==="squeeze").length;
  const gexLong  = feed.filter(p=>p.gex?.bias==="long_gamma"  && p.cat==="flush").length;
  const gexAmp   = gexShort + gexLong;


  return (
    <div style={{ fontFamily:"'Inter','Segoe UI',system-ui,sans-serif", background:"#05090e", height:"100vh", display:"flex", flexDirection:"column", overflow:"hidden", color:"#b0c4d8" }}>
      {exitAlerts.length>0 && (
        <div className="urgent" style={{ background:"#110600", borderBottom:"1px solid #ff335533", padding:"8px 20px", display:"flex", gap:12, alignItems:"center", flexShrink:0 }}>
          <span style={{ fontSize:16 }}>⏰</span>
          <div>
            <div style={{ fontSize:11, color:"#ff3355", fontWeight:700 }}>EXIT ALERT — Max hold reached</div>
            <div style={{ fontSize:10, color:"#663322" }}>{exitAlerts.map(p=>`${p?.ticker} @ $${positions[p?.id]?.entryPrice}`).join(" · ")} — Sell today.</div>
          </div>
        </div>
      )}
      {earnAlerts.length>0 && (
        <div style={{ background:"#0e0000", borderBottom:"1px solid #ff444422", padding:"6px 20px", display:"flex", gap:10, alignItems:"center", flexShrink:0 }}>
          <span style={{ fontSize:12 }}>📅</span>
          <div style={{ fontSize:9, color:"#cc3333" }}>{earnAlerts.map(p=>`${p?.ticker} earns ${p?.earnings?.next_date}`).join(" · ")} — Exit options before earnings.</div>
        </div>
      )}
      {stopHits.length>0 && (
        <div className="urgent" style={{ background:"#110005", borderBottom:"1px solid #ff3355", padding:"8px 20px", display:"flex", gap:12, alignItems:"center", flexShrink:0 }}>
          <span style={{ fontSize:16 }}>🛑</span>
          <div>
            <div style={{ fontSize:11, color:"#ff3355", fontWeight:700 }}>STOP HIT — SELL NOW</div>
            <div style={{ fontSize:10, color:"#663322" }}>{stopHits.map(p=>`${p?.ticker} @ stop $${positions[p?.id]?.stopPrice}`).join(" · ")}</div>
          </div>
        </div>
      )}
      {winLocks.length>0 && (
        <div style={{ background:"#001a0e", borderBottom:"1px solid #00ff8844", padding:"6px 20px", display:"flex", gap:10, alignItems:"center", flexShrink:0 }}>
          <span style={{ fontSize:12 }}>💰</span>
          <div style={{ fontSize:9, color:"#00cc66" }}>
            <b>LOCK THE WIN:</b> {winLocks.map(p=>p?.ticker).join(" · ")} at +50%+ — trim 50%, move stop to entry, let the rest ride.
          </div>
        </div>
      )}
      <div style={{ background:"#060b10", borderBottom:"1px solid #0e1a24", flexShrink:0 }}>
        <div style={{ display:"flex", alignItems:"center", gap:0, padding:"0 20px", height:50 }}>
          <div style={{ marginRight:20 }}>
            <div style={{ fontSize:10, color:"#7591a8", letterSpacing:"0.2em", fontWeight:500 }}>UNUSUAL WHALES · PAID</div>
            <div style={{ fontSize:16, fontWeight:700, color:"#eaf2ff", letterSpacing:"-0.005em" }}>⚡ WallstreetHustler · Squeeze Scanner</div>
          </div>
          <div style={{ width:1, height:30, background:"#1a2a3a", marginRight:20 }}/>
          <div style={{ display:"flex", alignItems:"center", gap:8, marginRight:20 }}>
            <div className={loading?"":(liveMode?"live":"")} style={{ width:8, height:8, borderRadius:"50%", background:!liveMode?"#5a7a92":error?"#ff3355":loading?"#ffe033":paused?"#6e88a0":"#00ff88", boxShadow:`0 0 8px ${!liveMode?"#5a7a9266":error?"#ff3355":loading?"#ffe033":paused?"#6e88a0":"#00ff88"}66` }}/>
            <span title={liveMode?undefined:"The paid options-flow feed is not connected. Every other panel still works."}
                  style={{ fontSize:11, fontWeight:600, color:!liveMode?"#7591a8":error?"#ff3355":loading?"#ffe033":paused?"#8aa3b8":"#00ff88", letterSpacing:"0.1em" }}>{!liveMode?"FLOW OFF":error?"ERROR":loading?"SCANNING…":paused?"PAUSED":"LIVE"}</span>
            <span title={barStatus.state==="ok"
                    ? `Daily bars via ${barStatus.provider} · ${barStatus.scored}/${barStatus.requested} scored${barStatus.failed?` · ${barStatus.failed} unavailable`:""}`
                    : barStatus.message || "No market-data provider configured on the server."}
                  style={{ fontSize:10, fontWeight:600, letterSpacing:"0.08em", padding:"3px 8px", borderRadius:3,
                           color: barStatus.state==="ok" ? "#66ffcc" : barStatus.state==="loading" ? "#ffe033" : "#7591a8",
                           background: barStatus.state==="ok" ? "#66ffcc12" : "#7591a812",
                           border:`1px solid ${barStatus.state==="ok" ? "#66ffcc44" : "#7591a833"}` }}>
              {barStatus.state==="ok" ? `📈 ${barStatus.scored} SCORED` : barStatus.state==="loading" ? "📈 LOADING…" : "📈 NO DATA"}
            </span>
          </div>
          <div style={{ width:1, height:30, background:"#1a2a3a", marginRight:20 }}/>
          <div style={{ marginRight:20 }}>
            <div style={{ fontSize:10, color:"#7591a8", letterSpacing:"0.15em", fontWeight:500 }}>MARKET</div>
            <div style={{ fontSize:13, fontWeight:700, color:biasC, letterSpacing:"0.03em" }}>{bias}</div>
          </div>
          {hcCount>0 && <div style={{ marginRight:8, padding:"4px 10px", background:"#ffe03318", border:"1px solid #ffe03344", fontSize:10, fontWeight:600, color:"#ffe033", borderRadius:3 }}>{hcCount} HIGH CONV</div>}
          {scCount>0 && <div style={{ marginRight:8, padding:"4px 10px", background:"#00ddff18", border:"1px solid #00ddff44", fontSize:10, fontWeight:600, color:"#00ddff", borderRadius:3 }}>📊 {scCount} STAIRCASE</div>}
          {gexAmp>0 && <div title={`GEX amplifying ${gexAmp} setup${gexAmp>1?"s":""} — dealers ${gexShort?"short gamma on "+gexShort+" squeeze"+(gexShort>1?"s":""):""}${gexShort&&gexLong?", ":""}${gexLong?"long gamma on "+gexLong+" flush"+(gexLong>1?"es":""):""}`} style={{ marginRight:8, padding:"4px 10px", background:"#ff88cc18", border:"1px solid #ff88cc55", fontSize:10, fontWeight:600, color:"#ff88cc", borderRadius:3 }}>🔥 {gexAmp} GEX{gexShort>0?` ↑${gexShort}`:""}{gexLong>0?` ↓${gexLong}`:""}</div>}
          {trackedCount>0 && <div onClick={()=>setViewMode(v=>v==="top10"?"live":"top10")} title={viewMode==="top10" ? "Click to return to LIVE view" : "Click to open the 30-day backup list — pre-squeeze builds tracked across days"} style={{ marginRight:8, padding:"4px 10px", background: viewMode==="top10" ? "#66ccff33" : "#66ccff18", border:`1px solid ${viewMode==="top10" ? "#66ccff" : "#66ccff44"}`, fontSize:10, fontWeight:700, color:"#66ccff", borderRadius:3, cursor:"pointer", letterSpacing:"0.04em" }}>🧠 {trackedCount} TRACKED · {viewMode==="top10" ? "← BACK TO LIVE" : "VIEW 30D"}</div>}
          {usage.scans>0 && (() => {
            const cost = (usage.in*3 + usage.out*15) / 1e6;
            const perScan = cost / usage.scans;
            return <div title={`Session: ${usage.scans} scan${usage.scans>1?"s":""} · ${usage.in.toLocaleString()} in / ${usage.out.toLocaleString()} out tokens · ~$${perScan.toFixed(3)}/scan · model: claude-sonnet-4-5 ($3/M in, $15/M out)`} style={{ marginRight:8, padding:"4px 10px", background:"#ffcc6618", border:"1px solid #ffcc6644", fontSize:10, fontWeight:600, color:"#ffcc66", borderRadius:3 }}>💰 ${cost.toFixed(2)} · {usage.scans} scan{usage.scans>1?"s":""}</div>;
          })()}
          {error && <div style={{ padding:"3px 10px", background:"#ff000011", border:"1px solid #ff333322", fontSize:9, color:"#ff3355", maxWidth:200, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>✗ {error}</div>}
          <div style={{ marginLeft:"auto", display:"flex", alignItems:"center", gap:8, flexWrap:"wrap" }}>
            <button onClick={()=>setUi("simple")} title="Back to the plain-English view"
              style={{ background:"#0d1a26", border:"1px solid #66ccff55", color:"#66ccff", fontSize:11.5, fontWeight:700,
                       padding:"7px 12px", borderRadius:4, cursor:"pointer", fontFamily:"inherit", letterSpacing:"0.04em" }}>
              ← SIMPLE VIEW
            </button>
            {/* Ticker search — bigger, with clear button */}
            <div style={{ position:"relative", display:"flex", alignItems:"center" }}>
              <input value={ticker} onChange={e=>setTicker(e.target.value.toUpperCase())} placeholder="🔎 TICKER"
                style={{ width:140, background:"#080e16", border:`1px solid ${ticker?"#ffe03355":"#15212e"}`, color:"#d0deec", padding:"7px 28px 7px 12px", fontSize:13, outline:"none", borderRadius:4, letterSpacing:"0.05em", fontWeight:600 }}/>
              {ticker && (
                <button onClick={()=>setTicker("")} title="Clear" style={{ position:"absolute", right:4, top:"50%", transform:"translateY(-50%)", background:"transparent", border:"none", color:"#7591a8", fontSize:16, cursor:"pointer", padding:"0 6px", lineHeight:1 }}>✕</button>
              )}
            </div>
            {/* Filter selects — readable font */}
            <select value={minPrem} onChange={e=>setMinPrem(+e.target.value)} title="Minimum premium filter" style={{ background:"#080e16", border:"1px solid #15212e", color:"#9fb5c8", padding:"7px 8px", fontSize:12, outline:"none", cursor:"pointer", borderRadius:3 }}>
              {[0,50000,100000,250000,500000].map(v=><option key={v} value={v}>{v===0?"Any $":v>=1e6?`$${v/1e6}M+`:`$${v/1e3}K+`}</option>)}
            </select>
            <select value={minProb} onChange={e=>setMinProb(+e.target.value)} title="Minimum win probability" style={{ background:"#080e16", border:"1px solid #15212e", color:"#9fb5c8", padding:"7px 8px", fontSize:12, outline:"none", cursor:"pointer", borderRadius:3 }}>
              {[70,60,50,40,30,0].map(v=><option key={v} value={v}>{v===0?"Any score":`Score ${v}+`}</option>)}
            </select>
            <select value={pollSec} onChange={e=>setPollSec(+e.target.value)} title="Poll interval" style={{ background:"#080e16", border:"1px solid #15212e", color:"#9fb5c8", padding:"7px 8px", fontSize:12, outline:"none", cursor:"pointer", borderRadius:3 }}>
              {[60,90,120,180].map(v=><option key={v} value={v}>{v}s poll</option>)}
            </select>
            {/* Toggle buttons — bigger fonts, tooltips */}
            {[
              { icon:"📡", label:"LIVE",   active:viewMode==="live",  onClick:()=>setViewMode("live"),  ac:"#00ff88", tip:"Live feed view" },
              { icon:"🏆", label:"30D",   active:viewMode==="top10", onClick:()=>setViewMode("top10"), ac:"#66ccff", tip:"30-day backup — tracked builds" },
              { icon:"🎯", label: gateOn?"70%":"OFF", active:gateOn, onClick:()=>setGateOn(g=>!g), ac:"#00ff88", tip:"70% win-prob gate" },
              { icon:"⚡", label:"CONF", active:confirmed, onClick:()=>setConfirmed(p=>!p), ac:"#ffe033", tip:"Only confirmed (sweep + DP)" },
              { icon:soundOn?"🔔":"🔕", label:"", active:soundOn, onClick:()=>setSoundOn(p=>!p), ac:"#00ff88", tip:"Sound alerts" },
              { icon:"⟳", label:"", active:false, onClick:manualFetch, disabled:loading, tip:"Manual refresh" },
              { icon:paused?"▶":"⏸", label:"", active:paused, onClick:()=>setPaused(p=>!p), ac:"#6080a0", tip:paused?"Resume":"Pause" },
              { icon:"🧮", label:"V4", active:showV4, onClick:()=>setShowV4(p=>!p), ac:"#66ffcc", tip:"V4 quant grid — SCORE / DIR / CONF / STABLE / EARLY, same math as FINAL_V4 ThinkScript" },
              { icon:"🧠", label:"BRAIN", active:showBrain, onClick:()=>setShowBrain(p=>!p), ac:"#c9a5ff", tip:"Market Brain — regime, catalysts, danger zones, best setups" },
              { icon:"📡", label:"INTEL", active:showIntel, onClick:()=>setShowIntel(p=>!p), ac:"#66ccff", tip:"Live catalyst intelligence — news impact / direction / confidence, calendar, reaction stats" },
              { icon: tradeMode==="safe"?"🛡":"⚙", label: tradeMode==="safe"?"SAFE":"PRO", active:true, onClick:()=>setTradeMode(m=>m==="safe"?"pro":"safe"), ac: tradeMode==="safe"?"#00ff88":"#ffe033", tip:"Safe Mode raises every gate and stands down near critical events. Pro Mode shows everything." },
              { icon:"◈", label:"POLY", active:showPoly, onClick:()=>setShowPoly(p=>!p), ac:"#44ffdd", tip:"Poly Intelligence — pair edge after costs, temporal pairing, wallet provenance, paper lab. Read-only, no execution." },
              { icon:"💰", label:"INCOME", active:showIncome, onClick:()=>setShowIncome(p=>!p), ac:"#ffcc66", tip:"Income ETF Lab — option-income funds, monthly cash, compounding model" },
              { icon:"≡", label:"LOG", active:showLog, onClick:()=>setShowLog(p=>!p), ac:"#7aaed0", tip:"Activity log" },
            ].map(({icon,label,active,onClick,disabled,ac="#ffe033",tip})=>(
              <button key={icon+label} onClick={disabled?undefined:onClick} title={tip}
                style={{ padding:"7px 11px", background:active?"#080e16":"transparent", border:`1px solid ${active?ac+"66":"#15212e"}`, color:disabled?"#3e5268":active?ac:"#7591a8", fontSize:12, fontWeight:600, cursor:disabled?"default":"pointer", display:"flex", alignItems:"center", gap:5, letterSpacing:"0.06em", borderRadius:3 }}>
                {icon}{label&&<span>{label}</span>}
              </button>
            ))}
          </div>
        </div>
        {(() => {
          // PLAYBOOK BAR — current step (based on ET clock) + next step preview
          let curIdx = -1;
          for (let i = 0; i < PLAYBOOK.length; i++) { if (PLAYBOOK[i].t <= nowMin) curIdx = i; else break; }
          const cur  = curIdx >= 0 ? PLAYBOOK[curIdx]  : null;
          const nxt  = PLAYBOOK[curIdx + 1] || null;
          const nowLabel = (() => { const h = Math.floor(nowMin/60), m = nowMin%60; const am = h<12; const hh = ((h+11)%12)+1; return `${hh}:${m.toString().padStart(2,"0")} ${am?"AM":"PM"} ET`; })();
          return (
            <div style={{ borderTop:"1px solid #0e1a24", background:"#04080c" }}>
              <div onClick={()=>setPbOpen(o=>!o)} style={{ display:"flex", gap:14, padding:"7px 20px", cursor:"pointer", alignItems:"center", flexWrap:"wrap" }}>
                <span style={{ fontSize:11, color:"#7591a8", letterSpacing:"0.12em", fontWeight:600 }}>📖 PLAYBOOK</span>
                <span style={{ fontSize:10, color:"#5a7a92" }}>{nowLabel}</span>
                {cur ? (
                  <span style={{ fontSize:11, color:cur.color, fontWeight:600 }}>NOW · {cur.time} · {cur.title}</span>
                ) : (
                  <span style={{ fontSize:11, color:"#5a7a92", fontStyle:"italic" }}>Pre-market starts at 8:30 AM ET</span>
                )}
                {nxt && (
                  <span style={{ fontSize:10, color:"#7591a8" }}>→ NEXT: <span style={{ color:nxt.color }}>{nxt.time} · {nxt.title}</span></span>
                )}
                <span style={{ marginLeft:"auto", display:"flex", gap:14, alignItems:"center" }}>
                  <span style={{ fontSize:10, color:"#5a7a92" }}>{feed.length} signals</span>
                  <span onClick={e=>{e.stopPropagation(); setShowLegend(s=>!s);}} title="Show/hide icon legend" style={{ fontSize:10, color:showLegend?"#ffe033":"#5a7a92", border:`1px solid ${showLegend?"#ffe03344":"#1a2a3a"}`, padding:"2px 7px", borderRadius:3, cursor:"pointer" }}>?</span>
                  <span style={{ fontSize:10, color:"#7591a8" }}>{pbOpen ? "▴ collapse" : "▾ expand"}</span>
                </span>
              </div>
              {pbOpen && (
                <div style={{ padding:"12px 20px 16px", borderTop:"1px solid #0e1a24", background:"#06101a" }}>
                  {cur && (
                    <div style={{ background:"#080e16", border:`1px solid ${cur.color}55`, borderLeft:`3px solid ${cur.color}`, padding:"10px 14px", marginBottom:10, borderRadius:4 }}>
                      <div style={{ fontSize:10, color:cur.color, fontWeight:700, letterSpacing:"0.12em", marginBottom:4 }}>NOW · {cur.phase.toUpperCase()}</div>
                      <div style={{ fontSize:14, color:"#eaf2ff", fontWeight:700, marginBottom:6 }}>{cur.time} · {cur.title}</div>
                      <div style={{ fontSize:12, color:"#b0c4d8", lineHeight:1.6 }}>{cur.body}</div>
                    </div>
                  )}
                  {nxt && (
                    <div style={{ background:"#04080c", border:`1px solid #0e1a24`, borderLeft:`3px solid ${nxt.color}88`, padding:"8px 14px", marginBottom:10, borderRadius:4, opacity:0.85 }}>
                      <div style={{ fontSize:10, color:nxt.color, fontWeight:600, letterSpacing:"0.12em", marginBottom:3 }}>NEXT · {nxt.phase.toUpperCase()}</div>
                      <div style={{ fontSize:12, color:"#cfdde9", fontWeight:600, marginBottom:4 }}>{nxt.time} · {nxt.title}</div>
                      <div style={{ fontSize:11, color:"#9bb3c6", lineHeight:1.55 }}>{nxt.body}</div>
                    </div>
                  )}
                  <div style={{ display:"flex", gap:6, flexWrap:"wrap", marginTop:10 }}>
                    {PLAYBOOK.map((s, i) => {
                      const isCur = i === curIdx, isPast = i < curIdx;
                      return (
                        <span key={s.t} style={{ fontSize:9, padding:"3px 7px", borderRadius:3, border:`1px solid ${isCur?s.color:"#1a2a3a"}`, background:isCur?s.color+"22":"transparent", color:isCur?s.color:isPast?"#3a5060":"#7591a8", textDecoration:isPast?"line-through":"none", letterSpacing:"0.04em" }} title={s.title}>
                          {s.time}
                        </span>
                      );
                    })}
                  </div>
                </div>
              )}
              {showLegend && (
                <div style={{ display:"flex", gap:18, padding:"6px 20px", borderTop:"1px solid #0e1a24", background:"#04080c", flexWrap:"wrap" }}>
                  {[{i:"📊",t:"Staircase = 3+ day DP accumulation",c:"#00ddff"},{i:"👀",t:"Early = staircase, no sweep yet",c:"#22aacc"},{i:"⚡",t:"Both = sweep + DP confirmed",c:"#ffe033"},{i:"γ↑",t:"Short gamma = squeeze amplified",c:"#ff88cc"},{i:"γ↓",t:"Long gamma = flush amplified",c:"#ff6600"},{i:"⚠",t:"High IV = use spread",c:"#ffaa44"}].map(({i,t,c})=>(
                    <span key={i} style={{ fontSize:10, display:"flex", gap:6, alignItems:"center" }}><span style={{color:c, fontWeight:700}}>{i}</span><span style={{color:"#7591a8"}}>{t}</span></span>
                  ))}
                </div>
              )}
            </div>
          );
        })()}
      </div>

      {showBrain && <MarketBrain brain={brain} mode={tradeMode} onMode={setTradeMode} modeResult={modeResult} onClose={()=>setShowBrain(false)} now={nowMs}/>}
      {showPoly && <PolyTab onClose={()=>setShowPoly(false)} markets={polyMarkets} catalystEvents={catalystEvents} now={nowMs}/>}
      {showIntel && <IntelTab onClose={()=>setShowIntel(false)} events={catalystEvents} feed={feed}
                              calendar={scheduled} macroRiskScore={brain.macroRisk} stats={intelStats}
                              now={nowMs} ingestStatus={ingestStatus}/>}
      {showV4 && <V4Grid feed={scanFeed} onClose={()=>setShowV4(false)} modeResult={modeResult} mode={tradeMode}/>}
      {showIncome && <IncomeTab onClose={()=>setShowIncome(false)}/>}

      <div style={{ display:"grid", gridTemplateColumns:showLog?"1fr 1fr 0.7fr 200px":"1fr 1fr 0.7fr", flex:1, overflow:"hidden", background:"#05090e" }}>
        <Column title="🚀 SQUEEZES" color="#00ff88" items={squeezes} openId={openId} onToggle={toggle} positions={positions} onSave={savePos} newIds={newIds} viewMode={viewMode} sortMode={sortMode} topEntries={topSq} macroBias={bias}/>
        <Column title="🩸 FLUSHES"  color="#ff3355" items={flushes}  openId={openId} onToggle={toggle} positions={positions} onSave={savePos} newIds={newIds} viewMode={viewMode} sortMode={sortMode} topEntries={topFl} macroBias={bias}/>
        <Column title="📊 MACRO/ETF" color="#66ccff" items={macros}  openId={openId} onToggle={toggle} positions={positions} onSave={savePos} newIds={newIds} viewMode={viewMode} sortMode={sortMode} topEntries={topMc} macroBias={bias}/>
        {showLog && (
          <div style={{ display:"flex", flexDirection:"column", background:"#04080c", borderLeft:"1px solid #0e1a24" }}>
            <div style={{ padding:"10px 14px", borderBottom:"1px solid #1a2a3a", fontSize:11, color:"#a7c0d4", letterSpacing:"0.14em", fontWeight:700 }}>ACTIVITY LOG</div>
            <div style={{ overflowY:"auto", flex:1, padding:"10px 12px" }}>
              {logs.map((l,i)=><div key={i} style={{ fontSize:11, color:l.includes("✓")?"#44ddaa":l.includes("✗")?"#ff7799":"#9bb3c6", marginBottom:5, lineHeight:1.6, paddingLeft:10, borderLeft:`2px solid ${l.includes("✓")?"#00ff8866":l.includes("✗")?"#ff335566":"#1a2a3a"}`, fontFamily:"'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" }}>{l}</div>)}
              {!logs.length && <div style={{ fontSize:11, color:"#7591a8", fontStyle:"italic" }}>Waiting for first scan…</div>}
            </div>
          </div>
        )}
      </div>

      <div style={{ padding:"6px 20px", background:"#04080c", borderTop:"1px solid #0e1a24", fontSize:10, color:"#7591a8", display:"flex", justifyContent:"space-between", flexShrink:0, gap:12 }}>
        <span>flow-alerts · darkpool · market-tide · earnings · congress · insider · news · fda · shorts · gex · vol · price-levels · 30d backup</span>
        <span style={{whiteSpace:"nowrap", color:"#8aa3b8"}}>BETA / PAPER ONLY / ⚠ Education only · Not financial advice</span>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
