<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>APEX V4 — Quantitative Scanner</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #0d1117; --surface: #161b22; --surface2: #1c2128;
      --border:  #21262d; --border2: #30363d;
      --text:    #e6edf3; --muted:   #7d8590; --dim:     #484f58;
      --green:   #3fb950; --red:     #f85149; --blue:    #58a6ff;
      --yellow:  #d29922; --purple:  #bc8cff; --orange:  #f0883e;
    }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; line-height: 1.5; }
    button { font-family: inherit; cursor: pointer; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
    .spin { animation: pulse 1.5s ease-in-out infinite; }

    /* ── NAV ── */
    #nav { display:flex; align-items:center; padding:0 20px; height:52px; background:var(--surface); border-bottom:1px solid var(--border); gap:16px; flex-shrink:0; }
    #nav h1 { font-size:15px; font-weight:800; letter-spacing:-.02em; margin-right:8px; }
    #nav h1 span { color:var(--blue); }
    .tab-btn { padding:0 14px; height:100%; background:transparent; border:none; border-bottom:2px solid transparent; color:var(--muted); font-size:12px; font-weight:500; cursor:pointer; transition:all .15s; }
    .tab-btn.active { border-color:var(--blue); color:var(--text); font-weight:600; }
    .tab-btn:hover { color:var(--text); }
    #status-row { margin-left:auto; display:flex; align-items:center; gap:12px; font-size:11px; color:var(--muted); }
    .dot { width:7px; height:7px; border-radius:50%; background:var(--dim); }
    .dot.live { background:var(--green); box-shadow:0 0 5px var(--green); }
    .dot.loading { background:var(--yellow); animation:pulse 1s infinite; }

    /* ── TOOLBAR ── */
    #toolbar { padding:10px 20px; background:var(--surface); border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; flex-wrap:wrap; flex-shrink:0; }
    .view-btn { padding:5px 12px; border-radius:5px; border:1px solid var(--border); background:transparent; color:var(--muted); font-size:11px; font-weight:600; letter-spacing:.04em; cursor:pointer; transition:all .15s; }
    .view-btn.active, .view-btn:hover { border-color:var(--blue); color:var(--blue); background:rgba(88,166,255,.1); }
    #search { padding:5px 10px; border:1px solid var(--border); border-radius:5px; background:var(--surface2); color:var(--text); font-size:12px; width:110px; outline:none; }
    #search:focus { border-color:var(--blue); }
    .ctrl-btn { padding:5px 12px; border-radius:5px; border:1px solid var(--border2); background:var(--surface2); color:var(--text); font-size:11px; font-weight:600; cursor:pointer; }
    .ctrl-btn:hover { background:var(--border2); }
    .ctrl-btn.primary { border-color:var(--green); background:rgba(63,185,80,.12); color:var(--green); }
    .ctrl-btn.primary:hover { background:rgba(63,185,80,.22); }
    #toolbar .sep { width:1px; height:22px; background:var(--border); }
    #scan-status { font-size:11px; color:var(--muted); }

    /* ── TABLE ── */
    #table-wrap { flex:1; overflow:auto; }
    table { width:100%; border-collapse:collapse; min-width:900px; }
    thead th { position:sticky; top:0; background:var(--surface); padding:8px 12px; text-align:left; font-size:10px; font-weight:700; color:var(--muted); letter-spacing:.1em; text-transform:uppercase; border-bottom:1px solid var(--border); white-space:nowrap; cursor:pointer; user-select:none; }
    thead th:hover { color:var(--text); }
    thead th.sorted { color:var(--blue); }
    thead th .sort-arrow { margin-left:4px; opacity:.6; }
    tbody tr { border-bottom:1px solid var(--border); transition:background .1s; cursor:pointer; }
    tbody tr:hover { background:var(--surface2); }
    tbody tr.expanded { background:var(--surface2); }
    td { padding:9px 12px; font-size:12px; vertical-align:middle; }
    td.sym { font-size:14px; font-weight:700; color:var(--text); font-family:monospace; }

    /* ── PILLS ── */
    .pill { display:inline-flex; align-items:center; padding:2px 7px; border-radius:4px; font-size:10px; font-weight:700; letter-spacing:.04em; white-space:nowrap; }
    .num { font-family:monospace; font-size:12px; font-weight:600; }

    /* ── EXPAND DRAWER ── */
    .detail-row td { padding:0; background:var(--surface2); }
    .detail-inner { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:1px; background:var(--border); border-top:1px solid var(--border); }
    .detail-cell { background:var(--surface2); padding:12px 16px; }
    .detail-label { font-size:10px; color:var(--muted); font-weight:700; letter-spacing:.1em; text-transform:uppercase; margin-bottom:5px; }
    .detail-val { font-size:15px; font-weight:700; }
    .detail-sub { font-size:11px; color:var(--muted); margin-top:2px; }

    /* ── EMPTY STATE ── */
    #empty { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:80px 20px; color:var(--muted); gap:14px; }
    #empty h2 { font-size:16px; color:var(--text); }

    /* ── DETAIL PANEL (single symbol) ── */
    #detail-panel { display:none; flex-direction:column; height:100%; border-left:1px solid var(--border); overflow:auto; padding:24px; min-width:320px; max-width:420px; flex-shrink:0; }
    #detail-panel.open { display:flex; }
    #detail-panel h2 { font-size:20px; font-weight:800; margin-bottom:2px; }
    .dp-section { margin-bottom:20px; }
    .dp-section h3 { font-size:10px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:10px; }
    .dp-row { display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px solid var(--border); }
    .dp-label { font-size:12px; color:var(--muted); }
    .dp-value { font-size:12px; font-weight:700; }
    .close-btn { margin-left:auto; background:transparent; border:1px solid var(--border); color:var(--muted); border-radius:5px; padding:4px 10px; font-size:12px; cursor:pointer; }
    .close-btn:hover { color:var(--text); border-color:var(--border2); }

    /* ── LAYOUT ── */
    #main { display:flex; flex-direction:column; height:100vh; }
    #content { display:flex; flex:1; overflow:hidden; }
    #table-area { flex:1; display:flex; flex-direction:column; overflow:hidden; }
    #error-bar { padding:8px 20px; background:rgba(248,81,73,.1); border-bottom:1px solid rgba(248,81,73,.3); color:var(--red); font-size:12px; display:none; }
  </style>
</head>
<body>
<div id="main">
  <nav id="nav">
    <h1>APEX <span>V4</span></h1>
    <button class="tab-btn active" data-tab="scanner">Scanner</button>
    <button class="tab-btn" data-tab="detail-view">Symbol Detail</button>
    <div id="status-row">
      <div class="dot" id="dot"></div>
      <span id="status-text">Idle</span>
      <span id="credits-text"></span>
    </div>
  </nav>

  <div id="error-bar"></div>

  <div id="toolbar">
    <button class="view-btn active" data-view="">ALL</button>
    <button class="view-btn" data-view="master">MASTER</button>
    <button class="view-btn" data-view="apex_long">APEX LONG</button>
    <button class="view-btn" data-view="apex_short">APEX SHORT</button>
    <button class="view-btn" data-view="breakout">BREAKOUT</button>
    <button class="view-btn" data-view="squeeze_fire">SQZ FIRE</button>
    <button class="view-btn" data-view="high_rvol">HIGH RVOL</button>
    <button class="view-btn" data-view="early_entry">EARLY</button>
    <button class="view-btn" data-view="momentum">MOMENTUM</button>
    <button class="view-btn" data-view="reversal">REVERSAL</button>
    <div class="sep"></div>
    <input id="search" placeholder="Filter ticker…" autocomplete="off"/>
    <button id="scan-btn" class="ctrl-btn primary">▶ Run Scan</button>
    <div class="sep"></div>
    <span id="scan-status"></span>
  </div>

  <div id="content">
    <div id="table-area">
      <div id="table-wrap">
        <table id="results-table">
          <thead>
            <tr>
              <th data-col="symbol">SYMBOL <span class="sort-arrow">↕</span></th>
              <th data-col="price">LAST <span class="sort-arrow">↕</span></th>
              <th data-col="apexScore">APEX <span class="sort-arrow">↕</span></th>
              <th data-col="direction">DIR <span class="sort-arrow">↕</span></th>
              <th data-col="confidence">CONF <span class="sort-arrow">↕</span></th>
              <th data-col="stable">STABLE <span class="sort-arrow">↕</span></th>
              <th data-col="atrPct">ATR% <span class="sort-arrow">↕</span></th>
              <th data-col="relVol">RVOL <span class="sort-arrow">↕</span></th>
              <th data-col="darvasState">DARVAS <span class="sort-arrow">↕</span></th>
              <th data-col="sqzState">SQZ <span class="sort-arrow">↕</span></th>
              <th data-col="flow">FLOW <span class="sort-arrow">↕</span></th>
              <th data-col="spreadPct">SPREAD <span class="sort-arrow">↕</span></th>
              <th data-col="earningsRisk">ERN <span class="sort-arrow">↕</span></th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
        <div id="empty" style="display:none">
          <div style="font-size:36px">📡</div>
          <h2>No data yet</h2>
          <p>Click <strong>▶ Run Scan</strong> to fetch and score your universe.</p>
        </div>
      </div>
    </div>

    <div id="detail-panel">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px">
        <h2 id="dp-symbol">—</h2>
        <span id="dp-price" style="font-size:16px;color:var(--muted)"></span>
        <button class="close-btn" onclick="closeDetail()">✕ Close</button>
      </div>
      <div id="dp-body"></div>
    </div>
  </div>
</div>

<script>
// ─── STATE ─────────────────────────────────────────────────────────────────────
let allResults = [];
let sortCol    = 'apexScore';
let sortAsc    = false;
let activeView = '';
let searchQ    = '';
let expandedId = null;

// ─── UTILS ─────────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const q = sel => document.querySelector(sel);

function apiFetch(url, opts) {
  return fetch(url, opts).then(r => {
    if (!r.ok) return r.json().then(e => { throw new Error(e.error || `HTTP ${r.status}`); });
    return r.json();
  });
}

function showError(msg) {
  const bar = $('error-bar');
  bar.textContent = '⚠ ' + msg;
  bar.style.display = 'block';
  setTimeout(() => bar.style.display = 'none', 8000);
}

function setStatus(state, text) {
  const dot  = $('dot');
  const st   = $('status-text');
  dot.className = 'dot ' + (state === 'live' ? 'live' : state === 'loading' ? 'loading' : '');
  st.textContent = text;
}

// ─── FORMATTING ────────────────────────────────────────────────────────────────
const fmtN  = v => v == null ? '—' : typeof v === 'number' ? v.toFixed(2) : v;
const fmtP  = v => v == null ? '—' : (+v).toFixed(1) + '%';
const fmtI  = v => v == null ? '—' : Math.round(v);

function dirLabel(d) {
  if (d ==  2) return ['▲▲ STRONG BULL', 'var(--green)'];
  if (d ==  1) return ['▲ BULL',         'var(--green)'];
  if (d ==  0) return ['— NEUTRAL',       'var(--muted)'];
  if (d == -1) return ['▼ BEAR',          'var(--red)'];
  if (d == -2) return ['▼▼ STRONG BEAR', 'var(--red)'];
  return ['—', 'var(--muted)'];
}

function sqzColor(s) {
  if (s === 'FIRING') return 'var(--yellow)';
  if (s === 'ACTIVE') return 'var(--blue)';
  return 'var(--dim)';
}

function regimeColor(r) {
  const map = { BREAKOUT:'var(--yellow)', SQUEEZE:'var(--blue)', TREND:'var(--green)', HIGH_VOL:'var(--orange)', REVERSAL:'var(--purple)', CHOP:'var(--dim)', LOW_VOL:'var(--dim)' };
  return map[r] || 'var(--muted)';
}

function scoreColor(v, hi=80, mid=55) {
  return v >= hi ? 'var(--green)' : v >= mid ? 'var(--yellow)' : 'var(--muted)';
}

function pill(text, color, bg) {
  const b = bg || (color + '22');
  return `<span class="pill" style="color:${color};background:${b};border:1px solid ${color}55">${text}</span>`;
}

function earnBadge(risk) {
  if (!risk) return '<span style="color:var(--dim)">—</span>';
  const c = risk === 3 ? 'var(--red)' : risk === 2 ? 'var(--orange)' : 'var(--yellow)';
  const l = risk === 3 ? '🔴 DANGER' : risk === 2 ? '⚠ CAUTION' : '👁 WATCH';
  return `<span class="pill" style="color:${c};background:${c}22;border:1px solid ${c}55">${l}</span>`;
}

// ─── RENDER TABLE ──────────────────────────────────────────────────────────────
function renderTable() {
  let rows = [...allResults];

  // Apply view filter
  if (activeView) {
    apiFetch(`/api/view/${activeView}`)
      .then(data => {
        rows = data.results || [];
        if (searchQ) rows = rows.filter(r => r.symbol.includes(searchQ.toUpperCase()));
        _renderRows(rows);
      })
      .catch(e => showError('View error: ' + e.message));
    return;
  }

  if (searchQ) rows = rows.filter(r => r.symbol.includes(searchQ.toUpperCase()));

  rows.sort((a, b) => {
    let av = a[sortCol], bv = b[sortCol];
    if (av == null) av = sortAsc ? Infinity : -Infinity;
    if (bv == null) bv = sortAsc ? Infinity : -Infinity;
    if (typeof av === 'string') return sortAsc ? av.localeCompare(bv) : bv.localeCompare(av);
    return sortAsc ? av - bv : bv - av;
  });

  _renderRows(rows);
}

function _renderRows(rows) {
  const tbody = $('tbody');
  const empty = $('empty');

  if (!rows.length) {
    tbody.innerHTML = '';
    empty.style.display = 'flex';
    return;
  }
  empty.style.display = 'none';

  tbody.innerHTML = rows.map(r => {
    const [dirTxt, dirC] = dirLabel(r.direction);
    const apexC   = scoreColor(r.apexScore, 75, 50);
    const stableC = scoreColor(r.stable, 75, 50);
    const confC   = scoreColor(r.confidence, 75, 50);
    const sqzC    = sqzColor(r.sqzState);
    const flowC   = (r.flow ?? 0) > 25 ? 'var(--green)' : (r.flow ?? 0) < -25 ? 'var(--red)' : 'var(--muted)';
    const spreadC = r.spreadPct > 1 ? 'var(--red)' : r.spreadPct > 0.5 ? 'var(--orange)' : 'var(--muted)';
    const id      = r.symbol;

    return `<tr data-id="${id}" onclick="toggleRow('${id}')">
      <td class="sym">${r.symbol}</td>
      <td><span class="num">$${fmtN(r.price)}</span></td>
      <td><span class="num" style="color:${apexC};font-size:14px;font-weight:800">${fmtI(r.apexScore)}</span></td>
      <td><span style="color:${dirC};font-size:11px;font-weight:700">${dirTxt}</span></td>
      <td><span class="num" style="color:${confC}">${fmtI(r.confidence)}%</span></td>
      <td><span class="num" style="color:${stableC}">${fmtI(r.stable)}</span>
          ${r.stableBand ? `<span style="font-size:10px;color:var(--dim);margin-left:4px">${r.stableBand}</span>` : ''}</td>
      <td><span class="num" style="color:${scoreColor(r.atrPct,2,1)}">${fmtP(r.atrPct)}</span></td>
      <td><span class="num" style="color:${scoreColor(r.relVol*50,100,75)}">${fmtN(r.relVol)}x</span></td>
      <td>${r.darvasState ? pill(r.darvasState, r.darvasState === 'BREAKOUT' ? 'var(--yellow)' : 'var(--muted)') : '<span style="color:var(--dim)">—</span>'}</td>
      <td>${r.sqzState ? `<span class="pill" style="color:${sqzC};background:${sqzC}22;border:1px solid ${sqzC}55">${r.sqzState}</span>` : '<span style="color:var(--dim)">—</span>'}</td>
      <td><span class="num" style="color:${flowC}">${r.flow != null ? r.flow : '—'}</span></td>
      <td><span style="color:${spreadC}">${r.spreadPct != null ? r.spreadPct.toFixed(2) + '%' : '—'}</span></td>
      <td>${earnBadge(r.earningsRisk)}</td>
    </tr>
    <tr id="detail-${id}" class="detail-row" style="display:none"><td colspan="13"><div class="detail-inner" id="inner-${id}"></div></td></tr>`;
  }).join('');
}

function toggleRow(id) {
  const row    = document.getElementById(`detail-${id}`);
  const inner  = document.getElementById(`inner-${id}`);
  const isOpen = expandedId === id;

  // Close current
  if (expandedId) {
    const prev = document.getElementById(`detail-${expandedId}`);
    if (prev) prev.style.display = 'none';
    document.querySelector(`tr[data-id="${expandedId}"]`)?.classList.remove('expanded');
  }

  if (isOpen) { expandedId = null; return; }
  expandedId = id;
  document.querySelector(`tr[data-id="${id}"]`)?.classList.add('expanded');
  row.style.display = '';

  const r = allResults.find(x => x.symbol === id);
  if (!r) { inner.innerHTML = '<div class="detail-cell" style="color:var(--muted)">No data</div>'; return; }

  const cells = [
    { label:'REGIME',      value: r.regimeLabel || r.regime || '—',    color: regimeColor(r.regime), sub: '' },
    { label:'EARLY ENTRY', value: (r.earlyEntry ?? '—') + (r.earlyEntry != null ? '' : ''), color: scoreColor(r.earlyEntry,70,40), sub: r.earlyBand || '' },
    { label:'RSI 14',      value: r.rsi14 ?? '—', color: r.rsi14 > 70 ? 'var(--red)' : r.rsi14 < 30 ? 'var(--green)' : 'var(--text)', sub: r.rsi14 > 70 ? 'overbought' : r.rsi14 < 30 ? 'oversold' : 'neutral' },
    { label:'ADX 14',      value: r.adx14 ?? '—', color: (r.adx14||0) > 30 ? 'var(--green)' : (r.adx14||0) > 20 ? 'var(--yellow)' : 'var(--muted)', sub: (r.adx14||0) > 30 ? 'strong trend' : (r.adx14||0) > 20 ? 'trending' : 'weak / chop' },
    { label:'EMA 9',       value: r.ema9 != null ? '$' + r.ema9 : '—',  color:'var(--text)', sub:'' },
    { label:'EMA 20',      value: r.ema20 != null ? '$' + r.ema20 : '—', color:'var(--text)', sub:'' },
    { label:'EMA 50',      value: r.ema50 != null ? '$' + r.ema50 : '—', color:'var(--text)', sub:'' },
    { label:'VWAP',        value: r.vwap != null ? '$' + r.vwap : '—',  color:'var(--blue)', sub:'' },
    { label:'DARVAS BIAS', value: r.darvasBias || '—', color: r.darvasBias === 'UP' ? 'var(--green)' : r.darvasBias === 'DOWN' ? 'var(--red)' : 'var(--muted)', sub:'' },
    { label:'SQZ BARS',    value: r.sqzState ? (r.sqzPct + '%') : '—', color: sqzColor(r.sqzState), sub: r.sqzState || '' },
    { label:'FLOW BAND',   value: r.flowBand || '—', color: r.flowBand?.includes('BUY') ? 'var(--green)' : r.flowBand?.includes('SELL') ? 'var(--red)' : 'var(--muted)', sub:'proxy metric' },
    { label:'EARNINGS',    value: r.earningsDate || (r.earningsRisk === 0 ? 'CLEAR' : '—'), color: r.earningsRisk === 3 ? 'var(--red)' : r.earningsRisk >= 1 ? 'var(--yellow)' : 'var(--green)', sub: r.earningsDays != null ? `in ${r.earningsDays}d` : '' },
    { label:'EARLY SIGNALS', value: r.earlySignals?.length ? r.earlySignals.join(', ') : 'none', color:'var(--muted)', sub:'' },
    { label:'SCANNED',     value: r.scannedAt ? r.scannedAt.slice(11,19) + ' UTC' : '—', color:'var(--dim)', sub:'' },
  ];

  inner.innerHTML = cells.map(c => `
    <div class="detail-cell">
      <div class="detail-label">${c.label}</div>
      <div class="detail-val" style="color:${c.color}">${c.value}</div>
      ${c.sub ? `<div class="detail-sub">${c.sub}</div>` : ''}
    </div>`).join('');
}

// ─── SCAN ──────────────────────────────────────────────────────────────────────
async function runScan() {
  const btn = $('scan-btn');
  btn.disabled = true;
  btn.textContent = '⟳ Scanning…';
  setStatus('loading', 'Scanning…');
  $('scan-status').textContent = '';

  try {
    const data = await apiFetch('/api/scan', { method:'POST', headers:{'Content-Type':'application/json'} });
    $('scan-status').textContent = `Started: ${data.symbols} symbols (~${data.estimate?.total ?? '?'} credits, ${data.estimate?.minutesNeeded?.toFixed(1) ?? '?'} min)`;

    // Poll until scan completes
    let polls = 0;
    const poll = setInterval(async () => {
      polls++;
      if (polls > 120) { clearInterval(poll); setStatus('', 'Timed out'); btn.disabled = false; btn.textContent = '▶ Run Scan'; return; }
      try {
        const res = await apiFetch('/api/scan');
        if (res.results?.length > 0) {
          clearInterval(poll);
          allResults = res.results;
          renderTable();
          setStatus('live', `${res.results.length} results`);
          $('scan-status').textContent = `Scanned ${res.meta?.scanned} → ${res.meta?.returned} results in ${(res.meta?.durationMs/1000).toFixed(1)}s`;
          updateCredits();
          btn.disabled = false;
          btn.textContent = '▶ Run Scan';
        }
      } catch (_) {}
    }, 2000);
  } catch (e) {
    showError(e.message);
    setStatus('', 'Error');
    btn.disabled = false;
    btn.textContent = '▶ Run Scan';
  }
}

async function updateCredits() {
  try {
    const c = await apiFetch('/api/credits');
    $('credits-text').textContent = `${c.spent} credits spent`;
  } catch (_) {}
}

// ─── DETAIL PANEL (single-symbol mode) ─────────────────────────────────────────
function closeDetail() {
  $('detail-panel').classList.remove('open');
}

async function showDetailPanel(symbol) {
  const panel = $('detail-panel');
  panel.classList.add('open');
  $('dp-symbol').textContent = symbol;
  $('dp-price').textContent = 'Loading…';
  $('dp-body').innerHTML = '<div style="color:var(--muted);padding:20px 0">Fetching data…</div>';

  try {
    const r = await apiFetch(`/api/symbol/${symbol}`);
    $('dp-price').textContent = r.price ? `$${r.price}` : '';
    const [dirTxt, dirC] = dirLabel(r.direction);

    const sections = [
      { title: 'Scores', rows: [
        ['APEX Score',    r.apexScore,    scoreColor(r.apexScore, 75, 50)],
        ['Direction',     dirTxt,         dirC],
        ['Confidence',    (r.confidence ?? '—') + '%', scoreColor(r.confidence, 75, 50)],
        ['StableScore',   (r.stable ?? '—') + ' ' + (r.stableBand||''), scoreColor(r.stable, 75, 50)],
        ['Early Entry',   (r.earlyEntry ?? '—') + ' — ' + (r.earlyBand||''), scoreColor(r.earlyEntry, 70, 40)],
        ['Regime',        r.regimeLabel || r.regime || '—', regimeColor(r.regime)],
      ]},
      { title: 'Indicators', rows: [
        ['RSI 14',  r.rsi14 ?? '—',  r.rsi14 > 70 ? 'var(--red)' : r.rsi14 < 30 ? 'var(--green)' : 'var(--text)'],
        ['ADX 14',  r.adx14 ?? '—',  (r.adx14||0) > 25 ? 'var(--green)' : 'var(--muted)'],
        ['ATR%',    (r.atrPct ?? '—') + '% ' + (r.atrBand||''), scoreColor(r.atrPct,2.5,1.5)],
        ['RelVol',  (r.relVol ?? '—') + 'x ' + (r.relVolBand||''), scoreColor(r.relVol*50,100,75)],
        ['SmartFlow', (r.flow ?? '—') + ' — ' + (r.flowBand||''), r.flow > 30 ? 'var(--green)' : r.flow < -30 ? 'var(--red)' : 'var(--muted)'],
      ]},
      { title: 'Structure', rows: [
        ['Darvas State', r.darvasState || '—', r.darvasState === 'BREAKOUT' ? 'var(--yellow)' : 'var(--muted)'],
        ['Darvas Bias',  r.darvasBias || '—',  r.darvasBias === 'UP' ? 'var(--green)' : r.darvasBias === 'DOWN' ? 'var(--red)' : 'var(--muted)'],
        ['Squeeze',      (r.sqzState || '—') + (r.sqzPct ? ` ${r.sqzPct}%` : ''), sqzColor(r.sqzState)],
        ['EMA 9/20/50',  `$${r.ema9} / $${r.ema20} / $${r.ema50}`, 'var(--text)'],
        ['VWAP',         r.vwap ? `$${r.vwap}` : '—', 'var(--blue)'],
      ]},
      { title: 'Risk', rows: [
        ['Spread',   r.spreadPct != null ? r.spreadPct + '%' : '—', r.spreadPct > 1 ? 'var(--red)' : 'var(--green)'],
        ['Earnings', r.earningsDate || 'CLEAR', r.earningsRisk === 3 ? 'var(--red)' : r.earningsRisk >= 1 ? 'var(--yellow)' : 'var(--green)'],
        ['Earn Risk', ['CLEAR','WATCH','CAUTION','DANGER'][r.earningsRisk ?? 0], r.earningsRisk === 3 ? 'var(--red)' : r.earningsRisk >= 1 ? 'var(--yellow)' : 'var(--green)'],
        ['Early Signals', r.earlySignals?.join(', ') || 'none', 'var(--muted)'],
      ]},
    ];

    $('dp-body').innerHTML = sections.map(sec => `
      <div class="dp-section">
        <h3>${sec.title}</h3>
        ${sec.rows.map(([l, v, c]) => `
          <div class="dp-row">
            <span class="dp-label">${l}</span>
            <span class="dp-value" style="color:${c}">${v}</span>
          </div>`).join('')}
      </div>`).join('');
  } catch (e) {
    $('dp-body').innerHTML = `<div style="color:var(--red)">Error: ${e.message}</div>`;
  }
}

// ─── DETAIL TAB ────────────────────────────────────────────────────────────────
let detailMode = false;
function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  detailMode = tab === 'detail-view';
  $('toolbar').style.display = detailMode ? 'none' : 'flex';
  $('table-area').style.display = detailMode ? 'none' : 'flex';
  const dp = $('detail-panel');
  if (detailMode) {
    dp.classList.add('open');
    dp.style.minWidth = '100%';
    dp.style.maxWidth = '100%';
    if (!$('dp-search')) {
      const inp = document.createElement('input');
      inp.id = 'dp-search';
      inp.placeholder = 'Enter ticker (e.g. AAPL)…';
      inp.style.cssText = 'width:200px;padding:8px 12px;border:1px solid var(--border2);border-radius:6px;background:var(--surface2);color:var(--text);font-size:13px;outline:none;margin-bottom:20px';
      inp.onkeydown = e => { if (e.key === 'Enter' && inp.value.trim()) showDetailPanel(inp.value.trim().toUpperCase()); };
      dp.insertBefore(inp, dp.firstChild);
    }
  } else {
    dp.classList.remove('open');
    dp.style.minWidth = '';
    dp.style.maxWidth = '420px';
  }
}

// ─── BOOT ──────────────────────────────────────────────────────────────────────
document.querySelectorAll('.tab-btn').forEach(b => b.onclick = () => switchTab(b.dataset.tab));

document.querySelectorAll('.view-btn').forEach(b => b.onclick = () => {
  document.querySelectorAll('.view-btn').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  activeView = b.dataset.view;
  renderTable();
});

document.querySelectorAll('thead th[data-col]').forEach(th => {
  th.onclick = () => {
    const col = th.dataset.col;
    if (sortCol === col) sortAsc = !sortAsc;
    else { sortCol = col; sortAsc = col === 'symbol'; }
    document.querySelectorAll('thead th').forEach(x => x.classList.remove('sorted'));
    th.classList.add('sorted');
    th.querySelector('.sort-arrow').textContent = sortAsc ? '↑' : '↓';
    renderTable();
  };
});

$('scan-btn').onclick = runScan;

$('search').oninput = e => {
  searchQ = e.target.value.trim();
  renderTable();
};

// Show empty state on load
renderTable();

// Load previous scan if available
apiFetch('/api/scan').then(data => {
  if (data.results?.length) {
    allResults = data.results;
    renderTable();
    setStatus('live', `${data.results.length} results (cached)`);
    updateCredits();
  } else {
    $('empty').style.display = 'flex';
  }
}).catch(() => { $('empty').style.display = 'flex'; });
</script>
</body>
</html>
