services:
  - type: web
    name: squeeze-scanner-apex-v4
    runtime: node
    plan: free
    rootDir: apex-v4
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: TWELVEDATA_API_KEY
        sync: false
      - key: CREDITS_PER_MINUTE
        value: 8
      - key: DECISION_LOG
        value: false
      - key: OUTCOME_ADMIN_TOKEN
        sync: false
      # Free plan disk is wiped on every deploy. On a paid plan, attach a disk
      # mounted at /var/data and set OUTCOME_STORE_DIR=/var/data/outcomes and
      # OUTCOME_STORE_PERSISTENT=true.
      - key: OUTCOME_STORE_DIR
        value: ./data/outcomes
