services:
  - type: web
    name: squeeze-scanner-apex-v4
    runtime: node
    plan: free
    rootDir: apex-v4
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: TWELVEDATA_API_KEY
        sync: false
      - key: CREDITS_PER_MINUTE
        value: 8
      - key: DECISION_LOG
        value: false
